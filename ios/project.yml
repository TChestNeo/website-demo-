name: MNationWorld
options:
  bundleIdPrefix: com.mnationworld
  deploymentTarget:
    # iOS 18+：官方 Tab API + .sidebarAdaptable（iPhone 底部 tab / iPad 侧边栏 / iOS 26 Liquid Glass 药丸一次到位）
    iOS: "18.0"
    iPadOS: "18.0"
  createIntermediateGroups: true

targets:
  MNationWorld:
    type: application
    platform: iOS
    sources:
      - MNationWorld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mnationworld.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "M.NationWorld"
        GENERATE_INFOPLIST_FILE: YES
        # iPhone + iPad 一次过（1=iPhone, 2=iPad）
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "6.0"
        # 默认主 actor 隔离（Xcode 26 新工程默认，删掉大部分 @MainActor 标注）
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # 本地化
        DEVELOPMENT_LANGUAGE: zh-Hans
        # App Transport Security：允许 http（本地调试），生产只走 https
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO

schemes:
  MNationWorld:
    build:
      targets:
        MNationWorld: all
    run:
      config: Debug
