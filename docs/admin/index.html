<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 | M.NationWorld</title>
  <meta name="robots" content="noindex,nofollow">

  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    /* 管理后台专用样式（内联中文文案，未走 i18n 机制——见 commit 说明）。
       独立站点 admin.<域名>：自带登录页、无公网站点侧栏。 */
    .adm-shell { max-width: 1100px; margin: 0 auto; padding: var(--space-lg) var(--space-md); }
    .adm-header { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-md);
      flex-wrap: wrap; margin-bottom: var(--space-lg); }
    .adm-header-right { display: flex; align-items: center; gap: var(--space-sm); }

    .adm-login { max-width: 520px; margin: var(--space-xl) auto; padding: var(--space-lg); }
    .adm-login .headline-md { margin-bottom: var(--space-xs); }
    .adm-login .body-md { margin-bottom: var(--space-md); }
    #loginMsg { min-height: 18px; margin-top: var(--space-xs); }
    #loginMsg.err { color: #dc2626; }

    .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-sm); margin-bottom: var(--space-lg); }
    .stat-card { background: var(--color-surface); border: 1px solid var(--color-outline-variant); border-radius: var(--radius-lg); padding: var(--space-md); }
    .stat-num { font-size: 22px; font-weight: 800; color: var(--color-on-surface); font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 12px; color: var(--color-outline); margin-top: 2px; }

    .adm-tabs { display: flex; gap: var(--space-xs); flex-wrap: wrap; margin-bottom: var(--space-md); border-bottom: 1px solid var(--color-outline-variant); padding-bottom: var(--space-sm); }
    .adm-tab { padding: 8px 16px; border-radius: var(--radius-full); border: none; background: transparent; color: var(--color-on-surface-variant);
      font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .adm-tab:hover { background: var(--color-surface); }
    .adm-tab.active { background: var(--color-primary); color: #fff; }

    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 700; white-space: nowrap; }
    .chip.high { background: rgba(220,38,38,0.12); color: #dc2626; }
    .chip.ok { background: rgba(34,197,94,0.12); color: #16a34a; }
    .chip.warn { background: rgba(234,179,8,0.15); color: #b45309; }
    .chip.neutral { background: var(--color-surface-variant, rgba(128,128,128,0.15)); color: var(--color-on-surface-variant); }

    .adm-card { background: var(--color-surface); border: 1px solid var(--color-outline-variant); border-radius: var(--radius-lg);
      padding: var(--space-md); margin-bottom: var(--space-md); }
    .adm-card .row { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
    .adm-card .preview { margin: var(--space-sm) 0; padding: var(--space-sm) var(--space-md); background: var(--color-surface-variant, rgba(128,128,128,0.08));
      border-radius: var(--radius-md); font-size: 13.5px; color: var(--color-on-surface-variant); white-space: pre-wrap; word-break: break-word; }
    .adm-card .actions { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-top: var(--space-sm); }
    .adm-meta { font-size: 12px; color: var(--color-outline); }
    .adm-sla { color: #dc2626; font-weight: 700; }

    .bar-track { height: 8px; border-radius: var(--radius-full); background: var(--color-surface-variant, rgba(128,128,128,0.15)); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: var(--radius-full); background: #16a34a; }
    .bar-fill.warn { background: #eab308; }
    .bar-fill.bad { background: #dc2626; }

    .adm-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .adm-table th, .adm-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-outline-variant); }
    .adm-table th { font-size: 12px; color: var(--color-outline); font-weight: 600; }
    .adm-table code { font-family: ui-monospace, monospace; font-size: 12.5px; }
    .mono { font-family: ui-monospace, monospace; font-size: 12.5px; letter-spacing: 0.03em; }

    .adm-select, .adm-input, .adm-textarea { padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-outline-variant);
      background: var(--color-surface); color: var(--color-on-surface); font-size: 13.5px; font-family: inherit; }
    .adm-input:focus, .adm-textarea:focus, .adm-select:focus { outline: none; border-color: var(--color-primary); }
    .adm-textarea { width: 100%; min-height: 64px; resize: vertical; }
    .adm-form { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-sm); }

    .badge-code-box { font-family: ui-monospace, monospace; font-size: 26px; font-weight: 800; letter-spacing: 0.15em;
      padding: var(--space-md) var(--space-lg); border-radius: var(--radius-lg); background: var(--color-surface-variant, rgba(128,128,128,0.1));
      border: 1px dashed var(--color-primary); display: inline-block; margin: var(--space-sm) 0; }

    #userDetail { display: none; }
    .timeline-item { padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-outline-variant); font-size: 13.5px; }
    .timeline-item:last-child { border-bottom: none; }

    #admToast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--color-on-surface); color: var(--color-surface);
      padding: 10px 20px; border-radius: var(--radius-full); font-size: 13.5px; font-weight: 600; z-index: 100; display: none; max-width: 80vw; }
    #admBanner { display: none; margin-bottom: var(--space-md); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
      background: rgba(234,179,8,0.15); border: 1px solid rgba(234,179,8,0.4); color: #b45309; font-size: 13.5px; font-weight: 600; }
    .cursor-row { cursor: pointer; }
    .cursor-row:hover { background: var(--color-surface-variant, rgba(128,128,128,0.08)); }
  </style>
</head>
<body>

<div class="adm-shell">

  <header class="adm-header">
    <div>
      <h1 class="display-lg" style="margin-bottom:4px">管理后台</h1>
      <p class="body-md adm-meta">审核队列 · 工单 · 徽章码 · 用户 · 成本看板 —— 所有操作自动写入审计日志（admin_audit_log）</p>
    </div>
    <div class="adm-header-right">
      <span id="admWho" class="adm-meta mono" style="display:none"></span>
      <button class="btn" id="logoutBtn" style="display:none">退出登录</button>
    </div>
  </header>

  <!-- 独立登录页（邮箱验证码两段式；管理端无 demo/离线回退） -->
  <div id="adminLogin" class="card adm-login" style="display:none">
    <h3 class="headline-md">管理员登录</h3>
    <p class="body-md" style="color:var(--color-on-surface-variant)">仅管理员账号可进入。验证码发送至邮箱，10 分钟内有效。</p>
    <div class="adm-form">
      <input class="adm-input" id="loginEmail" type="email" placeholder="管理员邮箱" autocomplete="email" style="flex:1;min-width:220px">
      <button class="btn btn-primary" id="sendCodeBtn">发送验证码</button>
    </div>
    <div class="adm-form" id="codeRow" style="display:none">
      <input class="adm-input" id="loginCode" placeholder="6 位验证码" maxlength="6" inputmode="numeric"
        style="width:150px;letter-spacing:0.3em;text-align:center">
      <button class="btn btn-primary" id="loginBtn">登录</button>
    </div>
    <p class="adm-meta" id="loginMsg"></p>
  </div>

  <!-- 无权限 / 后端不可达 -->
  <div id="adminGate" class="card" style="max-width:640px;display:none">
    <h3 class="headline-md" style="margin-bottom:var(--space-sm)">
      <span class="material-symbols-outlined" style="font-size:22px;vertical-align:-4px">gpp_maybe</span>
      <span id="gateTitle">无访问权限</span>
    </h3>
    <p class="body-md" id="gateMsg" style="color:var(--color-on-surface-variant)"></p>
    <div class="actions" id="gateActions" style="display:none;margin-top:var(--space-sm)">
      <button class="btn" id="gateLogoutBtn">退出登录</button>
    </div>
  </div>

  <div id="adminRoot" style="display:none">
    <div id="admBanner"></div>

    <!-- 总览数字 -->
    <div class="stat-strip">
      <div class="stat-card"><div class="stat-num" id="stUsers">—</div><div class="stat-label">用户</div></div>
      <div class="stat-card"><div class="stat-num" id="stPosts">—</div><div class="stat-label">帖子</div></div>
      <div class="stat-card"><div class="stat-num" id="stMod">—</div><div class="stat-label" id="stModLabel">待办审核</div></div>
      <div class="stat-card"><div class="stat-num" id="stTickets">—</div><div class="stat-label">未完工单</div></div>
      <div class="stat-card"><div class="stat-num" id="stCost">—</div><div class="stat-label">本月成本</div></div>
      <div class="stat-card"><div class="stat-num" id="stBudget">—</div><div class="stat-label">预算状态</div></div>
    </div>

    <!-- Tabs -->
    <div class="adm-tabs" id="admTabs">
      <button class="adm-tab active" data-tab="mod">审核队列</button>
      <button class="adm-tab" data-tab="ticket">工单</button>
      <button class="adm-tab" data-tab="badge">徽章码</button>
      <button class="adm-tab" data-tab="user">用户</button>
      <button class="adm-tab" data-tab="usage">成本看板</button>
    </div>

    <!-- 审核队列 -->
    <div id="pane-mod">
      <div class="adm-form">
        <button class="btn btn-primary" data-mod-filter="open">待处理</button>
        <button class="btn" data-mod-filter="l0_hold">L0 拦截</button>
        <button class="btn" data-mod-filter="queued">排队</button>
        <button class="btn" data-mod-filter="needs_human">需人工</button>
        <button class="btn" data-mod-filter="ai_rejected">AI 拒绝</button>
        <button class="btn" data-mod-filter="all">全部</button>
        <span class="adm-meta" id="modFilterLabel">open</span>
      </div>
      <div id="modList"></div>
    </div>

    <!-- 工单 -->
    <div id="pane-ticket" style="display:none">
      <div class="adm-form">
        <button class="btn btn-primary" data-tk-filter="queued">待处理</button>
        <button class="btn" data-tk-filter="in_progress">处理中</button>
        <button class="btn" data-tk-filter="closed">已关闭</button>
        <button class="btn" data-tk-filter="all">全部</button>
        <span class="adm-meta" id="tkFilterLabel">queued</span>
      </div>
      <div id="ticketList"></div>
    </div>

    <!-- 徽章码 -->
    <div id="pane-badge" style="display:none">
      <div class="adm-card">
        <h3 class="headline-sm" style="margin-bottom:var(--space-sm)">签发官方验证码</h3>
        <div class="adm-form">
          <input class="adm-input" id="bgAlias" placeholder="工作人员化名（如 客服小雨）">
          <input class="adm-input" id="bgRole" placeholder="职位（如 客服）">
          <input class="adm-input" id="bgDuties" placeholder="负责事项（如 账号安全核查）">
          <input class="adm-input" id="bgTtl" type="number" min="1" max="72" value="12" style="width:80px" title="有效小时数">
          <button class="btn btn-primary" id="bgIssueBtn">签发</button>
        </div>
        <div id="bgIssued" style="display:none">
          <p class="body-md" style="margin-bottom:var(--space-xs)">验证码只显示这一次，请立即复制给对方：</p>
          <div class="badge-code-box" id="bgCode">—</div>
          <div class="row">
            <button class="btn" id="bgCopyBtn">复制</button>
            <span class="adm-meta" id="bgExpires"></span>
          </div>
        </div>
      </div>
      <div class="adm-card">
        <h3 class="headline-sm" style="margin-bottom:var(--space-sm)">有效验证码列表</h3>
        <div id="badgeList"></div>
      </div>
    </div>

    <!-- 用户 -->
    <div id="pane-user" style="display:none">
      <div class="adm-form">
        <input class="adm-input" id="usrQ" placeholder="搜索邮箱 / 昵称 / 公民 ID" style="flex:1;min-width:220px">
        <button class="btn btn-primary" id="usrSearchBtn">搜索</button>
      </div>
      <div class="adm-card" style="overflow-x:auto">
        <table class="adm-table" id="usrTable">
          <thead><tr>
            <th>用户</th><th>邮箱</th><th>tier</th><th>状态</th><th>警告</th><th>注册时间</th>
          </tr></thead>
          <tbody id="usrRows"></tbody>
        </table>
      </div>
      <div class="adm-card" id="userDetail">
        <h3 class="headline-sm" style="margin-bottom:var(--space-sm)">用户详情 <span class="mono" id="udId"></span></h3>
        <div class="row" style="margin-bottom:var(--space-sm)">
          <select class="adm-select" id="udTier">
            <option value="basic">basic</option><option value="premium">premium</option><option value="ultra">ultra</option>
          </select>
          <button class="btn btn-primary" id="udTierBtn">保存 tier</button>
          <span class="adm-meta" id="udTierNote"></span>
        </div>
        <div class="row" style="margin-bottom:var(--space-sm)">
          <select class="adm-select" id="udPenAction">
            <option value="warn">warn（警告，3 次自动禁言）</option>
            <option value="rate_limit">rate_limit（24h 限发）</option>
            <option value="mute">mute（禁言 72h）</option>
            <option value="ban">ban（封禁，清会话）</option>
            <option value="restore">restore（撤销处罚）</option>
          </select>
          <input class="adm-input" id="udPenReason" placeholder="原因码（可选，如 abuse）">
          <button class="btn" id="udPenBtn" style="border-color:#dc2626;color:#dc2626">执行处罚</button>
        </div>
        <h4 class="headline-sm" style="margin:var(--space-md) 0 var(--space-xs)">处罚时间线</h4>
        <div id="udTimeline"></div>
      </div>
    </div>

    <!-- 成本看板 -->
    <div id="pane-usage" style="display:none">
      <div id="usageBars"></div>
      <div class="adm-card" style="overflow-x:auto">
        <h3 class="headline-sm" style="margin-bottom:var(--space-sm)">最近 50 条用量记录</h3>
        <table class="adm-table">
          <thead><tr><th>时间</th><th>功能</th><th>入</th><th>出</th><th>缓存</th><th>成本</th><th>批次</th></tr></thead>
          <tbody id="usageRows"></tbody>
        </table>
      </div>
      <div class="adm-card">
        <h3 class="headline-sm" style="margin-bottom:var(--space-sm)">月度预算额度（元，写入审计）</h3>
        <div class="adm-form" id="budgetForm">
          <label class="adm-meta">文字审核 <input class="adm-input" id="bgText" type="number" min="0" step="0.5" style="width:90px"></label>
          <label class="adm-meta">AI 客服 <input class="adm-input" id="bgChat" type="number" min="0" step="0.5" style="width:90px"></label>
          <label class="adm-meta">图像审核 <input class="adm-input" id="bgImage" type="number" min="0" step="0.5" style="width:90px"></label>
          <label class="adm-meta">总预算 <input class="adm-input" id="bgTotal" type="number" min="0" step="0.5" style="width:90px"></label>
          <button class="btn btn-primary" id="budgetSaveBtn">保存</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="admToast"></div>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="admin.js"></script>
</body>
</html>
