<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../assets/image/M.NationWorld logo circle_.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlatiControl | M.NationWorld</title>
  <meta name="robots" content="noindex,nofollow">

  <script>
  /* 防主题白闪：原 theme-init.js 内联——必须 CSS 之前同步执行（外链脚本走网络晚到 → 页面先按默认主题画一帧再跳 = 切页闪白） */
  (function () {
    var theme = 'light';
    try {
      var raw = localStorage.getItem('slati_settings');
      if (raw) {
        var s = JSON.parse(raw);
        if (s.theme) theme = s.theme;
      }
    } catch (e) {}
    if (theme === 'auto') {
      var h = new Date().getHours();
      theme = (h >= 20 || h < 5) ? 'dark' : 'light';
    } else if (theme === 'system') {
      theme = 'light';
    }
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    /* SlatiControl 专用样式：独立站点 admin.<域名>，自带 staff 登录页、无公网站点侧栏。
       v2 重建（v1 admin.js 退役）：12 顶级导航组（英文菜单 + 中文副标题）、页面内容中文。 */
    .adm-shell { padding: var(--space-lg); }
    .adm-layout { display: flex; gap: var(--space-lg); align-items: flex-start; }
    .adm-side { width: 232px; flex-shrink: 0; position: sticky; top: var(--space-md);
      display: flex; flex-direction: column; gap: var(--space-sm); }
    .adm-side .sidebar-module { margin-top: 0; }
    .adm-side .nav-item { width: 100%; }
    .adm-main { flex: 1; min-width: 0; }
    @media (max-width: 760px) { .adm-layout { flex-direction: column; } .adm-side { width: 100%; position: static; } }

    /* 两级导航：组头（英文 + 中文副标题）+ 组内条目 */
    .nav-group-title { display: flex; flex-direction: column; gap: 1px; padding: 6px 10px 4px;
      font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em; color: var(--color-outline); }
    .nav-group-title .zh { font-weight: 500; font-size: 11px; color: var(--color-outline); opacity: 0.85; }
    .nav-group-items { display: flex; flex-direction: column; gap: 2px; padding: 2px 8px 6px; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-md);
      cursor: pointer; font-size: 13px; color: var(--color-on-surface-variant); text-decoration: none; }
    .nav-item .material-symbols-outlined { font-size: 18px; }
    .nav-item:hover { background: var(--color-surface-variant, rgba(128,128,128,0.08)); color: var(--color-on-surface); }
    .nav-item.active { background: rgba(59,130,246,0.12); color: var(--color-primary); font-weight: 700; }
    .nav-item .soon { margin-left: auto; font-size: 10px; color: var(--color-outline); font-weight: 500; }

    .adm-login { max-width: 520px; margin: var(--space-xl) auto; padding: var(--space-lg); }
    .adm-login .headline-md { margin-bottom: var(--space-xs); }
    .adm-login .body-md { margin-bottom: var(--space-md); }
    #loginMsg { min-height: 18px; margin-top: var(--space-xs); }
    #loginMsg.err { color: #dc2626; }

    /* 页面头部：英文标题 + 中文副标题 */
    .page-head { margin-bottom: var(--space-md); }
    .page-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
    .page-head .page-sub { color: var(--color-on-surface-variant); font-size: 13px; margin-top: 2px; }

    .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-sm); margin-bottom: var(--space-md); }
    .stat-card { background: var(--adm-card-bg); border: 1px solid var(--adm-border); border-radius: var(--radius-lg); padding: var(--space-md); }
    .stat-num { font-size: 22px; font-weight: 800; color: var(--color-on-surface); font-variant-numeric: tabular-nums; }
    .stat-label { font-size: 12px; color: var(--color-outline); margin-top: 2px; }
    .stat-sub { font-size: 11px; color: var(--color-outline); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-md); }
    .dash-grid .adm-card { margin-bottom: 0; }

    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--radius-full);
      font-size: 12px; font-weight: 700; white-space: nowrap; }
    .chip.high { background: rgba(220,38,38,0.12); color: #dc2626; }
    .chip.ok { background: rgba(34,197,94,0.12); color: #16a34a; }
    .chip.warn { background: rgba(234,179,8,0.15); color: #b45309; }
    .chip.neutral { background: var(--color-surface-variant, rgba(128,128,128,0.15)); color: var(--color-on-surface-variant); }

    .adm-card { background: var(--adm-card-bg); border: 1px solid var(--adm-border); border-radius: var(--radius-lg);
      padding: var(--space-md); margin-bottom: var(--space-md); }
    .adm-card .row { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }
    .adm-card-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); margin-bottom: var(--space-sm); flex-wrap: wrap; }
    .adm-card-title h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .adm-card-title .sub { font-size: 12px; color: var(--color-outline); margin-top: 2px; }
    .adm-meta { font-size: 12px; color: var(--color-outline); }

    .adm-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .adm-table th, .adm-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--color-outline-variant); }
    .adm-table th { font-size: 12px; color: var(--color-outline); font-weight: 600; }
    .adm-table code { font-family: ui-monospace, monospace; font-size: 12.5px; }
    .mono { font-family: ui-monospace, monospace; font-size: 12.5px; letter-spacing: 0.03em; }
    .cursor-row { cursor: pointer; }
    .cursor-row:hover { background: var(--color-surface-variant, rgba(128,128,128,0.08)); }

    .adm-select, .adm-input, .adm-textarea { padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-outline-variant);
      background: var(--color-surface); color: var(--color-on-surface); font-size: 13.5px; font-family: inherit; }
    .adm-input:focus, .adm-textarea:focus, .adm-select:focus { outline: none; border-color: var(--color-primary); }
    .adm-textarea { width: 100%; min-height: 64px; resize: vertical; }
    .adm-form { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; margin-bottom: var(--space-sm); }

    /* 分段胶囊（时间范围 / 域切换 / 页面内 tabs） */
    .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--color-surface-variant, rgba(128,128,128,0.12));
      border-radius: var(--radius-full); }
    .seg-btn { border: none; background: transparent; color: var(--color-on-surface-variant); font-size: 13px; font-weight: 600;
      padding: 5px 14px; border-radius: var(--radius-full); cursor: pointer; white-space: nowrap; }
    .seg-btn.active { background: var(--color-surface); color: var(--color-primary); box-shadow: 0 1px 3px rgba(16,24,40,0.12); }

    .chart-box { background: var(--color-surface-variant, rgba(128,128,128,0.08)); border-radius: var(--radius-md); padding: var(--space-xs); }
    .chart-box canvas { width: 100%; height: 240px; display: block; }
    .kv-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px var(--space-md); }
    .kv-list .kv { display: flex; justify-content: space-between; gap: var(--space-sm); font-size: 13.5px;
      padding: 6px 0; border-bottom: 1px dashed var(--color-outline-variant); }
    .kv-list .kv .k { color: var(--color-on-surface-variant); }
    .kv-list .kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }

    .pager { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-sm); flex-wrap: wrap; }
    .pager .btn { padding: 4px 12px; font-size: 13px; }

    #admToast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--color-on-surface); color: var(--color-surface);
      padding: 10px 20px; border-radius: var(--radius-full); font-size: 13.5px; font-weight: 600; z-index: 100; display: none; max-width: 80vw; }
    #admBanner { display: none; margin-bottom: var(--space-md); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md);
      background: rgba(234,179,8,0.15); border: 1px solid rgba(234,179,8,0.4); color: #b45309; font-size: 13.5px; font-weight: 600; }

    .gate-card { max-width: 640px; margin: var(--space-xl) auto; padding: var(--space-lg); text-align: center; }
    .gate-card .material-symbols-outlined { font-size: 40px; color: var(--color-outline); }
    .gate-card h3 { margin: var(--space-sm) 0 var(--space-xs); }
    .empty { padding: var(--space-lg); text-align: center; color: var(--color-outline); font-size: 13.5px; }

    /* 立体阴影 tokens（v1 保留 + 明暗两套） */
    :root {
      --adm-shadow-card: 0 1px 2px rgba(16,24,40,0.04), 0 3px 10px rgba(16,24,40,0.06);
      --adm-shadow-hover: 0 2px 4px rgba(16,24,40,0.05), 0 6px 16px rgba(16,24,40,0.09);
      --adm-shadow-modal: 0 12px 40px rgba(16,24,40,0.18);
      --adm-highlight: inset 0 1px 0 rgba(255,255,255,0.65);
      --adm-card-bg: linear-gradient(180deg, #ffffff 0%, #fbfbfd 100%);
      --adm-border: rgba(16,24,40,0.10);
    }
    :root[data-theme="dark"] {
      --adm-shadow-card: 0 1px 2px rgba(0,0,0,0.22), 0 3px 10px rgba(0,0,0,0.20);
      --adm-shadow-hover: 0 2px 4px rgba(0,0,0,0.28), 0 6px 16px rgba(0,0,0,0.26);
      --adm-shadow-modal: 0 12px 40px rgba(0,0,0,0.45);
      --adm-highlight: inset 0 1px 0 rgba(255,255,255,0.07);
      --adm-card-bg: linear-gradient(180deg, #26263c 0%, #1e1e30 100%);
      --adm-border: rgba(255,255,255,0.10);
    }
    .adm-card, .stat-card { box-shadow: var(--adm-shadow-card), var(--adm-highlight);
      transition: box-shadow .2s ease, transform .2s ease; }
    .adm-card:hover, .stat-card:hover { box-shadow: var(--adm-shadow-hover), var(--adm-highlight); transform: translateY(-2px); }
    .adm-side .sidebar-module { box-shadow: var(--adm-shadow-card), var(--adm-highlight); }
  </style>
</head>
<body>

<div class="adm-shell">

  <!-- staff 登录页（W6：密码 + 邮箱验证码双因素；管理端无 demo/离线回退） -->
  <div id="adminLogin" class="card adm-login" style="display:none">
    <h3 class="headline-md">SlatiControl 登录</h3>
    <p class="body-md" style="color:var(--color-on-surface-variant)">仅工作人员账号可进入。密码 + 邮箱验证码双因素登录，验证码发送至邮箱，10 分钟内有效。</p>
    <div class="adm-form">
      <input class="adm-input" id="loginEmail" type="email" placeholder="工作人员邮箱" autocomplete="email" style="flex:1;min-width:220px">
      <button class="btn btn-primary" id="sendCodeBtn">发送验证码</button>
    </div>
    <div class="adm-form">
      <input class="adm-input" id="loginPassword" type="password" placeholder="密码（8-72 字符）" autocomplete="current-password" style="flex:1">
    </div>
    <div class="adm-form" id="codeRow" style="display:none">
      <input class="adm-input" id="loginCode" placeholder="6 位验证码" maxlength="6" inputmode="numeric"
        style="width:150px;letter-spacing:0.3em;text-align:center">
      <button class="btn btn-primary" id="loginBtn">登录</button>
    </div>
    <p class="adm-meta" id="loginMsg"></p>
    <p class="adm-meta" style="text-align:center"><a href="javascript:void(0)" id="forgotAdminPw" style="color:var(--color-primary)">忘记密码？</a></p>
  </div>

  <!-- W6：首登设密（旧 staff 仅码登录后引导；设完直达面板） -->
  <div id="adminSetPassword" class="card adm-login" style="display:none">
    <h3 class="headline-md">设置您的密码</h3>
    <p class="body-md" style="color:var(--color-on-surface-variant)">旧账号首次登录：设置密码后，下次登录需要密码 + 验证码。</p>
    <div class="adm-form">
      <input class="adm-input" id="setPassword" type="password" placeholder="新密码（8-72 字符）" autocomplete="new-password" style="flex:1">
      <button class="btn btn-primary" id="setPwBtn">设置密码并进入</button>
    </div>
    <p class="adm-meta" id="setPwMsg"></p>
  </div>

  <!-- W6：忘记密码（两步：发码 → 码 + 新密码重置） -->
  <div id="adminResetPassword" class="card adm-login" style="display:none">
    <h3 class="headline-md">重置密码</h3>
    <p class="body-md" style="color:var(--color-on-surface-variant)">验证码发送至工作人员邮箱，10 分钟内有效。</p>
    <div class="adm-form">
      <input class="adm-input" id="resetEmail" type="email" placeholder="工作人员邮箱" autocomplete="email" style="flex:1;min-width:220px">
      <button class="btn btn-primary" id="resetSendBtn">发送验证码</button>
    </div>
    <div class="adm-form">
      <input class="adm-input" id="resetCode" placeholder="6 位验证码" maxlength="6" inputmode="numeric"
        style="width:150px;letter-spacing:0.3em;text-align:center">
      <input class="adm-input" id="resetPassword" type="password" placeholder="新密码（8-72 字符）" autocomplete="new-password" style="flex:1">
    </div>
    <button class="btn btn-primary" id="resetBtn" style="width:100%">重置密码</button>
    <p class="adm-meta" id="resetMsg"></p>
    <p class="adm-meta" style="text-align:center"><a href="javascript:void(0)" id="resetBackBtn" style="color:var(--color-primary)">返回登录</a></p>
  </div>

  <!-- 无权限 / 后端不可达 -->
  <div id="adminGate" class="card" style="max-width:640px;margin:0 auto;display:none">
    <h3 class="headline-md" style="margin-bottom:var(--space-sm)">
      <span class="material-symbols-outlined" style="font-size:22px;vertical-align:-4px">gpp_maybe</span>
      <span id="gateTitle">无访问权限</span>
    </h3>
    <p class="body-md" id="gateMsg" style="color:var(--color-on-surface-variant)"></p>
    <div class="actions" id="gateActions" style="display:none;margin-top:var(--space-sm)">
      <button class="btn" id="gateLogoutBtn">退出登录</button>
    </div>
  </div>

  <div id="adminRoot" style="display:none">
    <div class="adm-layout">
      <aside id="admTabs" class="adm-side">
        <div class="sidebar-module">
          <div style="font-weight:700;font-size:14px">SlatiControl</div>
          <span id="admWho" class="adm-meta mono" style="display:none;word-break:break-all"></span>
          <span id="admRoles" class="adm-meta" style="display:none"></span>
          <button class="btn" id="logoutBtn" style="display:none;width:100%;margin-top:var(--space-sm)">退出登录</button>
        </div>
        <div class="sidebar-module" id="navGroups"></div>
      </aside>

      <main class="adm-main">
        <div id="admBanner"></div>

        <div id="pane-dashboard" class="pane" style="display:none"></div>
        <div id="pane-analytics" class="pane" style="display:none"></div>
        <div id="pane-users" class="pane" style="display:none"></div>
        <div id="pane-security" class="pane" style="display:none"></div>
        <div id="pane-todo" class="pane" style="display:none"></div>
      </main>
    </div>
  </div>

</div>

<div id="admToast"></div>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/api-helper.js"></script>
<script src="js/charts.js"></script>
<script src="js/pages-dashboard.js"></script>
<script src="js/pages-analytics.js"></script>
<script src="js/pages-users.js"></script>
<script src="js/pages-security.js"></script>
<script src="js/app.js"></script>
</body>
</html>
