<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../assets/image/M.NationWorld logo circle_.png">
  <link rel="apple-touch-icon" href="../assets/image/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-title" content="M.NationWorld">
  <meta name="theme-color" content="#4648d4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gargantua — Black Hole</title>
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    canvas { display:block; }
    .hint { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.3); font-size:11px; pointer-events:none; z-index:10; font-family:monospace; }
  </style>
</head>
<body>
<div class="hint">Gargantua &bull; Move mouse to orbit</div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

function showError(msg) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#dc2626;color:white;padding:12px 24px;border-radius:8px;font-family:monospace;font-size:13px;z-index:999;max-width:80vw';
  d.textContent = 'ERROR: ' + msg;
  document.body.appendChild(d);
}
if (!gl) { showError('WebGL not supported'); throw new Error('WebGL'); }

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; gl.viewport(0, 0, canvas.width, canvas.height); }
resize(); window.addEventListener('resize', resize);

const isGL2 = !!gl.createVertexArray;
const vertSrc = isGL2 ? '#version 300 es\nin vec2 aPos;\nvoid main(){gl_Position=vec4(aPos,0.0,1.0);}' : 'attribute vec2 aPos;\nvoid main(){gl_Position=vec4(aPos,0.0,1.0);}';
const fragOut = isGL2 ? 'fragColor' : 'gl_FragColor';

const fragSrc = (isGL2 ? '#version 300 es\nprecision highp float;\nout vec4 fragColor;\n' : 'precision highp float;\n') + `
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;

// ── Noise ──
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;vec2 s=vec2(0);for(int i=0;i<5;i++){v+=a*noise(p+s);s+=vec2(4.7,2.9);p*=2.05;a*=0.5;}return v;}
float fbm3(vec3 p){float v=0.0,a=0.55;vec3 s=vec3(0);for(int i=0;i<5;i++){v+=a*hash3(floor(p+s));s+=vec3(3.1,7.3,5.7);p*=2.3;a*=0.5;}return v;}

// ── 3D Rotation ──
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,-s,0,s,c);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0,s,0,1,0,-s,0,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,-s,0,s,c,0,0,0,1);}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);

  // ── Camera setup: ray from eye through screen plane ──
  // Eye position in world space
  float camDist=3.5;
  vec3 eye=vec3(0.0,0.8,camDist);

  // Apply mouse rotation to camera
  float mx=uMouse.x*0.5, my=uMouse.y*0.35;
  mat3 camRot=rotX(-0.4+my)*rotY(mx);
  eye=camRot*eye;

  // Screen plane basis vectors
  vec3 forward=normalize(-eye);
  vec3 right=normalize(cross(forward,vec3(0,1,0)));
  vec3 up=cross(right,forward);

  // Ray direction through this pixel
  vec3 rayDir=normalize(forward+uv.x*right*1.5+uv.y*up*1.5);

  // ── Ray march to find intersection with disk plane & black hole ──
  float Rs=0.14;
  vec3 bhPos=vec3(0,0,0);
  vec3 toBh=bhPos-eye;

  // Closest approach to black hole
  float tBh=dot(toBh,rayDir);
  vec3 closest=eye+rayDir*tBh;
  float impactDist=length(closest-bhPos);

  // Project to screen space for noise sampling
  float dist=length(closest.xz)/camDist;
  float angle=atan(closest.z,closest.x);
  float height=closest.y/camDist;

  // ── Disk geometry (3D tilted) ──
  // Disk normal tilted ~15 degrees from XZ plane
  vec3 diskNormal=normalize(vec3(0,0.97,0.22));
  float diskPlaneDist=abs(dot(closest-bhPos,diskNormal));

  // In 3D, the disk is a flat ring. Compute if this pixel hits the disk.
  float diskRadius=length(closest-bhPos-diskNormal*dot(closest-bhPos,diskNormal));
  float inDisk=smoothstep(Rs*1.05,Rs*0.95,diskPlaneDist)*smoothstep(0.18,0.17,diskRadius)*smoothstep(diskRadius,0.5,diskRadius);

  // ── Ray-bending: light from far side of disk curves around BH ──
  // The far side (behind BH) gets lensed to appear above and below
  float backDiskDist=abs(dist-Rs*1.2);
  float topLens=exp(-backDiskDist*6.0)*exp(-abs(height+0.08)*8.0)*smoothstep(Rs,0.4,dist);
  float bottomLens=exp(-backDiskDist*5.0)*exp(-abs(height-0.12)*7.0)*smoothstep(Rs,0.35,dist);

  // ── Kepler rotation ──
  float kepler=(pow(max(diskRadius,Rs*1.05),-1.5)-pow(0.5,-1.5))*0.03;

  // ── Noise ──
  float rotOff=kepler*uTime*15.0;
  vec3 nc=vec3(diskRadius*12.0,angle*3.5+rotOff,uTime*0.1);
  float fil=fbm3(nc);
  float fil2=fbm3(nc*2.1+vec3(0,0,uTime*0.05));
  float filFine=fbm3(nc*4.5+vec3(0,1.5,uTime*0.03));
  float combFil=fil*0.5+fil2*0.3+filFine*0.2;
  float brightness=pow(combFil*0.5+0.5,1.5);

  // ── Event Horizon ──
  float horizon=smoothstep(Rs,Rs*1.03,impactDist);

  // ── Photon Ring ──
  float photonRing=exp(-abs(impactDist-Rs*1.015)*150.0)*0.9+exp(-abs(impactDist-Rs*1.025)*100.0)*0.45;

  // ── Einstein ring ──
  float einstein=exp(-abs(impactDist-Rs*1.3)*25.0)*0.35+exp(-abs(impactDist-Rs*1.55)*16.0)*0.18;

  // ── Disk rendering ──
  float diskThick=0.06*(1.0+0.25*sin(angle*2.5)+0.12*sin(angle*5.0));
  float diskTop=exp(-pow(abs(height)/diskThick,2.0))*smoothstep(Rs*1.05,Rs*1.2,diskRadius)*(1.0-smoothstep(0.5,0.85,diskRadius));
  float diskBottom=exp(-pow(abs(height+0.02)/diskThick*1.3,2.0))*smoothstep(Rs*1.04,Rs*1.18,diskRadius)*0.65*(1.0-smoothstep(0.4,0.7,diskRadius));
  float diskPlane=exp(-diskPlaneDist*30.0)*smoothstep(Rs*1.05,Rs*1.25,diskRadius)*(1.0-smoothstep(0.45,0.8,diskRadius));
  float diskVal=(diskTop*0.55+diskPlane*0.35+diskBottom*0.25)*brightness;
  diskVal*=smoothstep(Rs*1.01,Rs*1.06,impactDist);

  // Lensing brightness
  float lensBright=fbm3(vec3(dist*10.0,angle*2.5+uTime*0.2,uTime*0.08));
  lensBright=pow(lensBright*0.5+0.5,1.3);
  float topLensVal=topLens*lensBright*0.7;
  float bottomLensVal=bottomLens*lensBright*0.55;

  // ── Color ──
  float tmp=smoothstep(Rs*1.02,Rs*1.35,impactDist);
  vec3 innerC=mix(vec3(0.95,0.93,1.0),vec3(1.0,0.95,0.85),brightness);
  vec3 midC=mix(vec3(1.0,0.62,0.22),vec3(1.0,0.78,0.32),combFil);
  vec3 outerC=mix(vec3(0.65,0.18,0.04),vec3(0.3,0.06,0.01),combFil*0.5);
  vec3 diskColor=mix(innerC,midC,smoothstep(0.0,0.3,tmp));
  diskColor=mix(diskColor,outerC,smoothstep(0.3,0.7,tmp));

  float dop=smoothstep(-0.3,0.3,uv.x);
  diskColor=mix(diskColor*0.6,diskColor*1.25,dop);
  diskColor=mix(diskColor,diskColor*vec3(1.2,1.08,1.4),dop*0.5);

  // ── Compose ──
  vec3 color=vec3(0.0);

  // Stars
  vec2 sg=floor(uv*400.0)/400.0;
  float sr=hash(sg);
  if(sr>0.997){float sb=(sr-0.997)*350.0;sb*=0.6+0.4*sin(uTime*2.5+sr*180.0);sb*=smoothstep(Rs*1.2,Rs*1.5,length(sg));color+=vec3(0.8,0.85,0.95)*sb*1.5;}
  vec2 sg2=floor(uv*180.0)/180.0;
  float sr2=hash(sg2+0.5);
  if(sr2>0.998){float sb2=(sr2-0.998)*500.0;sb2*=smoothstep(Rs*1.35,Rs*1.65,length(sg2));color+=vec3(1.0,0.95,0.9)*sb2*1.2;}

  // Accretion disk
  color+=diskColor*diskVal*3.5;

  // Gravitational lensing arcs (far side bent around)
  color+=diskColor*topLensVal*2.0;
  color+=diskColor*bottomLensVal*1.5;

  // Photon ring
  color+=vec3(0.75,0.82,1.0)*photonRing*2.8;

  // Einstein rings
  color+=vec3(0.6,0.72,1.0)*einstein*1.8;

  // Core atmosphere glow
  color+=vec3(0.6,0.65,1.0)*exp(-impactDist*4.0)*0.4;
  color+=vec3(0.5,0.55,0.85)*exp(-impactDist*2.5)*0.25;

  // ── Planet ──
  vec2 planetPos=vec2(0.42,-0.22);
  vec2 pUV=uv-planetPos;
  float pDist=length(pUV);
  float pR=0.022;
  float planet=smoothstep(pR,pR*0.85,pDist);
  float rimDir=dot(normalize(pUV),normalize(-planetPos));
  float rimLight=smoothstep(-0.3,0.7,rimDir)*0.6;
  vec3 planetSurf=vec3(0.1,0.13,0.18)+vec3(0.55,0.35,0.2)*rimLight;
  float pAtmo=exp(-pDist*160.0)*0.25;
  color=mix(color,planetSurf,planet);
  color+=vec3(0.45,0.4,0.6)*pAtmo;

  // ── Event Horizon ──
  color*=horizon;

  // ── Vignette ──
  float vig=1.0-smoothstep(0.3,1.05,length(uv));
  color*=0.78+0.22*vig;

  // ── Tone map ──
  color=color/(1.0+color*0.45);

  ${fragOut}=vec4(color,1.0);
}`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    showError((type===gl.VERTEX_SHADER?'Vertex':'Fragment')+' error: '+gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

const vs = compileShader(gl.VERTEX_SHADER, vertSrc);
const fs = compileShader(gl.FRAGMENT_SHADER, fragSrc);
if (!vs || !fs) throw new Error('Shader failed');

const program = gl.createProgram();
gl.attachShader(program, vs); gl.attachShader(program, fs);
gl.linkProgram(program);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
gl.useProgram(program);

const uRes = gl.getUniformLocation(program, 'uRes');
const uTime = gl.getUniformLocation(program, 'uTime');
const uMouse = gl.getUniformLocation(program, 'uMouse');

let tMX=0,tMY=0,mX=0,mY=0;
document.addEventListener('mousemove', e => { tMX=(e.clientX/innerWidth-0.5)*2.5; tMY=-(e.clientY/innerHeight-0.5)*1.8; });

const start = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, (now-start)*0.001);
  mX+=(tMX-mX)*0.04; mY+=(tMY-mY)*0.04;
  gl.uniform2f(uMouse, mX, mY);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
