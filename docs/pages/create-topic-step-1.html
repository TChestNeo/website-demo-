<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Topic — Step 01 | M.LoreWorld</title>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(ellipse at 50% 30%, rgba(70,72,212,0.04) 0%, transparent 60%),
                  var(--color-background);
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .topic-wizard { max-width: 640px; margin: 80px auto; width: 90%; }
  </style>
</head>
<body>

<div style="position:fixed;top:0;left:0;right:0;padding:var(--space-sm) var(--space-md);z-index:50;display:flex;align-items:center;gap:12px">
  <img src="../assets/image/M.LoreWorld logo.png" alt="M.LoreWorld" style="height:24px;width:auto">
  <span style="font-weight:700">M.LoreWorld</span>
  <span style="margin-left:auto;font-size:var(--fs-label-sm);color:var(--color-outline)">Create Topic</span>
</div>

<div class="topic-wizard">
  <!-- Progress -->
  <div class="progress-steps" style="justify-content:center;margin-bottom:var(--space-lg)">
    <div class="progress-step active"><span class="dot">1</span><span>Info</span></div>
    <div class="progress-connector"></div>
    <div class="progress-step pending"><span class="dot" style="background:var(--color-outline-variant);color:var(--color-outline)">2</span><span style="color:var(--color-outline)">Branding</span></div>
    <div class="progress-connector"></div>
    <div class="progress-step pending"><span class="dot" style="background:var(--color-outline-variant);color:var(--color-outline)">3</span><span style="color:var(--color-outline)">Review</span></div>
  </div>

  <div class="card tilt-container" style="padding:var(--space-lg)">
    <h2 class="headline-md" style="margin-bottom:4px">Create a New Topic</h2>
    <p class="body-md" style="color:var(--color-on-surface-variant);margin-bottom:var(--space-md)">Step 1: Define your topic</p>

    <div class="form-group">
      <label class="form-label">Topic Name</label>
      <input type="text" class="input-glass" id="topicName" placeholder="e.g. Digital Sovereignty Protocols">
    </div>
    <div class="form-group">
      <label class="form-label">Short Description</label>
      <textarea class="input-glass" id="topicDesc" placeholder="What is this topic about?" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px" id="categoryGrid"></div>
    </div>

    <div class="flex-between" style="margin-top:var(--space-lg)">
      <a href="dashboard.html" class="btn btn-ghost">Discard Draft</a>
      <button class="btn btn-primary btn-lg" onclick="handleNext()">
        Continue to Branding
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
    <p id="formError" style="color:var(--color-error);font-size:var(--fs-label-sm);margin-top:var(--space-sm);display:none"></p>
  </div>
</div>

<script src="../assets/js/tilt.js"></script>
<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/storage.js"></script>
<script>
  var categories = [
    { id: 'governance', icon: 'account_balance', label: 'Governance' },
    { id: 'art', icon: 'palette', label: 'Art & Lore' },
    { id: 'tech', icon: 'memory', label: 'Technology' },
    { id: 'social', icon: 'groups', label: 'Social' },
    { id: 'other', icon: 'more_horiz', label: 'Other' },
  ];
  var selectedCategory = '';

  document.getElementById('categoryGrid').innerHTML = categories.map(function(c) {
    return '<button class="btn btn-ghost" style="flex-direction:column;padding:12px 8px;gap:4px" onclick="selectCategory(\'' + c.id + '\', this)" data-cat="' + c.id + '">' +
      '<span class="material-symbols-outlined" style="font-size:24px">' + c.icon + '</span>' +
      '<span class="label-sm">' + c.label + '</span>' +
    '</button>';
  }).join('');

  function selectCategory(id, el) {
    selectedCategory = id;
    document.querySelectorAll('#categoryGrid button').forEach(function(b) {
      b.style.background = ''; b.style.border = ''; b.style.color = '';
    });
    el.style.background = 'rgba(70,72,212,0.1)';
    el.style.border = '1px solid rgba(70,72,212,0.2)';
    el.style.color = 'var(--color-primary)';
  }

  function handleNext() {
    var name = document.getElementById('topicName').value.trim();
    var desc = document.getElementById('topicDesc').value.trim();
    if (!name) { showError('Please enter a topic name'); return; }
    if (!desc) { showError('Please enter a description'); return; }
    if (!selectedCategory) { showError('Please select a category'); return; }

    localStorage.setItem('slati_topic_draft', JSON.stringify({
      name: name, description: desc, category: selectedCategory
    }));
    window.location.href = 'create-topic-step-2.html';
  }

  function showError(msg) {
    var el = document.getElementById('formError');
    el.textContent = msg; el.style.display = '';
    setTimeout(function () { el.style.display = 'none'; }, 3000);
  }
</script>
<script src="../assets/js/transitions.js"></script>
</body>
</html>
