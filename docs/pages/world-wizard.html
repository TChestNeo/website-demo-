<head>

  <script>
  /* 防主题白闪：原 theme-init.js 内联——必须 CSS 之前同步执行（外链脚本走网络晚到 → 页面先按默认主题画一帧再跳 = 切页闪白） */
  (function () {
    var theme = 'light';
    try {
      var raw = localStorage.getItem('slati_settings');
      if (raw) {
        var s = JSON.parse(raw);
        if (s.theme) theme = s.theme;
      }
    } catch (e) {}
    if (theme === 'auto') {
      var h = new Date().getHours();
      theme = (h >= 20 || h < 5) ? 'dark' : 'light';
    } else if (theme === 'system') {
      theme = 'light';
    }
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>

  // ── 引擎 ──
  var params = new URLSearchParams(window.location.search);
  var typeKey = params.get('type');
  var cfg = null;
  for (var i = 0; i < WORLD_TYPE_CONFIGS.length; i++) {
    if (WORLD_TYPE_CONFIGS[i].key === typeKey) { cfg = WORLD_TYPE_CONFIGS[i]; break; }
  }

  // nation 走既有国家流程；未知类型回选型页
  if (typeKey === 'nation') { window.location.href = 'registry-step-1.html'; }
  else if (!cfg) { window.location.href = 'create-world.html'; }
  else { bootWizard(cfg); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fieldHTML(f, values) {
    var val = values[f.key] || '';
    if (f.type === 'textarea') {
      return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
        '<textarea class="input-glass" id="f_' + f.key + '" rows="4" placeholder="' + esc(f.ph || '') + '">' + esc(val) + '</textarea></div>';
    }
    if (f.type === 'select') {
      var opts = '<option value="">请选择…</option>';
      (f.options || []).forEach(function (o) {
        opts += '<option value="' + esc(o) + '"' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>';
      });
      return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
        '<select class="input-glass" id="f_' + f.key + '">' + opts + '</select></div>';
    }
    return '<div class="form-group"><label class="form-label">' + f.label + '</label>' +
      '<input type="text" class="input-glass" id="f_' + f.key + '" placeholder="' + esc(f.ph || '') + '" value="' + esc(val) + '">' +
    '</div>';
  }

  function bootWizard(config) {
    var state = { step: 0 };

    // 草稿恢复（同类型才恢复；合并所有已存步的字段，并回到上次所在步）
    var draft = SlatiDB.getWorldDraft();
    var values = {};
    if (draft && draft.typeKey === config.key && draft.steps) {
      for (var s = 1; s <= 3; s++) {
        if (!draft.steps[s]) continue;
        Object.keys(draft.steps[s]).forEach(function (k) { values[k] = draft.steps[s][k]; });
      }
      state.step = Math.min(Math.max((draft.currentStep || 1) - 1, 0), 2);
    }

    document.getElementById('wizardTitle').textContent = config.emoji + ' ' + config.label;
    document.getElementById('wizardSub').textContent = config.tagline;

    // 进度条
    var bar = '';
    config.steps.forEach(function (st, idx) {
      var cls = idx === state.step ? 'active' : (idx < state.step ? 'completed' : 'pending');
      var dot;
      if (idx < state.step) dot = '<span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span>';
      else dot = '<span class="dot"' + (cls === 'pending' ? ' style="background:var(--color-outline-variant);color:var(--color-outline)"' : '') + '>' + (idx + 1) + '</span>';
      var labelStyle = cls === 'pending' ? ' style="color:var(--color-outline)"' : '';
      bar += '<div class="progress-step ' + cls + '">' + dot + '<span' + labelStyle + '>' + st.title + '</span></div>';
      if (idx < config.steps.length - 1) bar += '<div class="progress-connector' + (idx < state.step ? ' done' : '') + '"></div>';
    });
    document.getElementById('progressBar').innerHTML = bar;

    // 面板
    document.getElementById('stepPanels').innerHTML = config.steps.map(function (st, idx) {
      return '<div class="wizard-panel" data-step="' + idx + '"' + (idx === state.step ? '' : ' style="display:none"') + '>' +
        '<h3 class="label-md" style="margin-bottom:var(--space-md);color:var(--color-on-surface)">Step ' + (idx + 1) + ' — ' + st.title + '</h3>' +
        st.fields.map(function (f) { return fieldHTML(f, values); }).join('') +
      '</div>';
    }).join('');

    var btnNextLabel = document.getElementById('btn-next-label');
    var btnNext = document.getElementById('btn-next');
    var btnPrev = document.getElementById('btn-prev');

    function syncButtons() {
      var last = state.step === config.steps.length - 1;
      btnNextLabel.textContent = last ? '提交创建' : '下一步：' + config.steps[state.step + 1].title;
      btnNext.querySelector('.material-symbols-outlined').textContent = last ? 'check' : 'arrow_forward';
      btnPrev.textContent = state.step === 0 ? '返回类型选择' : '上一步';
      btnPrev.classList.toggle('btn-ghost', true);
      if (state.step > 0) {
        btnPrev.setAttribute('href', 'javascript:void(0)');
        btnPrev.onclick = function (e) { if (e) e.preventDefault(); goTo(state.step - 1); };
      } else {
        btnPrev.setAttribute('href', 'create-world.html');
        btnPrev.onclick = null;
      }
    }

    function goTo(idx) {
      state.step = idx;
      var panels = document.querySelectorAll('.wizard-panel');
      panels.forEach(function (p, i) { p.style.display = i === idx ? '' : 'none'; });
      // 重建进度条
      var steps = config.steps;
      var bar2 = '';
      steps.forEach(function (st, i2) {
        var cls = i2 === idx ? 'active' : (i2 < idx ? 'completed' : 'pending');
        var dot;
        if (i2 < idx) dot = '<span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span>';
        else dot = '<span class="dot"' + (cls === 'pending' ? ' style="background:var(--color-outline-variant);color:var(--color-outline)"' : '') + '>' + (i2 + 1) + '</span>';
        var labelStyle = cls === 'pending' ? ' style="color:var(--color-outline)"' : '';
        bar2 += '<div class="progress-step ' + cls + '">' + dot + '<span' + labelStyle + '>' + st.title + '</span></div>';
        if (i2 < steps.length - 1) bar2 += '<div class="progress-connector' + (i2 < idx ? ' done' : '') + '"></div>';
      });
      document.getElementById('progressBar').innerHTML = bar2;
      syncButtons();
    }

    window.handleNext = function () {
      var st = config.steps[state.step];
      var stepValues = {};
      var missing = null;
      st.fields.forEach(function (f) {
        var el = document.getElementById('f_' + f.key);
        stepValues[f.key] = el ? el.value.trim() : '';
        if (f.required && !stepValues[f.key] && !missing) missing = f.label;
      });
      if (missing) { showError('请填写：' + missing); return; }

      // 写入草稿（含本步全部字段，便于恢复）
      SlatiDB.saveWorldDraft(config.key, state.step + 1, stepValues);

      if (state.step === config.steps.length - 1) {
        // 汇总全部步的字段 → 提交
        var all = {};
        var finalDraft = SlatiDB.getWorldDraft();
        for (var s = 1; s <= 3; s++) {
          if (!finalDraft.steps[s]) continue;
          Object.keys(finalDraft.steps[s]).forEach(function (k) { all[k] = finalDraft.steps[s][k]; });
        }
        var record = {
          type: config.key,
          typeLabel: config.label,
          emoji: config.emoji,
          name: all.name,
          lore: all.lore || '',
        };
        Object.keys(all).forEach(function (k) { record[k] = all[k]; });
        SlatiDB.submitWorld(record);
        window.location.href = 'world-created.html';
        return;
      }
      goTo(state.step + 1);
    };

    function showError(msg) {
      var el = document.getElementById('formError');
      el.textContent = msg; el.style.display = '';
      setTimeout(function () { el.style.display = 'none'; }, 3000);
    }

    syncButtons();
  }
