<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../assets/image/M.NationWorld logo circle_.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | M.NationWorld</title>
  
  <script>
  /* 防主题白闪：原 theme-init.js 内联——必须 CSS 之前同步执行（外链脚本走网络晚到 → 页面先按默认主题画一帧再跳 = 切页闪白） */
  (function () {
    var theme = 'light';
    try {
      var raw = localStorage.getItem('slati_settings');
      if (raw) {
        var s = JSON.parse(raw);
        if (s.theme) theme = s.theme;
      }
    } catch (e) {}
    if (theme === 'auto') {
      var h = new Date().getHours();
      theme = (h >= 20 || h < 5) ? 'dark' : 'light';
    } else if (theme === 'system') {
      theme = 'light';
    }
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>
  <style>
/* ethereal.css 内联（切页闪修复 08-28：样式与 HTML 同包到达——浏览器画第一帧不再等样式表往返）*/
/* ============================================================
   Ethereal Statecraft — M.NationWorld Design System
   Extracted from 20+ UI prototypes + DESIGN.md
   ============================================================ */

/* ----- Design Tokens (CSS Custom Properties) ----- */
:root {
  /* Surface */
  --color-surface: #f7f9fb;
  --color-surface-dim: #d8dadc;
  --color-surface-bright: #f7f9fb;
  --color-surface-container-lowest: #ffffff;
  --color-surface-container-low: #f2f4f6;
  --color-surface-container: #eceef0;
  --color-surface-container-high: #e6e8ea;
  --color-surface-container-highest: #e0e3e5;
  --color-surface-variant: #e0e3e5;
  --color-surface-tint: #494bd6;
  --color-background: #f7f9fb;

  /* On-surface (text) */
  --color-on-surface: #191c1e;
  --color-on-surface-variant: #464554;
  --color-on-background: #191c1e;

  /* Primary */
  --color-primary: #4648d4;
  --color-on-primary: #ffffff;
  --color-primary-container: #6063ee;
  --color-on-primary-container: #fffbff;
  --color-primary-fixed: #e1e0ff;
  --color-primary-fixed-dim: #c0c1ff;
  --color-on-primary-fixed: #07006c;
  --color-on-primary-fixed-variant: #2f2ebe;
  --color-inverse-primary: #c0c1ff;

  /* Secondary */
  --color-secondary: #8127cf;
  --color-on-secondary: #ffffff;
  --color-secondary-container: #9c48ea;
  --color-on-secondary-container: #fffbff;
  --color-secondary-fixed: #f0dbff;
  --color-secondary-fixed-dim: #ddb7ff;
  --color-on-secondary-fixed: #2c0051;
  --color-on-secondary-fixed-variant: #6900b3;

  /* Tertiary */
  --color-tertiary: #904900;
  --color-on-tertiary: #ffffff;
  --color-tertiary-container: #b55d00;
  --color-on-tertiary-container: #fffbff;
  --color-tertiary-fixed: #ffdcc5;
  --color-tertiary-fixed-dim: #ffb783;
  --color-on-tertiary-fixed: #301400;
  --color-on-tertiary-fixed-variant: #703700;

  /* Error */
  --color-error: #ba1a1a;
  --color-on-error: #ffffff;
  --color-error-container: #ffdad6;
  --color-on-error-container: #93000a;

  /* Outline */
  --color-outline: #767586;
  --color-outline-variant: #c7c4d7;

  /* Inverse */
  --color-inverse-surface: #2d3133;
  --color-inverse-on-surface: #eff1f3;

  /* Typography Scale */
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --fs-display-lg: 48px;
  --fs-headline-lg: 30px;
  --fs-headline-md: 24px;
  --fs-body-lg: 18px;
  --fs-body-md: 16px;
  --fs-label-md: 14px;
  --fs-label-sm: 12px;

  /* Spacing (8px scale) */
  --space-xs: 4px;
  --space-sm: 12px;
  --space-base: 8px;
  --space-md: 24px;
  --space-lg: 40px;
  --space-xl: 64px;
  --space-gutter: 24px;
  --space-container-max: 1200px;

  /* Border Radius */
  --radius-sm: 0.25rem;
  --radius-DEFAULT: 0.5rem;
  --radius-md: 0.75rem;
  --radius-lg: 1rem;
  --radius-xl: 1.5rem;
  --radius-full: 9999px;

  /* Sidebar */
  --sidebar-width: 260px;

  /* Glass defaults */
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-blur: blur(20px);
  --glass-border: rgba(255, 255, 255, 0.35);
  --glass-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.04);

  /* Component surface tokens */
  --card-bg: rgba(255, 255, 255, 0.55);
  --card-bg-hover: rgba(255, 255, 255, 0.75);
  --card-border: 1px solid rgba(255, 255, 255, 0.4);
  --input-bg: rgba(255, 255, 255, 0.6);
  --input-bg-focus: rgba(255, 255, 255, 0.85);
  --modal-bg: rgba(255, 255, 255, 0.85);
  --modal-border: 1px solid rgba(255, 255, 255, 0.4);
  --subnav-bg: #f2f4f6;
  --subnav-border: 1px solid rgba(255, 255, 255, 0.4);
  --subnav-ring: rgba(255, 255, 255, 0.4);
  --sidebar-bg: rgba(255, 255, 255, 0.95);
  --sidebar-border: 1px solid rgba(255, 255, 255, 0.5);
  --btn-ghost-hover: rgba(70, 72, 212, 0.05);
  --btn-outline-hover: rgba(255, 255, 255, 0.4);
  --divider-line: rgba(118, 117, 134, 0.08);
  --divider-line-strong: rgba(118, 117, 134, 0.14);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
}
/* Font-size presets — override font tokens via data-font-size on <html> */
:root[data-font-size="small"] {
  --fs-display-lg: 40px;
  --fs-headline-lg: 26px;
  --fs-headline-md: 21px;
  --fs-body-lg: 15px;
  --fs-body-md: 14px;
  --fs-label-md: 12px;
  --fs-label-sm: 11px;
}
:root[data-font-size="large"] {
  --fs-display-lg: 56px;
  --fs-headline-lg: 35px;
  --fs-headline-md: 28px;
  --fs-body-lg: 21px;
  --fs-body-md: 18px;
  --fs-label-md: 16px;
  --fs-label-sm: 13px;
}
/* ── Dark Theme ── */
:root[data-theme="dark"] {
  --color-surface: #1e1e30;
  --color-surface-dim: #161628;
  --color-surface-bright: #282840;
  --color-surface-container-lowest: #121220;
  --color-surface-container-low: #181828;
  --color-surface-container: #202038;
  --color-surface-container-high: #282848;
  --color-surface-container-highest: #303058;
  --color-surface-variant: #383860;
  --color-surface-tint: #7b7df0;
  --color-background: #161625;

  --color-on-surface: #e2e2e8;
  --color-on-surface-variant: #b8b8c8;
  --color-on-background: #e2e2e8;

  --color-outline: #8e8e9e;
  --color-outline-variant: #505068;

  --color-inverse-surface: #eff1f3;
  --color-inverse-on-surface: #2d3133;

  /* Glass → dark glass */
  --glass-bg: #1e1e32;
  --glass-blur: blur(20px);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.25);

  /* Component surfaces → dark (solid colors, no white overlay) */
  --card-bg: #1e1e32;
  --card-bg-hover: #262640;
  --card-border: 1px solid rgba(255, 255, 255, 0.08);
  --input-bg: #1a1a2c;
  --input-bg-focus: #222238;
  --modal-bg: rgba(30, 30, 55, 0.96);
  --modal-border: 1px solid rgba(255, 255, 255, 0.10);
  --subnav-bg: #1e1e32;
  --subnav-border: 1px solid rgba(255, 255, 255, 0.08);
  --subnav-ring: rgba(255, 255, 255, 0.08);
  --sidebar-bg: #1a1a2e;
  --sidebar-border: 1px solid rgba(255, 255, 255, 0.08);
  --btn-ghost-hover: rgba(70, 72, 212, 0.15);
  --btn-outline-hover: rgba(255, 255, 255, 0.08);
  --divider-line: rgba(255, 255, 255, 0.08);
  --divider-line-strong: rgba(255, 255, 255, 0.12);
  --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.16);
  --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.20);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.35);
}

/* ----- Reset & Base ----- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-family: var(--font-family);
  font-size: var(--fs-body-md);
  color: var(--color-on-surface);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  line-height: 1.6;
  background: var(--color-background);
  transition: background 0.35s ease, color 0.35s ease;
}

a { color: var(--color-primary); text-decoration: none; }
a:hover { opacity: 0.85; }

button { color: inherit; }

/* ----- Typography Utilities ----- */
.display-lg {
  font-family: var(--font-family);
  font-size: var(--fs-display-lg);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.headline-lg {
  font-family: var(--font-family);
  font-size: var(--fs-headline-lg);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.headline-md {
  font-family: var(--font-family);
  font-size: var(--fs-headline-md);
  font-weight: 600;
  line-height: 1.3;
}
.body-lg {
  font-family: var(--font-family);
  font-size: var(--fs-body-lg);
  font-weight: 400;
  line-height: 1.6;
}
.body-md {
  font-family: var(--font-family);
  font-size: var(--fs-body-md);
  font-weight: 400;
  line-height: 1.6;
}
.label-md {
  font-family: var(--font-family);
  font-size: var(--fs-label-md);
  font-weight: 500;
  line-height: 1.4;
  letter-spacing: 0.01em;
}
.label-sm {
  font-family: var(--font-family);
  font-size: var(--fs-label-sm);
  font-weight: 600;
  line-height: 1.2;
}
.text-mono { font-family: var(--font-mono); }
.text-gradient {
  background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.text-on-surface { color: var(--color-on-surface); }
.text-on-surface-variant { color: var(--color-on-surface-variant); }
.text-primary { color: var(--color-primary); }
.text-outline { color: var(--color-outline); }

/* ----- Glassmorphism ----- */
.liquid-glass {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-lg);
}
.liquid-glass-card {
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: var(--card-border);
  box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
  border-radius: var(--radius-lg);
}
.glass-panel {
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: var(--card-border);
  border-radius: var(--radius-lg);
}

/* ----- Buttons ----- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 24px;
  font-family: var(--font-family);
  font-size: var(--fs-label-md);
  font-weight: 600;
  border-radius: var(--radius-full);
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active { transform: scale(0.95); }
.btn-primary {
  background: linear-gradient(135deg, var(--color-primary), #5b5de0);
  color: var(--color-on-primary);
  box-shadow: 0 4px 16px rgba(70, 72, 212, 0.25);
}
.btn-primary:hover { opacity: 0.9; box-shadow: 0 6px 20px rgba(70, 72, 212, 0.35); }
.btn-secondary {
  background: var(--color-secondary);
  color: var(--color-on-secondary);
}
.btn-secondary:hover { opacity: 0.9; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--color-outline-variant);
  color: var(--color-on-surface-variant);
}
.btn-outline:hover { background: var(--btn-outline-hover); }
.btn-ghost {
  background: transparent;
  color: var(--color-on-surface-variant);
}
.btn-ghost:hover { background: var(--btn-ghost-hover); }
.btn-sm { padding: 6px 16px; font-size: var(--fs-label-sm); }
.btn-lg { padding: 14px 32px; font-size: var(--fs-body-md); }
.btn-icon {
  width: 40px; height: 40px; padding: 0;
  border-radius: var(--radius-full);
}
.btn:disabled {
  opacity: 0.5; cursor: not-allowed; pointer-events: none;
}

/* ----- Inputs ----- */
.input-glass {
  width: 100%;
  padding: 12px 16px;
  font-family: var(--font-family);
  font-size: var(--fs-body-md);
  color: var(--color-on-surface);
  background: var(--input-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--color-outline-variant);
  border-radius: var(--radius-xl);
  outline: none;
  transition: all 0.2s ease;
}
.input-glass:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(70, 72, 212, 0.1);
  background: var(--input-bg-focus);
}
.input-glass::placeholder { color: rgba(118, 117, 134, 0.4); }
textarea.input-glass {
  resize: vertical;
  min-height: 100px;
}

/* ----- Search Capsule ----- */
.search-capsule {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 320px;
  height: 40px;
  padding: 0 16px;
  background: var(--input-bg-focus);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: var(--card-border);
  border-radius: var(--radius-full);
}
.search-capsule input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-family: var(--font-family);
  font-size: var(--fs-label-md);
  color: var(--color-on-surface);
}
.search-capsule input::placeholder { color: rgba(118, 117, 134, 0.4); }
.search-capsule .material-symbols-outlined {
  font-size: 20px;
  color: var(--color-outline);
}

/* ----- Form Label ----- */
.form-label {
  display: block;
  font-size: var(--fs-label-md);
  font-weight: 500;
  color: var(--color-on-surface-variant);
  margin-bottom: 6px;
}
.form-group { margin-bottom: var(--space-md); }

/* ----- Cards ----- */
.card {
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: var(--card-border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  box-shadow: var(--shadow-md);
}
.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
  transition: all 0.2s ease;
}

/* ----- Status Dots ----- */
.status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot-green { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.4); }
.status-dot-blue  { background: #3b82f6; box-shadow: 0 0 6px rgba(59, 130, 246, 0.4); }
.status-dot-yellow { background: #eab308; box-shadow: 0 0 6px rgba(234, 179, 8, 0.4); }
.status-dot-cyan  { background: #06b6d4; box-shadow: 0 0 6px rgba(6, 182, 212, 0.4); }

/* ----- Badges / Chips ----- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  font-size: var(--fs-label-sm);
  font-weight: 600;
  border-radius: var(--radius-full);
}
.badge-primary { background: rgba(70, 72, 212, 0.1); color: var(--color-primary); }
.badge-secondary { background: rgba(129, 39, 207, 0.1); color: var(--color-secondary); }
.badge-success { background: rgba(34, 197, 94, 0.1); color: #16a34a; }
.badge-warning { background: rgba(234, 179, 8, 0.1); color: #a16207; }

/* ----- 3D Tilt Container ----- */
.tilt-container {
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 0.1s ease-out;
  border-radius: var(--radius-lg);
}

/* ----- Modal System ----- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-backdrop.active { opacity: 1; pointer-events: auto; }
.modal-container {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 110;
  pointer-events: none;
}
.modal-card {
  background: var(--modal-bg);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border: var(--modal-border);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  max-width: 560px;
  width: 90%;
  max-height: 85vh;
  overflow: hidden;  /* clip corners → border-radius actually rounds */
  box-shadow: var(--shadow-lg);
  transform: scale(0.95);
  opacity: 0;
  transition: all 0.25s ease;
}
/* Inner scroll body — carries the scroll so border-radius stays intact */
.modal-card-body {
  max-height: calc(85vh - 2 * var(--space-lg));
  overflow-y: auto;
  padding-right: 6px;  /* breathing room for scrollbar */
  scrollbar-width: thin;
  scrollbar-color: rgba(118,117,134,0.18) transparent;
}
.modal-card-body::-webkit-scrollbar { width: 5px; }
.modal-card-body::-webkit-scrollbar-track {
  background: transparent;
  margin-block: 6px;
}
.modal-card-body::-webkit-scrollbar-thumb {
  background: rgba(118,117,134,0.18);
  border-radius: 10px;
}
.modal-card-body::-webkit-scrollbar-thumb:hover { background: rgba(118,117,134,0.32); }
/* Keep old modal-card scrollbar for backward compat with existing modals */
.modal-card:not(:has(.modal-card-body)) {
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(118,117,134,0.2) transparent;
}
.modal-card.active { transform: scale(1); opacity: 1; pointer-events: auto; }

/* ----- Progress Steps ----- */
.progress-steps {
  display: flex;
  align-items: center;
  gap: 0;
}
.progress-step {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-label-sm);
  font-weight: 600;
}
.progress-step .dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.progress-step.active .dot { background: var(--color-primary); color: white; }
/* 2026-09-01 用户「打勾能不能改成蓝色的」：完成勾绿 #22c55e → 品牌蓝（与白卡上自选条款勾选框「品牌蓝底白勾」同款视觉语言） */
.progress-step.completed .dot { background: var(--color-primary); color: white; }
.progress-step.pending .dot { background: var(--color-outline-variant); color: var(--color-outline); }
.progress-connector {
  width: 24px; height: 1px;
  background: var(--color-outline-variant);
  margin: 0 8px;
}
.progress-connector.done { background: var(--color-primary); }

/* ----- Sidebar Module ----- */
.sidebar-module {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: var(--card-border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  box-shadow: var(--shadow-md);
}
.sidebar-module + .sidebar-module { margin-top: var(--space-base); }

/* ----- Nav Item ----- */
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  color: var(--color-on-surface-variant);
  font-size: var(--fs-label-md);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
}
.nav-item {
  transition: background 0.25s ease, color 0.25s ease, font-weight 0.25s ease, border 0.25s ease;
}
.nav-item:hover { background: rgba(70, 72, 212, 0.05); }
.nav-item.active {
  background: rgba(70, 72, 212, 0.1);
  border: 1px solid rgba(70, 72, 212, 0.15);
  color: var(--color-primary);
  font-weight: 700;
  animation: navGlow 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
}
@keyframes navGlow {
  0% { background: rgba(70, 72, 212, 0); border-color: transparent; }
  50% { background: rgba(70, 72, 212, 0.15); }
  100% { background: rgba(70, 72, 212, 0.1); border-color: rgba(70, 72, 212, 0.15); }
}
.nav-item .material-symbols-outlined { font-size: 20px; }

/* ----- Sub Nav Pills ----- */
.subnav {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--subnav-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: none;
  box-shadow: inset 0 0 0 1px var(--subnav-ring);
  border-radius: 32px;
}
.subnav-pill {
  padding: 8px 20px;
  font-size: var(--fs-label-md);
  font-weight: 500;
  color: var(--color-on-surface-variant);
  border-radius: var(--radius-full);
  border: none;
  background: transparent;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  text-align: center;
  text-decoration: none;
  font-family: inherit;
  line-height: 1.5;
}
.subnav-highlight-bg {
  background: var(--color-surface-bright);
}
.subnav-highlight-clone {
  background: transparent;
}
.subnav-pill.active {
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  color: var(--color-on-surface);
}

/* ----- Scrollbar ----- */
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: rgba(118, 117, 134, 0.2);
  border-radius: 3px;
}
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(118, 117, 134, 0.35); }

/* ----- Dropdown (custom) ----- */
.dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--sidebar-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: var(--sidebar-border);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
  max-height: 240px;
  overflow-y: auto;
  z-index: 50;
  display: none;
}
.dropdown-menu.open { display: block; }
.dropdown-option {
  padding: 10px 16px;
  font-size: var(--fs-label-md);
  color: var(--color-on-surface);
  cursor: pointer;
  transition: background 0.1s;
}
.dropdown-option:hover { background: rgba(70, 72, 212, 0.05); }
.dropdown-option.selected { background: rgba(70, 72, 212, 0.1); color: var(--color-primary); font-weight: 600; }

/* ----- Dividers ----- */
.divider {
  height: 1px;
  background: var(--divider-line-strong);
  margin: var(--space-sm) 0;
}

/* ----- Avatar ----- */
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
}
.avatar-sm { width: 28px; height: 28px; }
.avatar-lg { width: 56px; height: 56px; }

/* ----- Animations ----- */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(70, 72, 212, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(70, 72, 212, 0); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes scaleIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.animate-fade-in-up { animation: fadeInUp 0.4s ease forwards; }
.animate-fade-in { animation: fadeIn 0.3s ease forwards; }
.animate-float { animation: float 3s ease-in-out infinite; }
.animate-pulse-glow { animation: pulse-glow 2s infinite; }
.animate-spin { animation: spin 1s linear infinite; }
.animate-scale-in { animation: scaleIn 0.35s ease forwards; }

/* ----- Page Transition ----- */
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pageExit {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-12px); }
}

/* ----- 切页防双重绘制（08-28）：淡入编排开始前卡片保持隐藏——若浏览器在 DOMContentLoaded
   前先画一帧，内容会「闪一下再消失」；transitions.js 的 initStagger 一开始就移除 body 上的
   pre-stagger 类（HTML 内 1.6s 兜底脚本防脚本失效永久隐藏）。选择器与 transitions.js
   CARD_SELECTOR 逐字对齐；这里不设 transform——入场位移由 initStagger 内联给定。 ----- */
body.pre-stagger .card,
body.pre-stagger .app-main h1,
body.pre-stagger .app-main h1 + p,
body.pre-stagger .app-main h2,
body.pre-stagger .app-main .search-capsule,
body.pre-stagger .app-main header,
body.pre-stagger .auth-card { opacity: 0; }

/* ----- Spinner ----- */
.spinner {
  width: 24px; height: 24px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ----- Toggle / Switch ----- */
.toggle-switch {
  position: relative;
  width: 44px; height: 24px;
  background: var(--color-outline-variant);
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-switch.active { background: var(--color-primary); }
.toggle-switch::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 20px; height: 20px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.toggle-switch.active::after { transform: translateX(20px); }

/* ----- File Upload Zone ----- */
.upload-zone {
  border: 2px dashed var(--color-outline-variant);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--btn-outline-hover);
}
.upload-zone:hover {
  border-color: var(--color-primary);
  background: rgba(70, 72, 212, 0.03);
}

/* ----- Segmented Control ----- */
.segmented-control {
  display: flex;
  background: var(--subnav-bg);
  border-radius: var(--radius-full);
  padding: 4px;
  border: var(--subnav-border);
}
.segmented-option {
  flex: 1;
  text-align: center;
  padding: 8px 20px;
  border-radius: var(--radius-full);
  font-size: var(--fs-label-md);
  font-weight: 500;
  color: var(--color-on-surface-variant);
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: transparent;
  white-space: nowrap; /* v0.2.3.11 标签折行修复（用户「Sign up 的 up 在 Sign 下方，能不能和 Log in 一样一行」）：active 加粗 font-weight 600 后按钮最小内容宽塌缩（min-content=最长单词），flex:1 均分下「Sign up」折成两行——nowrap 使 min-content=完整文字，控件按整词自适宽 */
}
.segmented-option.active {
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  color: var(--color-on-surface);
  font-weight: 600;
}

/* ----- Tooltip ----- */
.tooltip {
  position: absolute;
  background: var(--color-inverse-surface);
  color: var(--color-inverse-on-surface);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-label-sm);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 200;
}

/* ----- Layout Utilities ----- */
.flex-center { display: flex; align-items: center; justify-content: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-xs { gap: var(--space-xs); }
.gap-sm { gap: var(--space-sm); }
.gap-md { gap: var(--space-md); }
.gap-lg { gap: var(--space-lg); }

/* ----- Auth split-card layout (for login/onboarding) ----- */
.auth-layout {
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  padding: var(--space-md);
}
.auth-card {
  display: flex;
  flex-direction: column; /* 双表单横排独占卡体；tabs/页脚绝对浮层（v2.3.9 反向滑） */
  max-width: 960px;
  width: 100%;
  height: 800px; /* 定高：tabs/footer 浮层化后表单半独占 800，居中净空上/下各约 129px ≥ 浮层区（tabs 约 58 / footer 约 82）（电池实测 signup 542）；≤768 恢复 auto */
  border-radius: var(--radius-lg); /* v2.3.10 内凹移除（用户「为什么右侧的角落是凹进去的」→ 问询钦定普通圆角）：四角对称 */
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  position: relative;
  z-index: 2;
  /* 整卡磨砂白底：蓝板覆盖半与表单半一体白色磨砂（v2.3.10 内凹移除后：洞形背景退为纯底色） */
  background-color: var(--card-bg);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
}
.auth-tabs {
  position: absolute; /* v2.3.9 反向滑：不再占文档流顶部行，浮层盖在表单半上方；v2.3.10 层级降 z 2 垫蓝板下（用户「蓝色卡片在最上方，他们在蓝色卡片的下方」） */
  top: var(--space-md);
  left: 0;
  width: 50%;
  display: flex;
  justify-content: center; /* 标签栏居停靠半内，活跃标签悬可见表单上方 */
  z-index: 2;
  transform: translateX(0); /* 默认 login 激活（蓝板在右）→ 标签栏停左半，与蓝板反向 */
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* 与蓝板同缓动同程=跷跷板同步 */
}
.auth-card.auth-tab-signup .auth-tabs {
  transform: translateX(100%); /* signup 激活（蓝板在左）→ 标签栏滑右半 */
}
.auth-panes {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
}
.auth-pane {
  width: 50%;
  padding: var(--space-sm) var(--space-lg); /* 垂直 64→12：800 定高下两半表单无滚动（电池实测 signup 542/login 482，预算 584） */
  display: flex;
  flex-direction: column;
  justify-content: safe center; /* 内容超高时顶部不被裁（api 模式验证码组/报错变高兜底） */
  overflow-y: auto;
  transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); /* v0.2.3.11 表单随蓝板方向淡出淡入（用户「切换时输入根据蓝色卡片移动方向淡出淡入」）：与板同缓动同程无延迟——被盖半淡出、露出半淡入，每瞬值=蓝板缓动后进度（opacity 动画钟与 transform 钟可互相断言）；opacity 不影响 hit-test，露出半半透明时点击仍有效 */
}
/* v0.2.3.11：默认 login 激活（蓝板盖右半 signup）→ signup 半 opacity 0；切 tab 状态类翻转驱动（v0.2.3.15 全部互换）。
   移动端（≤768）非激活半 display:none——display:none 元素不启动 transition（电池实证 opLi 直接=1），切换即时显示无淡入；板字幕 cross-fade 仍在 */
.auth-pane-login { opacity: 1; }
.auth-pane-signup { opacity: 0; }
.auth-card.auth-tab-signup .auth-pane-login { opacity: 0; }
.auth-card.auth-tab-signup .auth-pane-signup { opacity: 1; }
.auth-footer {
  position: absolute; /* v2.3.9 反向滑：与标签栏同理，不占文档流底部行，浮层随可见半滑动；v2.3.10 层级降 z 2 垫蓝板下 */
  bottom: var(--space-sm);
  left: 0;
  width: 50%;
  padding: 0 var(--space-lg);
  z-index: 2;
  transform: translateX(0); /* login 激活 → 页脚停左半（与蓝板反向） */
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.auth-card.auth-tab-signup .auth-footer {
  transform: translateX(100%); /* signup 激活 → 页脚滑右半 */
}

/* 蓝板覆盖滑动（08-29 v2 重设计，用户「sign in 输入放左侧 login 放右侧 + 切换只是蓝色卡片左右移动
   + 字幕淡出淡入」；v0.2.3.15 用户「sign up 和 login 倒反了」→ 问询钦定「全部互换」：login 左/signup 右、
   标签 [Log in | Sign up]、默认登录态、字幕配对活跃半）：双表单左右各半并排常驻，板盖住非激活半
   （默认 login → 板在右半盖 signup）；
   切 tab = transform 100%↔0 左右滑 0.6s；停靠侧两角圆角对齐卡缘、贴中缝侧方形——
   border-radius 与 transform 同程过渡，快速反向由 CSS 过渡自然接管；
   v2.3.10：z 4 置顶压过 tabs/页脚（跷跷板滑行中它们从蓝板下穿过，用户钦定「蓝色卡片在最上方」）
   + 右停靠 0 lg lg 0（内凹移除后右缘普通圆角，与卡四角对称圆角对齐）。 */
.auth-panel {
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 50%;
  z-index: 4; /* v2.3.10 置顶：压过表单半与 tabs/页脚 */
  transform: translateX(100%); /* 默认盖右半（signup 表单视觉隐藏） */
  border-radius: 0 var(--radius-lg) var(--radius-lg) 0; /* 右停靠：右缘两角对齐卡圆角 */
  overflow: hidden; /* 随 border-radius 动画裁剪板体 */
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
              border-radius 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.auth-card.auth-tab-signup .auth-panel {
  transform: translateX(0);
  border-radius: var(--radius-lg) 0 0 var(--radius-lg);
}
.auth-panel-body {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--color-primary), #3b3dc4);
  color: white;
  padding: var(--space-xl) var(--space-lg);
  display: flex;
  flex-direction: column;
  justify-content: safe center;
  overflow: hidden;
}
.auth-panel-body::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  top: -80px; right: -80px;
}
.auth-panel-body::after {
  content: '';
  position: absolute;
  width: 200px; height: 200px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  bottom: -40px; left: -60px;
}
.auth-panel-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: var(--space-lg);
}
/* 字幕淡出淡入：两块字幕 grid 叠同格，随卡片 auth-tab-* 状态类 cross-fade——
   outgoing 立即淡出 0.25s，incoming 延迟 0.3s 淡入（板 0.6s 滑到前完成）；零 JS 计时器。
   v0.2.3.15 全部互换：字幕 = 活跃半品牌文案（蓝卡永远跟正在用的表单配对——
   登录态蓝卡说 Welcome back、注册态蓝卡说 Build Your World+步骤；旧版显示被盖半文案挨着对面表单观感「倒反」） */
.auth-panel-captions {
  display: grid;
  align-items: center;
}
.auth-caption {
  grid-area: 1 / 1;
  transition: opacity 0.25s ease;
}
.auth-card.auth-tab-signup .auth-caption-signup { opacity: 1; transition-delay: 0.3s; }
.auth-card.auth-tab-signup .auth-caption-login  { opacity: 0; transition-delay: 0s; }
.auth-card.auth-tab-login  .auth-caption-signup { opacity: 0; transition-delay: 0s; }
.auth-card.auth-tab-login  .auth-caption-login  { opacity: 1; transition-delay: 0.3s; }

/* 条款同意块（v2.3.13 用户「把服务条款和隐私条款放在 Login 的蓝色卡片那边，第一个步骤就需要打勾」+「不是你把打勾放在sign up 干什么」；
   v2.3.14 定制样式+手机适配；v2.4.1 用户「为什么打勾右跑去login那了」→问询钦定「挪进登录表单（左半）」；
   v2.4.2 用户「不是我是希望用户在注册的时候同意就可以了不需要在登录的时候同意因为都同意过了」→挪进注册表单（右半））：
   最终位置=注册表单 Create Account 按钮上方，随注册半淡入淡出（蓝板字幕不带条款、登录不拦不显示——login 态蓝板 z4 压盖拦截点击）；
   配色反相适配白卡——描边品牌蓝半透、勾选品牌蓝底白勾、hover 淡蓝底、focus 蓝环；
   原蓝板白字配色与状态类 cross-fade 规则退役（注册半 opacity 天然覆盖可见性）；
   未勾点 Create Account 由 handleSignup 拦截（demo/api 双模式） */
.auth-terms {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: var(--space-sm);
  font-size: var(--fs-label-sm);
  color: var(--color-on-surface-variant);
  cursor: pointer;
}
.auth-terms input[type='checkbox'] {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin-top: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(70, 72, 212, 0.06);
  border: 1.5px solid rgba(70, 72, 212, 0.45);
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}
.auth-terms input[type='checkbox']:hover { background: rgba(70, 72, 212, 0.12); }
.auth-terms input[type='checkbox']:active { transform: scale(0.92); }
.auth-terms input[type='checkbox']:checked { background: #4648d4; border-color: #4648d4; }
/* 勾选对勾：::after 边框两画旋转 45°，scale 0→1 回弹动效 */
.auth-terms input[type='checkbox']::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: 6px; height: 10px;
  border: solid #ffffff;
  border-width: 0 2.5px 2.5px 0;
  transform: translate(-50%, -55%) rotate(45deg) scale(0);
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.auth-terms input[type='checkbox']:checked::after {
  transform: translate(-50%, -55%) rotate(45deg) scale(1);
}
.auth-terms input[type='checkbox']:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}
.auth-terms a {
  color: var(--color-primary);
  text-decoration: underline;
}

/* 右缘内凹圆角角补丁退役（v2.3.10）：内凹圆角整体移除（卡四角对称普通圆角），角补丁不再需要 */

/* ----- Dashboard layout ----- */
.app-layout {
  display: flex;
  min-height: 100vh;
}
.app-sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  padding: var(--space-md) var(--space-sm);
  display: flex;
  flex-direction: column;
  gap: var(--space-base);
  position: fixed;
  top: 0; left: 0;
  bottom: 0;
  z-index: 50;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none; /* Firefox */
  transition: width 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
              min-width 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
              transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.app-sidebar::-webkit-scrollbar { display: none; }
.app-main {
  flex: 1;
  margin-left: var(--sidebar-width);
  min-width: 0;
  padding: var(--space-md) var(--space-lg);
  transition: margin-left 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* Brand inner layout */
.brand-inner {
  display: flex; align-items: center; gap: var(--space-sm);
  justify-content: flex-start;
}
.brand-text {
  flex: 1; min-width: 0;
  overflow: visible; white-space: nowrap;
}
.brand-logo { flex-shrink: 0; }

/* User module inner layout */
.user-inner {
  display: flex; align-items: center; gap: var(--space-sm);
  justify-content: flex-start;
}
.user-info { min-width: 0; }

/* Collapse button */
.sidebar-collapse-btn {
  display: flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; flex-shrink: 0;
  border: none; background: transparent;
  color: var(--color-outline); cursor: pointer;
  border-radius: 8px;
  margin-left: auto;
  transition: color 0.2s;
}
.sidebar-collapse-btn:hover { color: var(--color-on-surface); }
.sidebar-collapse-btn img { width: 20px; height: 20px; }

/* Collapsible elements — smooth opacity + width transition */
.app-sidebar .brand-text,
.app-sidebar .nav-label,
.app-sidebar .sidebar-divider,
.app-sidebar .user-name,

.app-sidebar.collapsed .nav-label,
.app-sidebar.collapsed .sidebar-divider,
.app-sidebar.collapsed .user-name,
.app-sidebar.collapsed .user-citizen-id {
  opacity: 0; max-width: 0; pointer-events: none;
}
.app-sidebar.collapsed .brand-module,
.app-sidebar.collapsed .user-module,
.app-sidebar.collapsed .nav-module {
  display: flex; flex-direction: column; align-items: center;
}
.app-sidebar.collapsed .brand-inner {
  flex-direction: column; align-items: center; gap: 6px;
}
.app-sidebar.collapsed .sidebar-nav {
  display: flex; flex-direction: column; align-items: center;
  width: 100%;
}
.app-sidebar.collapsed .nav-item {
  justify-content: center; padding: 10px 0 !important;
  width: 100%; text-align: center; gap: 0;
}
.app-sidebar.collapsed .nav-item.active {
  background: transparent; border: none; color: var(--color-primary);
  animation: none;
}
.app-sidebar.collapsed .brand-logo { height: 28px !important; }
.app-sidebar.collapsed .sidebar-collapse-btn {
  position: static; margin-left: 0; width: 24px; height: 24px;
}
.app-sidebar .nav-item { transition: padding 0.3s ease, justify-content 0.3s ease; }
.app-sidebar.collapsed .nav-icon { font-size: 22px; margin: 0; }
.app-sidebar .sidebar-module { transition: padding 0.3s ease; }
.app-sidebar.collapsed .sidebar-module { padding: var(--space-xs); width: 100%; }
.app-sidebar.collapsed .user-module {
  padding: 10px 4px !important;
  display: flex; align-items: center; justify-content: flex-start;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: var(--card-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}
.app-sidebar.collapsed .user-banner { display: none; }
.app-sidebar.collapsed .user-info-bar {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 0 !important; margin: 0;
}
.app-sidebar.collapsed .user-info-bar .user-name,
.app-sidebar.collapsed .user-info-bar .user-citizen-id {
  display: none;
}
.app-sidebar.collapsed .user-info-bar > div:first-child {
  margin-top: 0 !important; margin-bottom: 0 !important;
}
.app-sidebar .user-info-bar .avatar { transition: width 0.3s ease, height 0.3s ease; }
.app-sidebar.collapsed .user-info-bar .avatar { width: 32px !important; height: 32px !important; border: 2px solid white !important; }
.app-sidebar.collapsed .user-info-bar .status-dot { bottom: 1px; right: -1px; width: 7px; height: 7px; }
.app-sidebar.collapsed .settings-btn-collapsed {
  display: flex !important; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: none; background: transparent;

@media (max-width: 768px) {
  :root {
    --fs-display-lg: 32px;
  }
  .auth-card { height: auto; min-height: 560px; }
  .auth-panel,

    position: static; width: 100%; height: auto; transform: none; border-radius: 0;
  } /* column 下蓝板回流入文档流变顶部横幅（absolute 会叠在表单上）；顶部两角由卡 overflow+圆角裁剪（v2.3.10 内凹已移除） */
  .auth-panel-body { position: relative; }
  .auth-tabs,
  .auth-card.auth-tab-signup .auth-tabs,
  .auth-card.auth-tab-login .auth-tabs {
    position: static; width: 100%; transform: none; padding: var(--space-md) var(--space-lg) 0;
  } /* v2.3.9 反向滑浮层回流入文档流（mobile 无并排半可浮） */
  .auth-footer,
  .auth-card.auth-tab-signup .auth-footer,
  .auth-card.auth-tab-login .auth-footer {
    position: static; width: 100%; transform: none; padding: 0 var(--space-lg) var(--space-sm);
  }
  .auth-panes { flex-direction: column; }
  .auth-pane { width: 100%; }
  .auth-card.auth-tab-signup .auth-pane-login { display: none; } /* 非激活半表单隐藏（与桌面同一状态类驱动，零 JS 分支） */

    gap: 10px;
    padding: 10px 0;
    font-size: 14px;
  }
  .auth-terms input[type='checkbox'] {

    height: 22px;

/* ================================================================
   ANALYTICS / ACTIVITY PAGE
   ================================================================ */

/* ── KPI Cards ── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--space-md);
}
.kpi-card {
  text-align: center;
  padding: var(--space-md);
}
.kpi-icon {
  font-size: 28px;
  margin-bottom: 6px;
}
.kpi-value {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--color-on-surface);
}
.kpi-label {
  font-size: var(--fs-label-sm);
  color: var(--color-outline);
  margin-top: 2px;
}
.kpi-trend {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  margin-top: 6px;
}
.kpi-trend.up {
  color: #16a34a;
  background: rgba(22,163,74,0.08);
}
.kpi-trend.down {
  color: #dc2626;
  background: rgba(220,38,38,0.08);
}

/* ── Chart Cards ── */
.chart-card {
  padding: var(--space-lg);
}
.chart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.chart-title {
  font-weight: 700;
  font-size: var(--fs-body-lg);
  color: var(--color-on-surface);
}

/* ── Horizontal Bar Chart ── */
.hbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.hbar-label {
  width: 100px;
  font-size: 12px;
  flex-shrink: 0;
  text-align: right;
  color: var(--color-on-surface);
  font-weight: 500;
}
.hbar-bar {
  height: 20px;
  border-radius: 4px;
  min-width: 2px;
  transition: width 0.6s ease;
}
.hbar-count {
  font-size: 12px;
  font-weight: 600;
  width: 50px;
  flex-shrink: 0;
  color: var(--color-on-surface);
}
.hbar-pct {
  font-size: 11px;
  color: var(--color-outline);
  width: 36px;
  flex-shrink: 0;
}

/* ── Heatmap ── */
.heatmap-grid {
  display: grid;
  grid-template-columns: 48px repeat(7, 1fr);
  gap: 3px;
  align-items: center;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 3px;
  transition: background 0.3s ease;
}
.heatmap-label {
  font-size: 10px;
  color: var(--color-outline);
  text-align: right;
  padding-right: 6px;
}
.heatmap-header {
  font-size: 10px;
  font-weight: 600;
  text-align: center;
  color: var(--color-outline);
}
.heatmap-total {
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  color: var(--color-on-surface);
}

/* ── Leaderboard ── */
.lb-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--divider-line);
}
.lb-row:last-child { border-bottom: none; }
.lb-rank {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.lb-rank.gold   { background: #fbbf24; color: #7c2d12; }
.lb-rank.silver { background: #9ca3af; color: #1f2937; }
.lb-rank.bronze { background: #d97706; color: #fff; }
.lb-score-bar {
  flex: 1; height: 6px;
  background: rgba(70,72,212,0.08);
  border-radius: 3px; overflow: hidden;
}
.lb-score-fill {
  height: 100%; border-radius: 3px;
  background: var(--color-primary);
  transition: width 0.6s ease;
}
.lb-score-num {
  font-size: 12px; font-weight: 700;
  color: var(--color-on-surface); flex-shrink: 0; width: 36px; text-align: right;
}
.lb-flag { font-size: 16px; flex-shrink: 0; }
.lb-name {
  font-size: 12px; font-weight: 500; width: 110px; flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--color-on-surface);
}

/* ── Milestones ── */
.milestone {
  display: flex; gap: 10px; padding: 6px 0;
  position: relative;
}
.milestone::before {
  content: '';
  position: absolute; left: 3px; top: 18px; bottom: -6px;
  width: 2px; background: rgba(70,72,212,0.12);
}
.milestone:last-child::before { display: none; }
.milestone-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--color-primary); flex-shrink: 0; margin-top: 5px;
  position: relative; z-index: 1;
}
.milestone-content { flex: 1; }
.milestone-title {
  font-size: 12px; font-weight: 600;
  color: var(--color-on-surface);
}
.milestone-date {
  font-size: 10px; color: var(--color-outline);
}

/* ── Chart Legend ── */
.chart-legend {
  display: flex; align-items: center; gap: 8px; font-size: 10px;
  color: var(--color-outline);
}
.chart-legend-bar {
  width: 80px; height: 8px; border-radius: 4px;
  background: linear-gradient(to right, rgba(70,72,212,0.08), rgba(70,72,212,0.75));
}

/* ── Responsive ── */
@media (max-width: 1200px) {
  .kpi-grid { grid-template-columns: repeat(5, 1fr); gap: var(--space-sm); }
  .kpi-value { font-size: 22px; }
}
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 600px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}

  min-height: calc(100vh - 96px);
  padding: var(--space-lg);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(70,72,212,0.06), rgba(129,39,207,0.04)), var(--card-bg);
  border: var(--card-border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);

.guest-hero-inner { text-align: center; max-width: 640px; }
.guest-hero-title {
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 800;
  line-height: 1.15;
  color: var(--color-on-surface);
  margin: 0 0 var(--space-md);
}
.guest-hero-sub { color: var(--color-on-surface-variant); font-size: 15px; line-height: 1.7; margin-bottom: var(--space-lg); }
.guest-hero-cta { display: flex; gap: var(--space-sm); justify-content: center; flex-wrap: wrap; margin-bottom: var(--space-xl); }
.guest-features {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-sm); text-align: left;
}
.guest-feature {
  display: flex; align-items: center; gap: 12px;
  padding: var(--space-md);
  border-radius: var(--radius-md);
  background: var(--card-bg-hover);
  border: var(--card-border);
}
.guest-feature > .material-symbols-outlined { font-size: 24px; color: var(--color-primary); }
.guest-feature strong { display: block; font-size: 13px; color: var(--color-on-surface); }
.guest-feature span { display: block; font-size: 11px; color: var(--color-outline); margin-top: 2px; }
@media (max-width: 600px) {

  text-align: center;
}

          </button>
          <div id="conversationList" style="flex:1;display:flex;flex-direction:column;gap:var(--space-xs);overflow-y:auto;overflow-x:hidden" class="custom-scrollbar">
          </div>
        </div>

        <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0" id="chatArea">
          <div class="flex-between" style="padding-bottom:var(--space-sm);border-bottom:1px solid rgba(118,117,134,0.1);margin-bottom:var(--space-sm);display:none" id="chatHeader">

            </div>
            <div style="display:flex;gap:4px">

            </div>
          </div>

            <div class="card" style="text-align:center;padding:var(--space-xl) 48px;max-width:280px" id="emptyChat">
              <span class="material-symbols-outlined" style="font-size:48px;color:var(--color-outline-variant);margin-bottom:var(--space-sm)">chat</span>
              <p style="color:var(--color-outline);font-size:var(--fs-body-md);line-height:1.5">Select a friend to start chatting</p>

            <button style="width:38px;height:38px;min-width:38px;flex-shrink:0;padding:0;border-radius:50%;border:1px solid rgba(118,117,134,0.15);background:var(--card-bg);color:var(--color-on-surface-variant);cursor:pointer;display:flex;align-items:center;justify-content:center" onclick="openUploadPopup(event)" onmouseenter="this.style.background='rgba(22,163,74,0.05)'" onmouseleave="this.style.background='var(--card-bg)'"><span class="material-symbols-outlined" style="font-size:20px">add_circle</span></button>

<script>
  // ──────────────────────────────────────────────
  //  CONTEXT MENU + FORWARD + PERSISTENCE
  // ──────────────────────────────────────────────
  var ctxTarget = null;
  var pinnedMessages = {};
  var justPinnedRef = null; // tracks message just pinned for animation

  var DATA_VERSION = 3; // bump to invalidate stale localStorage

  // Safe media registry — avoids embedding long base64 data URLs in inline onclick
  var _mediaReg = {};
  var _mediaRegId = 0;
  function _regMedia(data) { var id = 'mr' + (++_mediaRegId); _mediaReg[id] = data; return id; }
  window._openRegMedia = function(id) {
    var m = _mediaReg[id];
    if (!m) return;
    if (m.videoUrl) { openVideoPlayer(m.videoUrl, m.vidType || 'video/mp4'); }
    else if (m.dataUrl) { openLightbox(m.dataUrl); }
  };
  window._openRegLightbox = function(id) {
    var m = _mediaReg[id];
    if (m && m.dataUrl) openLightbox(m.dataUrl);
  };
  function _resetMediaReg() { _mediaReg = {}; _mediaRegId = 0; }

  // Detect video by _kind tag, MIME type, OR file extension (some browsers don't set type)
  function isVideoFile(f) {
    if (!f) return false;
    if (f._kind === 'video') return true;
    if (f._kind === 'image') return false;
    if (f.type && f.type.match(/^video\//)) return true;
    var name = f.name || '';
    return !!name.match(/\.(mp4|mov|webm|avi|mkv|wmv|flv|m4v|ogg|ogv|3gp|3g2)$/i);
  }

  // Load persisted data
  function loadData() {
    try {
      var raw = localStorage.getItem('slati_messages');
      if (!raw) { console.log('[M.NationWorld] No saved messages in localStorage'); return; }
      var d = JSON.parse(raw);
      // If saved data is from an older version, discard it
      if (d._version !== DATA_VERSION) {
        console.log('[M.NationWorld] Data version mismatch (' + d._version + ' vs ' + DATA_VERSION + '), clearing old data');
        localStorage.removeItem('slati_messages');
        return;
      }
      if (d.conversations) conversations = d.conversations;
      if (d.groups) groups = d.groups;
      // Merge saved messages INTO defaults so new seed data isn't lost
      if (d.mockMessages) {
        Object.keys(d.mockMessages).forEach(function(id) {
          mockMessages[id] = d.mockMessages[id];
        });
      }
      if (d.mockGroupMessages) {
        Object.keys(d.mockGroupMessages).forEach(function(id) {
          mockGroupMessages[id] = d.mockGroupMessages[id];
        });
      }
      console.log('[M.NationWorld] Loaded messages from localStorage');
    } catch(e) { console.warn('[M.NationWorld] Failed to load messages:', e); }
    // Blob URLs expire — clear any stale ones from saved data
    function clearVideoUrls(store) {
      Object.keys(store).forEach(function(id) {
        store[id].forEach(function(m) {
          if (m._file && m._file.videoUrl && m._file.videoUrl.indexOf('blob:') === 0) {
            m._file.videoUrl = null;
          }
        });
      });
    }
    clearVideoUrls(mockMessages);
    clearVideoUrls(mockGroupMessages);
    // Rebuild pinnedMessages using REFERENCES from the live arrays
    // (JSON round-trip breaks object identity, so we must reconcile)
    pinnedMessages = {};
    function collectPinned(store) {
      Object.keys(store).forEach(function(id) {
        store[id].forEach(function(m) {
          if (m._pinned) {
            if (!pinnedMessages[id]) pinnedMessages[id] = [];
            pinnedMessages[id].push(m);
          }
        });
      });
    }
    collectPinned(mockMessages);
    collectPinned(mockGroupMessages);
  }
  function saveData() {
    try {
      // 云端会话不入 localStorage（死 key 弃用于云用户）：列表与消息由服务端权威
      var saveConvs = cloudMode ? conversations.filter(function(c) { return !cloudConvs[c.id]; }) : conversations;
      var saveMsgs = {};
      Object.keys(mockMessages).forEach(function(id) {
        if (!cloudMode || !cloudConvs[id]) saveMsgs[id] = mockMessages[id];
      });
      var data = JSON.stringify({
        _version: DATA_VERSION,
        conversations: saveConvs,
        mockMessages: saveMsgs,
        groups: groups,
        mockGroupMessages: mockGroupMessages,
        pinnedMessages: pinnedMessages
      });
      localStorage.setItem('slati_messages', data);
      console.log('[M.NationWorld] Saved ' + (data.length / 1024).toFixed(1) + ' KB to localStorage');
    } catch(e) {
      console.warn('[M.NationWorld] Failed to save messages — localStorage may be full:', e);
      showToast('⚠ Could not save — storage full. Try clearing old data.', true);
    }
  }

  function msgBubble(m, idx, isPinned, panel, chatId, isJustPinned) {
    var isSent = !m.sent;
    var animClass = isJustPinned ? ' fade-up' : '';
    var pinBadge = isPinned ? '<span class="material-symbols-outlined" style="font-size:12px;vertical-align:middle;margin-right:2px;color:#eab308">push_pin</span>' : '';
    var fwdLabel = m._forwardedFrom
      ? '<div class="label-sm" style="margin-bottom:4px;opacity:0.55;font-style:italic;font-size:10px">↪ Forwarded from <b>' + m._forwardedFrom + '</b></div>'

    if (m._file && isVideoFile(m._file)) {
      var vStyle = 'max-width:260px;max-height:320px;border-radius:var(--radius-lg);display:block;cursor:pointer;object-fit:cover';
      var vReadMark = isSent && m._readByOther ? '<div style="text-align:right;font-size:10px;color:var(--color-outline);margin-top:2px;padding-right:4px">Read</div>' : '';
      if (m._file.dataUrl) {

        var hasVideo = !!m._file.videoUrl;
        var vMediaId = _regMedia({ dataUrl: m._file.dataUrl, videoUrl: m._file.videoUrl || null, vidType: m._file.type || 'video/mp4' });
        var vidClick = '_openRegMedia(\'' + vMediaId + '\')';

        var playOverlay = hasVideo

              '<div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.25);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.35)">' +
                '<span class="material-symbols-outlined" style="font-size:26px;color:white;margin-left:3px">play_arrow</span>' +
              '</div></div>'
          : '<div style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.55);color:white;font-size:9px;font-weight:600;padding:3px 7px;border-radius:6px;pointer-events:none;display:flex;align-items:center;gap:3px">' +
              '<span class="material-symbols-outlined" style="font-size:12px">smart_display</span>Video</div>';
        return '<div class="msg-row' + animClass + '" style="display:flex;flex-direction:column;align-items:' + (isSent ? 'flex-end' : 'flex-start') + ';margin-bottom:12px" oncontextmenu="showContextMenu(event,\'' + panel + '\',\'' + chatId + '\',' + idx + ',' + (isPinned ? 'true' : 'false') + ')">' +
          '<div style="position:relative;display:inline-block;cursor:pointer" onclick="' + vidClick + '">' +
            '<img src="' + m._file.dataUrl + '" style="' + vStyle + '" alt="' + m._file.name + '">' +
            playOverlay +
          '</div>' + vReadMark +
        '</div>';
      } else {
        // Video without thumbnail — gradient placeholder
        var vNoThumbClick = '';
        if (m._file.videoUrl) {
          var vNoThumbId = _regMedia({ dataUrl: null, videoUrl: m._file.videoUrl, vidType: m._file.type || 'video/mp4' });
          vNoThumbClick = ' onclick="_openRegMedia(\'' + vNoThumbId + '\')"';

        return '<div class="msg-row' + animClass + '" style="display:flex;flex-direction:column;align-items:' + (isSent ? 'flex-end' : 'flex-start') + ';margin-bottom:12px" oncontextmenu="showContextMenu(event,\'' + panel + '\',\'' + chatId + '\',' + idx + ',' + (isPinned ? 'true' : 'false') + ')">' +
          '<div style="position:relative;width:200px;height:140px;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;background:linear-gradient(135deg,#0f172a,#1e3a5f);display:flex;align-items:center;justify-content:center"' + vNoThumbClick + '>' +
            '<div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.3)">' +
              '<span class="material-symbols-outlined" style="font-size:26px;color:white;margin-left:3px">play_arrow</span>' +
            '</div>' +
            '<div style="position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,0.6));color:white;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + m._file.name + '</div>' +
          '</div>' + vReadMark +
        '</div>';
      }
    }

    // Image messages: no bubble wrapping, just the image with rounded corners
    if (m._file && m._file.dataUrl) {
      var imgStyle = 'max-width:260px;max-height:320px;border-radius:var(--radius-lg);display:block;cursor:pointer;object-fit:cover';
      var readMark = isSent && m._readByOther ? '<div style="text-align:right;font-size:10px;color:var(--color-outline);margin-top:2px;padding-right:4px">Read</div>' : '';
      var imgMediaId = _regMedia({ dataUrl: m._file.dataUrl, videoUrl: null });
      return '<div class="msg-row' + animClass + '" style="display:flex;flex-direction:column;align-items:' + (isSent ? 'flex-end' : 'flex-start') + ';margin-bottom:12px" oncontextmenu="showContextMenu(event,\'' + panel + '\',\'' + chatId + '\',' + idx + ',' + (isPinned ? 'true' : 'false') + ')">' +
        '<img src="' + m._file.dataUrl + '" style="' + imgStyle + '" alt="' + m._file.name + '" onclick="_openRegLightbox(\'' + imgMediaId + '\')">' +
        readMark +
      '</div>';
    }

    // Build content: file preview + optional text
    var body = '';
    if (m._file) {
      if (!m._file.dataUrl && !(m._file.type && m._file.type.match(/^video\//))) {
        // File card (non-image, non-video)
        body += '<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--divider-line);border-radius:var(--radius-DEFAULT);margin-bottom:6px">' +
          '<span class="material-symbols-outlined" style="font-size:24px;' + (isSent ? 'color:rgba(255,255,255,0.8)' : 'color:var(--color-primary)') + '">draft</span>' +
          '<div style="min-width:0"><div style="font-weight:500;font-size:var(--fs-label-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + m._file.name + '</div>' +
          '<div style="font-size:10px;opacity:0.55">' + (m._file.mode === 'compress' ? 'Compressed' : 'Original') + '</div></div>' +
        '</div>';
      }
    }
    body += m.text;
    var readMark = isSent && m._readByOther ? '<div style="text-align:right;font-size:10px;color:var(--color-outline);margin-top:2px;padding-right:4px">Read</div>' : '';

    return '<div class="msg-row' + animClass + '" style="display:flex;flex-direction:column;align-items:' + (isSent ? 'flex-end' : 'flex-start') + ';margin-bottom:12px" oncontextmenu="showContextMenu(event,\'' + panel + '\',\'' + chatId + '\',' + idx + ',' + (isPinned ? 'true' : 'false') + ')">' +
      '<div style="max-width:70%;padding:10px 16px;border-radius:' + (isSent ? 'var(--radius-xl) var(--radius-xl) 4px var(--radius-xl)' : 'var(--radius-xl) var(--radius-xl) var(--radius-xl) 4px') + ';' +
        (isSent ? 'background:var(--color-primary);color:white;' : 'background:var(--card-bg);border:1px solid var(--divider-line);color:var(--color-on-surface);') +
        'font-size:var(--fs-label-md);cursor:default;overflow:hidden">' +
        '<div class="label-sm" style="margin-bottom:2px;opacity:0.7">' + pinBadge + m.from + '</div>' +
        fwdLabel + body +
      '</div>' +
      readMark +
    '</div>';
  }

  // Mark all non-"You" messages as read, and compute _readByOther for "You" messages
  function markMessagesRead(store, chatId) {
    var msgs = store[chatId];
    if (!msgs) return;
    // Mark all messages not from "You" as _read: true
    msgs.forEach(function(m) { if (m.from !== 'You') m._read = true; });
    // For each "You" message, check if a read message from other exists after it
    var hasReadAfter = false;
    for (var i = msgs.length - 1; i >= 0; i--) {
      if (msgs[i].from !== 'You') {
        if (msgs[i]._read) hasReadAfter = true;
      } else {
        msgs[i]._readByOther = hasReadAfter;
      }
    }
  }

  // Slime-pop animation on the last message bubble
  function animateLastBubble(containerId) {
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        var container = document.getElementById(containerId);
        if (!container) return;
        var last = container.querySelector('.msg-row:last-child');
        if (last) {
          last.classList.add('fade-up');
          last.addEventListener('animationend', function() {
            last.classList.remove('fade-up');
          }, { once: true });
        }
      });
    });
  }

  function showContextMenu(e, panel, chatId, idx, isPinned) {
    e.preventDefault();
    ctxTarget = { panel: panel, chatId: chatId, msgIndex: idx, isPinned: isPinned };
    var menu = document.getElementById('msgContextMenu');
    menu.style.display = 'block';
    menu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    menu.style.top = Math.min(e.clientY, window.innerHeight - 140) + 'px';
    document.getElementById('ctxPinLabel').textContent = isPinned ? 'Unpin' : 'Pin';
  }

  function hideContextMenu() {
    document.getElementById('msgContextMenu').style.display = 'none';
    ctxTarget = null;
  }

  document.addEventListener('click', function(e) {
    var menu = document.getElementById('msgContextMenu');
    if (menu.style.display === 'block' && !menu.contains(e.target)) {
      hideContextMenu();
    }
  });

  // ──────────────────────────────────────────────
  //  TOAST
  // ──────────────────────────────────────────────
  function showToast(msg, isError) {
    var existing = document.getElementById('msgToast');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.id = 'msgToast';
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:var(--radius-full);font-size:var(--fs-label-md);font-weight:600;z-index:200;pointer-events:none;transition:opacity 0.3s ease;' +
      (isError ? 'background:#fef2f2;color:#dc2626;border:1px solid #fecaca;' : 'background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;');
    document.body.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; }, 2000);
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 2500);
  }

  function rerenderTarget(panel, chatId) {
    if (panel === 'group') {
      openGroupChat(chatId);
    } else {
      openChat(chatId);
    }
  }

  function ctxPin() {
    if (!ctxTarget) return;
    var target = ctxTarget; // save before hideContextMenu clears it
    var id = target.chatId;
    var idx = target.msgIndex;
    if (!pinnedMessages[id]) pinnedMessages[id] = [];
    var msgs = target.panel === 'group' ? (mockGroupMessages[id] || []) : (mockMessages[id] || []);

    if (target.isPinned) {
      var pm = pinnedMessages[id][idx];
      if (pm) {
        pm._pinned = false;
        pinnedMessages[id].splice(idx, 1);
        saveData();
        showToast('✓ Message unpinned');
      } else {
        showToast('✗ Failed to unpin', true);
      }
    } else {
      var msg = msgs[idx];
      if (msg) {
        msg._pinned = true;
        pinnedMessages[id].push(msg);
        justPinnedRef = msg;
        saveData();
        showToast('✓ Message pinned');
      } else {
        showToast('✗ Failed to pin', true);
      }
    }
    hideContextMenu();
    rerenderTarget(target.panel, id);
  }

  // ──────────────────────────────────────────────
  //  FORWARD (with search, selection, message input)
  // ──────────────────────────────────────────────
  var forwardSelected = []; // [{ panel, id }] — multi-select
  var forwardSource = null;  // { panel, chatId, msgIndex, isPinned } — survives hideContextMenu

  function findForwardIndex(panel, id) {
    for (var i = 0; i < forwardSelected.length; i++) {
      if (forwardSelected[i].panel === panel && forwardSelected[i].id === id) return i;
    }
    return -1;
  }

  function renderForwardContacts(filter) {
    var q = (filter || '').toLowerCase();
    var html = '';
    conversations.forEach(function(c) {
      if (q && c.name.toLowerCase().indexOf(q) === -1) return;
      var sel = findForwardIndex('private', c.id) !== -1;
      html += '<div style="display:flex;align-items:center;gap:var(--space-sm);padding:10px 12px;border-radius:var(--radius-DEFAULT);cursor:pointer;transition:background 0.12s' + (sel ? ';background:rgba(70,72,212,0.08)' : '') + '" onclick="selectForwardTarget(\'private\',\'' + c.id + '\')">' +
        '<div style="width:36px;height:36px;border-radius:50%;background:var(--color-primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0">' + c.avatar + '</div>' +
        '<span style="font-weight:500;font-size:var(--fs-label-md);flex:1">' + c.name + '</span>' +
        '<span class="label-sm" style="color:var(--color-outline)">Private</span>' +
        (sel ? '<span class="material-symbols-outlined" style="font-size:20px;color:var(--color-primary)">check_circle</span>' : '<span class="material-symbols-outlined" style="font-size:20px;color:var(--color-outline-variant)">radio_button_unchecked</span>') +
      '</div>';
    });
    groups.forEach(function(g) {
      if (q && g.name.toLowerCase().indexOf(q) === -1) return;
      var sel = findForwardIndex('group', g.id) !== -1;
      html += '<div style="display:flex;align-items:center;gap:var(--space-sm);padding:10px 12px;border-radius:var(--radius-DEFAULT);cursor:pointer;transition:background 0.12s' + (sel ? ';background:rgba(22,163,74,0.08)' : '') + '" onclick="selectForwardTarget(\'group\',\'' + g.id + '\')">' +
        '<div style="width:36px;height:36px;border-radius:var(--radius-DEFAULT);background:var(--color-secondary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0">' + g.avatar + '</div>' +
        '<span style="font-weight:500;font-size:var(--fs-label-md);flex:1">' + g.name + '</span>' +
        '<span class="label-sm" style="color:var(--color-outline)">Group</span>' +
        (sel ? '<span class="material-symbols-outlined" style="font-size:20px;color:var(--color-secondary)">check_circle</span>' : '<span class="material-symbols-outlined" style="font-size:20px;color:var(--color-outline-variant)">radio_button_unchecked</span>') +
      '</div>';
    });
    document.getElementById('forwardContactList').innerHTML = html || '<p style="text-align:center;color:var(--color-outline);padding:var(--space-md)">No contacts match</p>';
  }

  function selectForwardTarget(panel, id) {
    var idx = findForwardIndex(panel, id);
    if (idx !== -1) {
      forwardSelected.splice(idx, 1); // toggle off
    } else {
      forwardSelected.push({ panel: panel, id: id }); // toggle on
    }
    renderForwardContacts(document.getElementById('forwardSearchInput').value);
  }

  function ctxForward() {
    if (!ctxTarget) return;
    forwardSelected = [];
    // Save source info before clearing ctxTarget
    forwardSource = {
      panel: ctxTarget.panel,
      chatId: ctxTarget.chatId,
      msgIndex: ctxTarget.msgIndex,
      isPinned: ctxTarget.isPinned
    };
    hideContextMenu();
    renderForwardContacts('');
    document.getElementById('forwardModal').style.display = 'flex';
    document.getElementById('forwardSearchInput').value = '';
    document.getElementById('forwardMsgInput').value = '';
  }

  function doForward() {
    if (!forwardSource || forwardSelected.length === 0) return;
    var id = forwardSource.chatId;
    var idx = forwardSource.msgIndex;
    var msgs = forwardSource.panel === 'group' ? (mockGroupMessages[id] || []) : (mockMessages[id] || []);
    var msg = forwardSource.isPinned ? (pinnedMessages[id] || [])[idx] : msgs[idx];
    if (!msg) { showToast('✗ Failed to forward', true); closeForwardModal(); return; }

    var senderName = forwardSource.panel === 'group'
      ? (groups.find(function(g) { return g.id === id; }) || {}).name || 'Unknown'
      : (conversations.find(function(c) { return c.id === id; }) || {}).name || 'Unknown';

    var extraText = document.getElementById('forwardMsgInput').value.trim();

    // Send to ALL selected targets
    var count = 0;
    forwardSelected.forEach(function(target) {
      var targetPanel = target.panel;
      var targetId = target.id;

      // Bubble 1: the forwarded message
      var fwdMsg = { from: 'You', text: msg.text, sent: false, _forwardedFrom: senderName };
      if (targetPanel === 'group') {
        if (!mockGroupMessages[targetId]) mockGroupMessages[targetId] = [];
        mockGroupMessages[targetId].push(fwdMsg);
        var grp = groups.find(function(g) { return g.id === targetId; });
        if (grp) { grp.lastMsg = '[Forwarded] ' + msg.text; grp.time = 'Now'; }
      } else {
        if (!mockMessages[targetId]) mockMessages[targetId] = [];
        mockMessages[targetId].push(fwdMsg);
        var conv = conversations.find(function(c) { return c.id === targetId; });
        if (conv) { conv.lastMsg = '[Forwarded] ' + msg.text; conv.time = 'Now'; }
      }

      // Bubble 2: the supplementary message (if any)
      if (extraText) {
        var extraMsg = { from: 'You', text: extraText, sent: false };
        if (targetPanel === 'group') {
          mockGroupMessages[targetId].push(extraMsg);
        } else {
          mockMessages[targetId].push(extraMsg);
        }
      }
      count++;
    });

    // Snapshot before closeForwardModal clears the array
    var lastTarget = forwardSelected[forwardSelected.length - 1];

    saveData();
    showToast('✓ Forwarded to ' + count + ' chat' + (count > 1 ? 's' : ''));
    closeForwardModal();

    // Navigate to the last selected target
    if (lastTarget.panel === 'group') {
      renderGroupList();
      activeGroup = lastTarget.id;
      switchToPanel(1);
      setTimeout(function() { openGroupChat(lastTarget.id); }, 100);
    } else {
      renderConversationList();
      activeChat = lastTarget.id;
      switchToPanel(0);
      setTimeout(function() { openChat(lastTarget.id); }, 100);
    }
  }

  function closeForwardModal() {
    document.getElementById('forwardModal').style.display = 'none';
    forwardSelected = [];
    forwardSource = null;
  }
  document.getElementById('forwardModal').addEventListener('click', function(e) {
    if (e.target === this) closeForwardModal();
  });

  function ctxDelete() {
    if (!ctxTarget) return;
    var target = ctxTarget;
    var id = target.chatId;
    var idx = target.msgIndex;
    var deleted = false;
    if (target.isPinned) {
      var pm = (pinnedMessages[id] || [])[idx];
      if (pm) { pm._pinned = false; }
      if (pinnedMessages[id]) { pinnedMessages[id].splice(idx, 1); deleted = true; }
    } else {
      var msgs = target.panel === 'group' ? (mockGroupMessages[id] || []) : (mockMessages[id] || []);
      if (msgs[idx] !== undefined) { msgs.splice(idx, 1); deleted = true; }
    }
    hideContextMenu();
    if (deleted) {
      saveData();
      showToast('✓ Message deleted');
    } else {
      showToast('✗ Failed to delete', true);
    }
    rerenderTarget(target.panel, id);
  }

  // ──────────────────────────────────────────────
  //  CHAT INFO MODAL
  // ──────────────────────────────────────────────

  var infoPanel = 'private'; // 'private' | 'group'
  var infoTab = 'pinned';

  // Mock media: images (gradient thumbnails), videos (gradient+play), links, files
  var chatMedia = {
    c1: {
      images: [
        { label: 'District_Plan_v3.png', grad: 'linear-gradient(135deg,#a5b4fc 0%,#6366f1 50%,#4f46e5 100%)' },
        { label: 'Aquatic_Foundation.jpg', grad: 'linear-gradient(135deg,#67e8f9 0%,#0ea5e9 50%,#0284c7 100%)' },
        { label: 'Territory_Overlay.png', grad: 'linear-gradient(135deg,#6ee7b7 0%,#10b981 50%,#059669 100%)' },

  function openChatInfo() {
    // Determine which chat/group is active based on current panel
    var id, panel;
    if (msgPanel === 1 && activeGroup) { id = activeGroup; panel = 'group'; }
    else if (msgPanel === 0 && activeChat) { id = activeChat; panel = 'private'; }
    else if (activeGroup) { id = activeGroup; panel = 'group'; }
    else if (activeChat) { id = activeChat; panel = 'private'; }
    else return;

    infoChatId = id;
    infoPanel = panel;

    var name, avatar, bio;
    if (panel === 'group') {
      var grp = groups.find(function(g) { return g.id === id; });
      if (!grp) return;
      name = grp.name;
      avatar = grp.avatar;
      bio = chatBios[id] || 'Group chat — ' + grp.members + ' members';
    } else {
      var conv = conversations.find(function(c) { return c.id === id; });
      if (!conv) return;
      name = conv.name;
      avatar = conv.avatar;
      bio = chatBios[id] || 'M.NationWorld member';
    }

    document.getElementById('infoAvatar').textContent = avatar;
    document.getElementById('infoName').textContent = name;
    document.getElementById('infoBio').textContent = bio;

    infoTab = 'pinned';
    switchInfoTab('pinned');
    document.getElementById('chatInfoModal').style.display = 'flex';
  }

  function closeChatInfo() {
    document.getElementById('chatInfoModal').style.display = 'none';
    infoChatId = null;
  }

  function openMembersModal() {
    if (!activeGroup) return;

    if (!grp) return;
    document.getElementById('membersTitle').textContent = grp.name + ' — Members';
