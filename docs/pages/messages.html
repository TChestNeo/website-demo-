  // ──────────────────────────────────────────────
  function showToast(msg, isError) {
    var existing = document.getElementById('msgToast');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.id = 'msgToast';
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:var(--radius-full);font-size:var(--fs-label-md);font-weight:600;z-index:200;pointer-events:none;transition:opacity 0.3s ease;' +
      (isError ? 'background:#fef2f2;color:#dc2626;border:1px solid #fecaca;' : 'background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;');
    document.body.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; }, 2000);
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 2500);
  }

  function rerenderTarget(panel, chatId) {
    if (panel === 'group') {
      openGroupChat(chatId);
    } else {
      openChat(chatId);
    }
  }

  function ctxPin() {
    if (!ctxTarget) return;
    var target = ctxTarget; // save before hideContextMenu clears it
    var id = target.chatId;
    var idx = target.msgIndex;
    if (!pinnedMessages[id]) pinnedMessages[id] = [];
    var msgs = target.panel === 'group' ? (mockGroupMessages[id] || []) : (mockMessages[id] || []);

    if (target.isPinned) {
      var pm = pinnedMessages[id][idx];
      if (pm) {
        pm._pinned = false;
        pinnedMessages[id].splice(idx, 1);
        saveData();
        showToast((T('messages.toast.unpinned') || '✓ Message unpinned'));
      } else {
        showToast((T('messages.toast.unpinFail') || '✗ Failed to unpin'), true);
      }
    } else {
      var msg = msgs[idx];
      if (msg) {
        msg._pinned = true;
        pinnedMessages[id].push(msg);
        justPinnedRef = msg;
        saveData();
        showToast((T('messages.toast.pinned') || '✓ Message pinned'));
      } else {
        showToast((T('messages.toast.pinFail') || '✗ Failed to pin'), true);
      }
    }
    hideContextMenu();
    rerenderTarget(target.panel, id);
  }

  // ──────────────────────────────────────────────

  var forwardSelected = []; // [{ panel, id }] — multi-select
  var forwardSource = null;  // { panel, chatId, msgIndex, isPinned } — survives hideContextMenu

  function findForwardIndex(panel, id) {
    for (var i = 0; i < forwardSelected.length; i++) {
      if (forwardSelected[i].panel === panel && forwardSelected[i].id === id) return i;
    }
    return -1;
  }

  function renderForwardContacts(filter) {
    var q = (filter || '').toLowerCase();
    var html = '';
    conversations.forEach(function(c) {
      if (q && c.name.toLowerCase().indexOf(q) === -1) return;
      var sel = findForwardIndex('private', c.id) !== -1;
      html += '<div style="display:flex;align-items:center;gap:var(--space-sm);padding:10px 12px;border-radius:var(--radius-DEFAULT);cursor:pointer;transition:background 0.12s' + (sel ? ';background:rgba(70,72,212,0.08)' : '') + '" onclick="selectForwardTarget(\'private\',\'' + c.id + '\')">' +
        '<div class="msg-acc msg-avatar" style="width:36px;height:36px;border-radius:50%;background:#4648d4;color:white;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0">' + c.avatar + '</div>' +
        '<span style="font-weight:500;font-size:var(--fs-label-md);flex:1">' + c.name + '</span>' +
        '<span class="label-sm" style="color:var(--color-outline)">' + (T('messages.forward.tagPrivate') || 'Private') + '</span>' +
        (sel ? '<span class="material-symbols-outlined" style="font-size:20px;color:var(--color-primary)">check_circle</span>' : '<span class="material-symbols-outlined" style="font-size:20px;color:var(--color-outline-variant)">radio_button_unchecked</span>') +
      '</div>';
    });
    groups.forEach(function(g) {
      if (q && g.name.toLowerCase().indexOf(q) === -1) return;
      var sel = findForwardIndex('group', g.id) !== -1;
      html += '<div style="display:flex;align-items:center;gap:var(--space-sm);padding:10px 12px;border-radius:var(--radius-DEFAULT);cursor:pointer;transition:background 0.12s' + (sel ? ';background:rgba(22,163,74,0.08)' : '') + '" onclick="selectForwardTarget(\'group\',\'' + g.id + '\')">' +
        '<div class="msg-acc msg-avatar" style="width:36px;height:36px;border-radius:var(--radius-DEFAULT);background:#8127cf;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0">' + g.avatar + '</div>' +

      '</div>';

  function selectForwardTarget(panel, id) {
    var idx = findForwardIndex(panel, id);
    if (idx !== -1) {
      forwardSelected.splice(idx, 1); // toggle off

      forwardSelected.push({ panel: panel, id: id }); // toggle on
    }
    renderForwardContacts(document.getElementById('forwardSearchInput').value);
  }

  function ctxForward() {
    if (!ctxTarget) return;
    forwardSelected = [];
    // Save source info before clearing ctxTarget
    forwardSource = {
      panel: ctxTarget.panel,
      chatId: ctxTarget.chatId,
      msgIndex: ctxTarget.msgIndex,
      isPinned: ctxTarget.isPinned
    };
    hideContextMenu();
    renderForwardContacts('');
    document.getElementById('forwardModal').style.display = 'flex';
    document.getElementById('forwardSearchInput').value = '';
    document.getElementById('forwardMsgInput').value = '';
  }

  function doForward() {
    if (!forwardSource || forwardSelected.length === 0) return;
    var id = forwardSource.chatId;
    var idx = forwardSource.msgIndex;
    var msgs = forwardSource.panel === 'group' ? (mockGroupMessages[id] || []) : (mockMessages[id] || []);
    var msg = forwardSource.isPinned ? (pinnedMessages[id] || [])[idx] : msgs[idx];
    if (!msg) { showToast((T('messages.toast.fwdFail') || '✗ Failed to forward'), true); closeForwardModal(); return; }

    var senderName = forwardSource.panel === 'group'
      ? (groups.find(function(g) { return g.id === id; }) || {}).name || (T('messages.msg.unknown') || 'Unknown')
      : (conversations.find(function(c) { return c.id === id; }) || {}).name || (T('messages.msg.unknown') || 'Unknown');

    var extraText = document.getElementById('forwardMsgInput').value.trim();

    // Send to ALL selected targets
    var count = 0;
    forwardSelected.forEach(function(target) {
      var targetPanel = target.panel;
      var targetId = target.id;

      // Bubble 1: the forwarded message
      var fwdMsg = { from: 'You', text: msg.text, sent: false, _forwardedFrom: senderName };
      if (targetPanel === 'group') {
        if (!mockGroupMessages[targetId]) mockGroupMessages[targetId] = [];
        mockGroupMessages[targetId].push(fwdMsg);
        var grp = groups.find(function(g) { return g.id === targetId; });
        if (grp) { grp.lastMsg = (T('messages.msg.fwdLabel') || '[Forwarded] ') + msg.text; grp.time = 'Now'; }
      } else {
        if (!mockMessages[targetId]) mockMessages[targetId] = [];
        mockMessages[targetId].push(fwdMsg);
        var conv = conversations.find(function(c) { return c.id === targetId; });
        if (conv) { conv.lastMsg = (T('messages.msg.fwdLabel') || '[Forwarded] ') + msg.text; conv.time = 'Now'; }
      }

      // Bubble 2: the supplementary message (if any)
      if (extraText) {
        var extraMsg = { from: 'You', text: extraText, sent: false };
        if (targetPanel === 'group') {
          mockGroupMessages[targetId].push(extraMsg);
        } else {
          mockMessages[targetId].push(extraMsg);
        }
      }
      count++;
    });

    // Snapshot before closeForwardModal clears the array
    var lastTarget = forwardSelected[forwardSelected.length - 1];

    saveData();
    showToast((T('messages.toast.fwd') || '✓ Forwarded to ') + count + ' ' + (count > 1 ? (T('messages.toast.chats') || 'chats') : (T('messages.toast.chat') || 'chat')));
    closeForwardModal();

    // Navigate to the last selected target
    if (lastTarget.panel === 'group') {
      renderGroupList();
      activeGroup = lastTarget.id;
      switchToPanel(1);
      setTimeout(function() { openGroupChat(lastTarget.id); }, 100);
    } else {
      renderConversationList();
      activeChat = lastTarget.id;
      switchToPanel(0);
      setTimeout(function() { openChat(lastTarget.id); }, 100);
    }
  }

  function closeForwardModal() {
    document.getElementById('forwardModal').style.display = 'none';

    forwardSource = null;

  document.getElementById('forwardModal').addEventListener('click', function(e) {

  // ──────────────────────────────────────────────
  //  IMAGE LIGHTBOX
  // ──────────────────────────────────────────────
  var lightboxZoom = 1;
  var lbPanX = 0, lbPanY = 0;
  var lbDragging = false, lbDragStartX = 0, lbDragStartY = 0;
  var lbPanStartX = 0, lbPanStartY = 0;
  var lbRafPending = false;

  var lbImg = document.getElementById('lightboxImg');

  function lbApplyTransform() {
    if (lbRafPending) return;
    lbRafPending = true;
    requestAnimationFrame(function() {
      lbRafPending = false;
      // GPU-accelerated: translate3d + scale
      lbImg.style.transform = 'translate3d(' + lbPanX + 'px,' + lbPanY + 'px,0) scale(' + lightboxZoom + ')';
      lbImg.style.cursor = lightboxZoom > 1 ? (lbDragging ? 'grabbing' : 'grab') : 'default';
    });
  }

  function openLightbox(src) {
    lightboxZoom = 1;
    lbPanX = 0; lbPanY = 0;
    lbImg.src = src;
    lbImg.style.transform = 'translate3d(0,0,0) scale(1)';
    lbImg.style.cursor = 'default';
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = '';
  }

  // ──────────────────────────────────────────────
  //  VIDEO PLAYER
  // ──────────────────────────────────────────────
  function openVideoPlayer(src, type) {
    var modal = document.getElementById('videoPlayerModal');
    var player = document.getElementById('videoPlayer');
    player.src = src;
    player.type = type || 'video/mp4';
    modal.style.display = 'flex';
    player.play().catch(function() {});
  }

  function closeVideoPlayer() {
    var modal = document.getElementById('videoPlayerModal');
    var player = document.getElementById('videoPlayer');
    player.pause();
    player.src = '';
    modal.style.display = 'none';
  }

  function zoomLightbox(delta) {
    if (delta === 0) {
      lightboxZoom = 1;
      lbPanX = 0; lbPanY = 0;
    } else {
      lightboxZoom = Math.max(0.5, Math.min(5, lightboxZoom + delta));
    }
    lbApplyTransform();
  }

  // Mouse wheel zoom
  document.getElementById('lightbox').addEventListener('wheel', function(e) {
    if (this.style.display !== 'flex') return;
    e.preventDefault();
    zoomLightbox(e.deltaY < 0 ? 0.2 : -0.2);
  });

  // Pan: mousedown
  lbImg.addEventListener('mousedown', function(e) {
    if (lightboxZoom <= 1) return;
    e.preventDefault();
    lbDragging = true;
    lbDragStartX = e.clientX;
    lbDragStartY = e.clientY;
    lbPanStartX = lbPanX;
    lbPanStartY = lbPanY;
    lbApplyTransform();
  });

  // Pan: mousemove — throttled by rAF in lbApplyTransform
  document.addEventListener('mousemove', function(e) {
    if (!lbDragging) return;
    lbPanX = lbPanStartX + (e.clientX - lbDragStartX);
    lbPanY = lbPanStartY + (e.clientY - lbDragStartY);
    lbApplyTransform();
  });

  // Pan: mouseup
  document.addEventListener('mouseup', function() {
    if (!lbDragging) return;
    lbDragging = false;
    lbApplyTransform();
  });

  // Touch: touchstart
  lbImg.addEventListener('touchstart', function(e) {
    if (lightboxZoom <= 1) return;
    if (e.touches.length === 1) {
      lbDragging = true;
      lbDragStartX = e.touches[0].clientX;
      lbDragStartY = e.touches[0].clientY;
      lbPanStartX = lbPanX;
      lbPanStartY = lbPanY;
    }
  }, { passive: false });

  // Touch: touchmove — throttled by rAF
  document.addEventListener('touchmove', function(e) {
    if (!lbDragging) return;
    if (e.touches.length === 1) {
      lbPanX = lbPanStartX + (e.touches[0].clientX - lbDragStartX);
      lbPanY = lbPanStartY + (e.touches[0].clientY - lbDragStartY);
      lbApplyTransform();
    }
  }, { passive: false });

  // Touch: touchend
  document.addEventListener('touchend', function() {
    if (!lbDragging) return;
    lbDragging = false;
    lbApplyTransform();
  });

  function renderOpenChat(id) {
    if (pendingFile && pendingFile.source === 'private') cancelFilePreview();
    activeChat = id;
    var conv = conversations.find(function(c) { return c.id === id; });
    if (!conv) return;
    document.getElementById('chatName').textContent = conv.name;
    document.getElementById('chatStatus').textContent = conv.online ? (T('messages.chat.online') || 'Online') : (T('messages.chat.offline') || 'Offline');
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('chatInputBar').style.display = 'flex';
    // emptyChat is a child of messageList — it gets destroyed by innerHTML
    // so we must guard against null after the first openChat call
    var ec = document.getElementById('emptyChat');
    if (ec) ec.style.display = 'none';
    var ml = document.getElementById('messageList');
    ml.style.display = '';
    ml.style.alignItems = '';
    ml.style.justifyContent = '';

    markMessagesRead(mockMessages, id);

    var msgs = mockMessages[id] || [];
    justPinnedRef = null;
    _resetMediaReg();
    var html = '';
    msgs.forEach(function(m, mi) {
      html += msgBubble(m, mi, !!m._pinned, 'private', id);
    });

  function sendMessage() {
    var input = document.getElementById('chatInput');
    if (!input) return;
    var text = input.value.trim();
    var hasFile = pendingFile && pendingFile.source === 'private';
    if (!text && !hasFile) return;
    if (!activeChat) return;

    // 云端会话：v1 不支持文件，纯文本走 /api/conversations
    if (cloudConvs[activeChat]) {

  function handleFileSelect(event) {
    var file = event.target.files[0];
    if (!file) return;
    var popup = document.getElementById('uploadPopup');
    var source = popup.dataset.source || 'private';

    pendingFile = {
      name: file.name,
      type: file.type,
      size: file.size,
      mode: pendingUploadMode,
      source: source,
      dataUrl: null,
      videoUrl: null
    };

    if (file.type.match(/^image\//)) {
      var reader = new FileReader();
      reader.onload = function(e) {
        pendingFile.dataUrl = e.target.result;
        renderFilePreview();
      };
      reader.readAsDataURL(file);
    } else if (isVideoFile(file)) {
      // Generate thumbnail from video frame
      var blobUrl = URL.createObjectURL(file);
      pendingFile.videoUrl = blobUrl;
      var video = document.createElement('video');
      video.preload = 'auto';
      video.muted = true;
      video.playsInline = true;
      video.crossOrigin = 'anonymous';
      var captured = false;
      function captureFrame() {
        if (captured) return;
        captured = true;
        try {
          var c = document.createElement('canvas');
          c.width = video.videoWidth || 320;
          c.height = video.videoHeight || 180;
          var ctx = c.getContext('2d');
          ctx.drawImage(video, 0, 0, c.width, c.height);
          pendingFile.dataUrl = c.toDataURL('image/jpeg', 0.75);
        } catch(e) {}
        renderFilePreview();
      }
      video.addEventListener('loadeddata', function() {
        video.currentTime = 0.1;
      });
      video.addEventListener('seeked', captureFrame);
      video.addEventListener('canplay', function() {
        // If seeked doesn't fire, capture from canplay after short delay
        setTimeout(function() {
          if (!captured) captureFrame();
        }, 500);
      });
      video.src = blobUrl;
      video.load();
      // Ultimate fallback
      setTimeout(function() {
        if (!captured) { captured = true; renderFilePreview(); }
      }, 3000);
    } else {
      renderFilePreview();
    }

    event.target.value = '';
  }

  function sendGroupMessage() {
    var input = document.getElementById('groupChatInput');
    if (!input) return;
    var text = input.value.trim();
    var hasFile = pendingFile && pendingFile.source === 'group';
    if (!text && !hasFile) return;
    if (!activeGroup) return;

    // v10.28.51.0 云端群聊：纯文本走 /api/conversations（附件 v1 不支持——DM 同款口径）
    if (cloudMode && cloudGroups[activeGroup]) {
      if (hasFile) { showToast((T('messages.toast.groupNoFile') || '⚠ Group attachments are not supported yet.'), true); cancelFilePreview(); return; }
      MN_API.post('/conversations/' + activeGroup + '/messages', { content: text }).then(function(res) {
        if (res.ok && res.data && res.data.message) {
          mockGroupMessages[activeGroup] = mockGroupMessages[activeGroup] || [];
          mockGroupMessages[activeGroup].push(adaptCloudMessage(res.data.message));
          var grp = groups.find(function(g) { return g.id === activeGroup; });
          if (grp) { grp.lastMsg = text; grp.time = 'Now'; }
          input.value = '';
          renderGroupList();
          renderGroupMessages();
          var gml = document.getElementById('groupMessageList');
          gml.scrollTop = gml.scrollHeight;
          animateLastBubble('groupMessageList');
        } else {
          showToast((T('messages.toast.sendFail') || '⚠ Message failed to send — try again.'), true);
        }
      });
      return;
    }

    if (!mockGroupMessages[activeGroup]) mockGroupMessages[activeGroup] = [];

    // Send file bubble first (if pending)
    if (hasFile) {
      var isImg = pendingFile.type.match(/^image\//);
      var isVid = isVideoFile(pendingFile);
      var fileMsg = {
        from: 'You',
        sent: false,
        _file: {
          name: pendingFile.name,
          type: pendingFile.type,
          size: pendingFile.size,
          mode: pendingFile.mode,
          dataUrl: pendingFile.dataUrl || null,
          videoUrl: pendingFile.videoUrl || null,
          _kind: isVid ? 'video' : 'image'
        },
        text: (isImg || pendingFile.dataUrl) ? '' : ((T('messages.msg.filePrefix') || '[File: ') + pendingFile.name + ']')
      };
      mockGroupMessages[activeGroup].push(fileMsg);
      pendingFile = null;
      clearFilePreviewUI();
    }

    // Send text bubble
    if (text) {
      mockGroupMessages[activeGroup].push({ from: 'You', text: text, sent: false });
    }

    var grp = groups.find(function(g) { return g.id === activeGroup; });
    if (grp) { grp.lastMsg = hasFile ? (T('messages.msg.image') || '[Image]') : text; grp.time = 'Now'; }

    input.value = '';
    saveData();
    renderGroupList();
    // Refresh read receipts + re-render messages directly
    markMessagesRead(mockGroupMessages, activeGroup);
    var msgs = mockGroupMessages[activeGroup] || [];
    justPinnedRef = null;
    _resetMediaReg();
    var html = '';
    msgs.forEach(function(m, mi) { html += msgBubble(m, mi, !!m._pinned, 'group', activeGroup); });
    document.getElementById('groupMessageList').innerHTML = html;
    document.getElementById('groupMessageList').scrollTop = document.getElementById('groupMessageList').scrollHeight;
    animateLastBubble('groupMessageList');
  }

  function loadGroupFriendPick() {
    MN_API.get('/friends').then(function(res) {
      var pick = document.getElementById('groupFriendPick');
      if (!pick) return;
      var noFriends = function() {
        pick.innerHTML = '<div class="label-sm" style="color:var(--color-outline);padding:8px;text-align:center">' + (T('messages.modal.groupNoFriends') || 'No friends yet — you can still create the group.') + '</div>';
      };
      if (!res.ok || !res.data || !Array.isArray(res.data.friends)) { noFriends(); return; }
      var friends = res.data.friends;
      if (!friends.length) { noFriends(); return; }
      pick.innerHTML = friends.map(function(f) {
        return '<div class="group-friend-item" data-uid="' + f.id + '" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer" onclick="groupFriendToggle(this)">' +

  function addFriendDemo() {
    var input = document.getElementById('friendInput');
    var name = input.value.trim();
    if (!name) return;
    var el = document.getElementById('friendResult');
    // 云端模式：输入即用户 ID（USR-XXXXXX），POST 发送好友请求（对方在铃铛通知里同意后才建会话）
    if (cloudMode) {
      var body = { userId: name };
      MN_API.post('/friend-requests', body).then(function(res) {
        if (res.ok) {
          el.textContent = (T('messages.modal.frSentCloud') || '✓ 好友请求已发送！');
          el.style.display = 'block';
          el.style.color = 'var(--color-secondary)';
          setTimeout(closeModal, 600);
        } else if (res.status === 404) {
          el.textContent = (T('messages.modal.fr404') || 'No user found with that ID.');
          el.style.display = 'block';
          el.style.color = '#ef4444';
        } else if (res.status === 409) {
          el.textContent = (T('messages.modal.fr409') || 'Friend request already sent or you are already friends.');
          el.style.display = 'block';
          el.style.color = '#ef4444';
        } else if (res.status === 400) {
          el.textContent = (T('messages.modal.frSelf') || 'You cannot send a friend request to yourself.');
          el.style.display = 'block';
          el.style.color = '#ef4444';
        } else if (res.status === 429) {
          el.textContent = (T('messages.modal.fr429') || 'Too many requests — try again later.');
          el.style.display = 'block';
          el.style.color = '#ef4444';
        } else {
          el.textContent = (T('messages.modal.frFail') || 'Could not send friend request — try again.');
          el.style.display = 'block';
          el.style.color = '#ef4444';
        }
      });
      return;
    }
    el.textContent = (T('messages.modal.frSentPre') || '✓ Friend request sent to ') + name + (T('messages.modal.frSentSuffix') || '!');
    el.style.display = 'block';
    el.style.color = 'var(--color-secondary)';
    // Add to conversations after a short delay
    setTimeout(function() {
      conversations.push({
        id: 'c' + (conversations.length + 1),
        name: name,
        lastMsgKey: 'messages.demo.frAcceptedMsg',
        lastMsgEn: 'Friend request accepted. Say hello!',

        timeEn: 'Now',

      closeModal();

  function createGroupDemo() {
    var nameInput = document.getElementById('groupNameInput');
    var name = nameInput.value.trim();
    if (!name) return;
    var el = document.getElementById('groupResult');
    // v10.28.51.0 云端建群：POST /api/conversations {kind:'group', name, memberIds}（服务端校验好友/群名 1-60）；

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    var now = new Date();
    var diff = now - d;
    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    if (days === 0) return (T('messages.ann.today') || 'Today');
    if (days === 1) return (T('messages.ann.yesterday') || 'Yesterday');
    if (days < 7) return days + (T('messages.ann.daysAgo') || ' days ago');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

    document.querySelectorAll('#msgSubnav .subnav-pill').forEach(function(b) { b.classList.remove('active'); });
    var targetBtn = document.querySelector('#msgSubnav [data-tab="' + tabMap[targetPanel] + '"]');

    var privateP = document.getElementById('privatePanel');
    var groupsP = document.getElementById('groupsPanel');
    var announceP = document.getElementById('announcementsPanel');
    var searchInput = document.getElementById('searchInput');

    // Fade all panels
    privateP.style.opacity = targetPanel === 0 ? '1' : '0.3';
    groupsP.style.opacity = targetPanel === 1 ? '1' : '0.3';
    announceP.style.opacity = targetPanel === 2 ? '1' : '0.3';

    // Update search placeholder
    searchInput.placeholder = targetPanel === 2 ? (T('messages.search.announcements') || 'Search announcements...') : (T('messages.search.messages') || 'Search messages...');

    msgPanel = targetPanel;
    // Clear stale state from other panels so info modal / members modal read the right data
    if (targetPanel !== 0) activeChat = null;
    if (targetPanel !== 1) activeGroup = null;
    document.getElementById('msgSlide').style.transform = 'translateX(' + (-targetPanel * 100) + '%)';

    // FAB visibility
    updateFab();

    // 抖音式地址栏联动（2026-09-17 Request J）：点 tab 时 URL 跟着变——
    // ?showTab=groups / ?showTab=announcements / private=默认回到干净路径；replaceState 不刷新不进历史
    var q = targetPanel === 0 ? '' : '?showTab=' + tabMap[targetPanel];
    try { history.replaceState(null, '', window.location.pathname + q); } catch (e) {}
  }

        renderAnnouncements();

      var results = announcements.filter(function(a) {

               a.contentEn.toLowerCase().includes(q) ||
               a.category.toLowerCase().includes(q) ||
               a.authorEn.toLowerCase().includes(q);
      });
      var saved = activeCategory;
      activeCategory = '__search__';
      renderFilteredAnnouncements(results);
      activeCategory = saved;

  // ──────────────────────────────────────────────
  //  CLOUD DMS（P4）— 云端会话适配为 demo 形状（conversations/mockMessages），
  //  现有渲染（气泡/右键/转发/置顶）零改动；demo 用户无 USR- id → 零请求。
  // ──────────────────────────────────────────────
  var cloudMode = false;
  var myCloudId = null;
  var cloudConvs = {}; // convId -> demo 形状条目（在 conversations 数组内同一引用）

  function convTime(iso) {
    var d = new Date(iso);
    var now = new Date();
    if (d.toDateString() === now.toDateString()) {
      var h = d.getHours(), m = d.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (!h) h = 12;
      return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
    }
    var yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (d.toDateString() === yest.toDateString()) return (T('messages.ann.yesterday') || 'Yesterday');
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function adaptCloudMessage(m) {
    var msg = m.senderId === myCloudId
      ? { from: 'You', text: m.content, sent: false }
      : { from: m.senderName, text: m.content, sent: true };
    msg._mid = m.id; // 轮询比对用（msgBubble 忽略未知字段）
    return msg;
  }

  function mergeCloudConversations(list) {
    list.forEach(function(cv) {
      var other = cv.members.filter(function(m) { return m.id !== myCloudId; })[0] || cv.members[0];
      var entry = {
        id: cv.id,
        name: other.displayName || other.id,
        lastMsg: cv.lastMessage ? cv.lastMessage.content : 'Say hello!',
        time: cv.lastMessage ? convTime(cv.lastMessage.createdAt) : '',
        avatar: (other.displayName || '?').charAt(0).toUpperCase(),
        online: false
      };
      cloudConvs[cv.id] = entry;
      var i = -1;
      for (var k = 0; k < conversations.length; k++) {
        if (conversations[k].id === cv.id) { i = k; break; }
      }
      if (i >= 0) conversations[i] = entry;
      else conversations.unshift(entry);
    });
  }

  function openCloudChat(id) {
    MN_API.get('/conversations/' + id + '/messages').then(function(res) {
      if (res.ok && res.data) {
        mockMessages[id] = res.data.messages.map(adaptCloudMessage);
      }
      renderOpenChat(id);
    });
  }

  // v10.28.51.0 云端群聊：kind='group' 会话并入群侧栏（groups+groupMembers），消息走 /api/conversations/:id/messages
  var cloudGroups = {}; // convId -> true（openGroupChat/sendGroupMessage 判定云群）
  function mergeCloudGroups(list) {
    list.forEach(function(cv) {
      cloudGroups[cv.id] = true;
      var entry = {
        id: cv.id,
        name: cv.name || cv.id,
        members: (cv.members || []).length,
        online: 0,
        lastMsg: cv.lastMessage ? cv.lastMessage.content : '',
        time: cv.lastMessage ? convTime(cv.lastMessage.createdAt) : '',
        avatar: (cv.name || 'G').replace(/\s+/g, '').substring(0, 2).toUpperCase(),
        unread: cv.unreadCount || 0
      };
      // 成员弹窗（会话成员无角色信息 → 一律 Member；自己标 You）
      groupMembers[cv.id] = (cv.members || []).map(function(m) {
        return { name: m.id === myCloudId ? 'You' : (m.displayName || m.id), avatar: (m.displayName || '?').charAt(0).toUpperCase(), role: 'Member' };
      });
      var i = -1;
      for (var k = 0; k < groups.length; k++) {
        if (groups[k].id === cv.id) { i = k; break; }
      }
      if (i >= 0) groups[i] = entry;
      else groups.unshift(entry);
    });
    renderGroupList();
  }

  function sendCloudMessage(text) {
    var id = activeChat;
    MN_API.post('/conversations/' + id + '/messages', { content: text }).then(function(res) {
      if (res.ok && res.data && res.data.message) {
        mockMessages[id] = mockMessages[id] || [];
        mockMessages[id].push(adaptCloudMessage(res.data.message));
        var conv = conversations.find(function(c) { return c.id === id; });
        if (conv) { conv.lastMsg = text; conv.time = 'Now'; }
        var input = document.getElementById('chatInput');
        if (input) input.value = '';
        renderConversationList();
        renderOpenChat(id);
        var ml = document.getElementById('messageList');
        ml.scrollTop = ml.scrollHeight;
        animateLastBubble('messageList');
      } else {
        showToast((T('messages.toast.sendFail') || '⚠ Message failed to send — try again.'), true);
      }
    });
  }

  function refreshCloudChat() {
    MN_API.get('/conversations').then(function(res) {
      if (!res.ok || !res.data) return;
      // v10.28.51.0：群聊分流——DM 列表只吃 dm；kind='group' 进群侧栏（mergeCloudGroups）
      var list = res.data.conversations || [];
      mergeCloudConversations(list.filter(function(cv) { return cv.kind !== 'group'; }));
      mergeCloudGroups(list.filter(function(cv) { return cv.kind === 'group'; }));
      renderConversationList();
      // 打开中的云端会话：拉新消息，有变化才重渲（不打断输入框）
      if (activeChat && cloudConvs[activeChat]) {
        MN_API.get('/conversations/' + activeChat + '/messages').then(function(r2) {
          if (!r2.ok || !r2.data) return;
          var fresh = r2.data.messages.map(adaptCloudMessage);
          var cur = mockMessages[activeChat] || [];
          var changed = fresh.length !== cur.length;
          if (!changed && fresh.length) {
            changed = fresh[fresh.length - 1]._mid !== cur[cur.length - 1]._mid;
          }
          if (changed) {
            mockMessages[activeChat] = fresh;
            renderOpenChat(activeChat);
          }
        });
      }
    });
  }

  function initCloudDMs() {
    if (!window.MN_API) return;
    MN_API.probe().then(function(up) {
      var u = SlatiDB.getUser();
      if (!up || !u || !u.id || String(u.id).indexOf('USR-') !== 0) return;
      myCloudId = u.id;
      cloudMode = true;
      refreshCloudChat();
      refreshFriendRequests();
      setInterval(refreshCloudChat, 15000);
      setInterval(refreshFriendRequests, 15000);
    });
  }

  // ──────────────────────────────────────────────
  //  NOTIFICATION POPUP（v0.2.51.0 灵动岛好友请求）
  // ──────────────────────────────────────────────
  var invites = [];            // {id, name, userId, avatar, time}（demo=localStorage，cloud=/api/friend-requests）
  var notifPendingId = null;   // 决定视图当前处理中的邀请 id（inline onclick 引用，必须顶层 var）

  function updateNotifBadge() {
    var b = document.getElementById('bellBadge');
    b.textContent = invites.length;
    b.style.display = invites.length ? 'block' : 'none';
  }

  function renderNotifPopup() {
    var list = document.getElementById('notifListView');
    var html = '';
    if (!invites.length) {
      // 空态用 person_add 图标（保护搜索栏铃铛的 notifications 精确串）
      html = '<div style="padding:28px 0 24px;text-align:center;color:var(--color-outline)">' +
        '<span class="material-symbols-outlined" style="font-size:32px;display:block;margin-bottom:8px">person_add</span>' +
        '<div class="label-sm">' + (T('messages.notif.empty') || '暂无好友请求') + '</div></div>';
    } else {
      html = invites.map(function(inv) {
        var frPre = T('messages.notif.frNamePre');
        var frPost = T('messages.notif.frNamePost');
        return '<div class="notif-entry" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer" onclick="openNotifDecision(\'' + inv.id + '\')">' +
          '<div class="msg-acc msg-avatar" style="width:40px;height:40px;border-radius:50%;background:#4648d4;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">' + inv.avatar + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (frPre !== null ? frPre : '「') + inv.name + (frPost !== null ? frPost : '」想加你为好友') + '</div>' +
            '<div style="color:var(--color-outline);font-size:11px;margin-top:2px">' + inv.userId + '</div>' +
          '</div>' +
          '<span class="material-symbols-outlined" style="font-size:18px;color:var(--color-outline)">chevron_right</span>' +
        '</div>';
      }).join('');
    }
    list.innerHTML = html;
    // 开窗中重渲（轮询/同意/拒绝后）→ 同步列表新高度，morph 过渡不跳变
    if (document.getElementById('notifPopup').style.display === 'flex') {
      document.getElementById('notifBody').style.height = list.offsetHeight + 'px';
    }
  }

  function toggleNotifPopup() {
    var p = document.getElementById('notifPopup');
    if (p.style.display === 'flex') { closeNotifPopup(); return; }
    if (cloudMode) refreshFriendRequests();
    var r = document.getElementById('bellBtn').getBoundingClientRect();
    p.style.top = (r.bottom + 8) + 'px';
    p.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
    p.style.display = 'flex';
    document.getElementById('notifTitle').textContent = (T('messages.notif.title') || '通知');
    renderNotifPopup();
    p.classList.remove('island-open');
    void p.offsetWidth; // reflow：重放灵动岛展开动画
    p.classList.add('island-open');
  }

  function closeNotifPopup() {
    var p = document.getElementById('notifPopup');
    p.style.display = 'none';
    p.classList.remove('show-decision', 'island-open');
    document.getElementById('notifTitle').textContent = (T('messages.notif.title') || '通知');
    notifPendingId = null;
  }

  function morphNotifView(view) {
    var p = document.getElementById('notifPopup');
    var body = document.getElementById('notifBody');
    var h0 = body.getBoundingClientRect().height;
    body.style.height = h0 + 'px';
    document.getElementById('notifTitle').textContent = view === 'decision' ? (T('messages.notif.decisionTitle') || '好友请求') : (T('messages.notif.title') || '通知');
    p.classList.toggle('show-decision', view === 'decision');
    void body.offsetHeight; // reflow：锁定当前高 → 过渡到目标视图高度
    var target = document.getElementById(view === 'decision' ? 'notifDecisionView' : 'notifListView');
    body.style.height = target.offsetHeight + 'px';
  }

  function openNotifDecision(id) {
    var inv = null;
    for (var i = 0; i < invites.length; i++) { if (invites[i].id === id) { inv = invites[i]; break; } }
    if (!inv) return;
    notifPendingId = id;
    document.getElementById('notifDecisionAvatar').textContent = inv.avatar;
    document.getElementById('notifDecisionName').textContent = inv.name;
    document.getElementById('notifDecisionId').textContent = inv.userId;
    morphNotifView('decision');
  }

  function refreshFriendRequests() {
    if (!cloudMode) return;
    MN_API.get('/friend-requests').then(function(res) {
      if (!res.ok || !res.data) return;
      invites = (res.data.requests || []).map(function(r) {
        return {
          id: r.id,
          name: r.sender.displayName || r.sender.id,
          userId: r.sender.id,
          avatar: (r.sender.displayName || '?').charAt(0).toUpperCase(),
          time: convTime(r.createdAt)
        };
      });
      updateNotifBadge();
      renderNotifPopup();
    });
  }

  function acceptInvite(id) {
    var inv = null;
    for (var i = 0; i < invites.length; i++) { if (invites[i].id === id) { inv = invites[i]; break; } }
    if (!inv) return;
    if (cloudMode) {
      MN_API.post('/friend-requests/' + id + '/accept').then(function(res) {
        if (res.ok) {
          invites = invites.filter(function(x) { return x.id !== id; });
          showToast((T('messages.toast.frAcceptedPre') || '已同意 ') + inv.name + (T('messages.toast.frAcceptedSuffix') || ' 的好友请求'));
          refreshCloudChat(); // 新 DM 即时入侧栏
          updateNotifBadge();
          renderNotifPopup();
          morphNotifView('list');
        } else {
          showToast((T('messages.toast.acceptFail') || '⚠ Accept failed — try again.'), true);
        }
      });
      return;
    }
    invites = invites.filter(function(x) { return x.id !== id; });
    conversations.push({
      id: 'c' + (conversations.length + 1),
      name: inv.name,
      lastMsgKey: 'messages.demo.frAcceptedMsg',
      lastMsgEn: 'Friend request accepted. Say hello!',
      timeKey: 'messages.demo.time.now',
      timeEn: 'Now',
      avatar: inv.avatar,
      online: true
    });
    saveData();
    renderConversationList();
    showToast((T('messages.toast.frAcceptedPre') || '已同意 ') + inv.name + (T('messages.toast.frAcceptedSuffix') || ' 的好友请求'));
    updateNotifBadge();
    renderNotifPopup();
    morphNotifView('list');
  }

  function declineInvite(id) {
    var inv = null;
    for (var i = 0; i < invites.length; i++) { if (invites[i].id === id) { inv = invites[i]; break; } }
    if (!inv) return;
    if (cloudMode) {
      MN_API.post('/friend-requests/' + id + '/decline').then(function(res) {
        if (res.ok) {
          invites = invites.filter(function(x) { return x.id !== id; });
          showToast((T('messages.toast.frDeclinedPre') || '已拒绝 ') + inv.name + (T('messages.toast.frDeclinedSuffix') || ' 的好友请求'));
          updateNotifBadge();
          renderNotifPopup();
          morphNotifView('list');
        } else {
          showToast((T('messages.toast.declineFail') || '⚠ Decline failed — try again.'), true);
        }
      });
      return;

    invites = invites.filter(function(x) { return x.id !== id; });
    saveData();
    showToast((T('messages.toast.frDeclinedPre') || '已拒绝 ') + inv.name + (T('messages.toast.frDeclinedSuffix') || ' 的好友请求'));
    updateNotifBadge();
    renderNotifPopup();
    morphNotifView('list');
  }

  // Auto-switch tab based on URL parameter（2026-09-17 Request J：showTab= 抖音式 tab 直达；
  // 旧 ?tab= 参数继续兼容读取——switchToPanel 内会把 URL 归一成 showTab 形态）
  (function(){
    var params = new URLSearchParams(window.location.search);
    var tab = params.get('showTab') || params.get('tab');
    if (tab === 'announcements') {
      switchToPanel(2);
    } else if (tab === 'groups') {
      switchToPanel(1);
    } else if (params.has('showTab') || params.has('tab')) {
      // 不认识的 tab 值 → 默认 private 并清掉参数（URL 归一）
      try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
    }
  })();

    if (document.getElementById('chatInfoModal').style.display === 'flex') renderInfoTab(infoTab);
    if (document.getElementById('membersModal').style.display === 'flex') {
      var grp2 = groups.find(function (g) { return g.id === activeGroup; });
      if (grp2) document.getElementById('membersTitle').textContent = grp2.name + (T('messages.members.suffix') || ' — Members');
      renderMembersList(document.getElementById('memberSearchInput').value);
    }
    if (document.getElementById('forwardModal').style.display === 'flex') renderForwardContacts(document.getElementById('forwardSearchInput').value);
  };
</script>
