<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Topic — Step 03 | M.NationWorld</title>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { background: radial-gradient(ellipse at 50% 30%, rgba(70,72,212,0.04) 0%, transparent 60%), var(--color-background); min-height:100vh;display:flex;flex-direction:column; }
    .topic-wizard { max-width: 640px; margin: 80px auto; width: 90%; }
  </style>
</head>
<body>

<div style="position:fixed;top:0;left:0;right:0;padding:var(--space-sm) var(--space-md);z-index:50;display:flex;align-items:center;gap:12px">
  <img src="../assets/image/M.NationWorld logo.png" alt="M.NationWorld" style="height:24px;width:auto">
  <span style="font-weight:700">M.NationWorld</span>
  <a href="dashboard.html" style="margin-left:auto;font-size:var(--fs-label-sm);color:var(--color-outline)">Cancel</a>
</div>

<div class="topic-wizard">
  <div class="progress-steps" style="justify-content:center;margin-bottom:var(--space-lg)">
    <div class="progress-step completed"><span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span><span>Info</span></div>
    <div class="progress-connector done"></div>
    <div class="progress-step completed"><span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span><span>Branding</span></div>
    <div class="progress-connector done"></div>
    <div class="progress-step active"><span class="dot">3</span><span>Review</span></div>
  </div>

  <div class="card tilt-container" style="padding:var(--space-lg)">
    <h2 class="headline-md" style="margin-bottom:4px">Review & Launch</h2>
    <p class="body-md" style="color:var(--color-on-surface-variant);margin-bottom:var(--space-md)">Step 3: Confirm your topic</p>

    <!-- Preview card -->
    <div class="card" style="margin-bottom:var(--space-md)" id="previewCard"></div>

    <!-- Summary -->
    <div style="display:flex;flex-direction:column;gap:12px" id="summarySection"></div>

    <div class="form-group" style="margin-top:var(--space-md)">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="termsCheck" style="width:18px;height:18px">
        <span class="label-md" style="color:var(--color-on-surface-variant);margin:0">I agree to the M.NationWorld Community Guidelines</span>
      </label>
    </div>

    <div class="flex-between" style="margin-top:var(--space-lg)">
      <a href="create-topic-step-2.html" class="btn btn-ghost"><span class="material-symbols-outlined">arrow_back</span> Previous</a>
      <button class="btn btn-primary btn-lg" id="launchBtn" onclick="handleLaunch()">
        Launch Topic
        <span class="material-symbols-outlined">rocket_launch</span>
      </button>
    </div>
  </div>
</div>

<script src="../assets/js/tilt.js"></script>
<script src="../assets/js/storage.js"></script>
<script>
  var draft;
  try {
    draft = JSON.parse(localStorage.getItem('slati_topic_draft') || '{}');
  } catch(e) {
    draft = {};
  }
  if (!draft.name) { window.location.href = 'create-topic-step-1.html'; }

  var catIcons = { governance: 'account_balance', art: 'palette', tech: 'memory', social: 'groups', other: 'more_horiz' };
  var catIcon = catIcons[draft.category] || 'forum';

  // Preview card
  document.getElementById('previewCard').innerHTML =
    '<div class="flex-center gap-sm" style="margin-bottom:8px">' +
      '<div style="width:40px;height:40px;border-radius:50%;background:' + (draft.accentColor || '#4648d4') + ';color:white;display:flex;align-items:center;justify-content:center;font-size:20px">' +
        '<span class="material-symbols-outlined" style="font-size:20px">' + catIcon + '</span>' +
      '</div>' +
      '<div>' +
        '<div style="font-weight:700">r/' + draft.name.replace(/\s+/g, '') + '</div>' +
        '<div class="label-sm" style="color:var(--color-outline)">' + (draft.visibility === 'public' ? '🌐 Public' : '🔒 Private') + '</div>' +
      '</div>' +
    '</div>' +
    '<p style="color:var(--color-on-surface-variant);font-size:var(--fs-label-md)">' + (draft.description || '') + '</p>';

  // Summary
  document.getElementById('summarySection').innerHTML =
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<span class="material-symbols-outlined" style="color:var(--color-outline);font-size:20px">category</span>' +
      '<span class="label-md" style="color:var(--color-outline)">Category:</span>' +
      '<span style="font-weight:600">' + (draft.category || '') + '</span>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<span class="material-symbols-outlined" style="color:var(--color-outline);font-size:20px">visibility</span>' +
      '<span class="label-md" style="color:var(--color-outline)">Visibility:</span>' +
      '<span style="font-weight:600">' + (draft.visibility === 'public' ? 'Public' : 'Private') + '</span>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:8px">' +
      '<span class="material-symbols-outlined" style="color:var(--color-outline);font-size:20px">palette</span>' +
      '<span class="label-md" style="color:var(--color-outline)">Accent:</span>' +
      '<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:' + (draft.accentColor || '#4648d4') + ';vertical-align:middle"></span>' +
    '</div>';

  function handleLaunch() {
    if (!document.getElementById('termsCheck').checked) {
      alert('Please agree to the Community Guidelines before launching.');
      return;
    }
    var btn = document.getElementById('launchBtn');
    btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px"></span> Processing Launch...';
    btn.disabled = true;

    SlatiDB.saveTopic({
      name: draft.name,
      description: draft.description,
      category: draft.category,
      accentColor: draft.accentColor,
      visibility: draft.visibility,
    });
    localStorage.removeItem('slati_topic_draft');

    setTimeout(function () {
      btn.innerHTML = 'Topic Launched! <span class="material-symbols-outlined">check</span>';
      btn.style.background = '#22c55e';
      setTimeout(function () { window.location.href = 'community-hub.html'; }, 1000);
    }, 1500);
  }
</script>
<script src="../assets/js/transitions.js"></script>
</body>
</html>
