<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支付页预览（演示）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: #0b0e17; color: #e6e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px;
  }
  .demo-badge {
    background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.4);
    color: #eab308; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    margin-bottom: 16px;
  }
  .shell { width: 100%; max-width: 520px; }
  .card {
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px; padding: 20px; margin-bottom: 14px;
  }
  .order { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .order .name { font-size: 16px; font-weight: 700; }
  .order .price { font-size: 20px; font-weight: 800; color: #eab308; white-space: nowrap; }
  .order .mode { font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-top: 4px; }
  .sec-title { font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, 0.75); margin-bottom: 10px; }
  .region-note { font-size: 12px; color: rgba(255, 255, 255, 0.45); margin-top: 10px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tabs button {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e6e8ee; border-radius: 10px; padding: 10px 4px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tabs button.on { background: rgba(234, 179, 8, 0.14); border-color: rgba(234, 179, 8, 0.55); color: #eab308; }
  .pane { display: none; margin-top: 14px; }
  .pane.on { display: block; }
  label { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.55); margin: 10px 0 4px; }
  input, select {
    width: 100%; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.18);
    color: #e6e8ee; border-radius: 8px; padding: 10px 12px; font-size: 15px; outline: none;
  }
  input:focus, select:focus { border-color: #eab308; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .brand-hint { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 8px; }
  .qr {
    height: 180px; border: 2px dashed rgba(255, 255, 255, 0.25); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.4); font-size: 13px;
  }
  .pay-btn {
    width: 100%; background: #eab308; color: #16130a; border: none; border-radius: 10px;
    padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 4px;
  }
  .pay-btn:disabled { opacity: 0.6; cursor: default; }
  .err { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .success {
    display: none; text-align: center; padding: 26px 0;
  }
  .success .big { font-size: 34px; }
  .success .ok { font-size: 18px; font-weight: 800; color: #4ade80; margin: 10px 0 6px; }
  .success .sub { font-size: 13px; color: rgba(255, 255, 255, 0.5); }
  .back { margin-top: 14px; font-size: 13px; color: rgba(255, 255, 255, 0.5); text-decoration: none; }
  .back:hover { color: #eab308; }
</style>
</head>
<body>
  <div class="demo-badge" id="demoBadge">预览演示 · 非真实支付页（不会扣款）</div>
  <div class="shell">
    <div class="card">
      <div class="order">
        <div>
          <div class="name" id="demoLabel">Premium</div>
          <div class="mode" id="demoModeNote">1 个月 · 每月自动续费</div>
        </div>
        <div class="price" id="demoPrice">RM23.50</div>
      </div>
    </div>

    <div class="card">
      <div class="sec-title">选择支付方式</div>
      <div class="tabs" id="pmTabs">
        <button type="button" data-pm-tab="card" class="on">银行卡</button>
        <button type="button" data-pm-tab="fpx">FPX 网银</button>
        <button type="button" data-pm-tab="alipay">支付宝</button>
        <button type="button" data-pm-tab="grabpay">GrabPay</button>
      </div>

      <div class="pane on" id="paneCard">
        <label for="cardNum">信用卡卡号</label>
        <input id="cardNum" inputmode="numeric" placeholder="4242 4242 4242 4242" autocomplete="off">
        <div class="row3">
          <div>
            <label for="cardExp">有效期</label>
            <input id="cardExp" placeholder="MM/YY" autocomplete="off">
          </div>
          <div>
            <label for="cardCvc">CVC</label>
            <input id="cardCvc" placeholder="123" autocomplete="off">
          </div>
        </div>
        <div class="brand-hint">支持 Visa / Mastercard / Amex（Apple Pay 随卡自动出现）</div>
      </div>

      <div class="pane" id="paneFpx">
        <label for="fpxBank">选择银行</label>
        <select id="fpxBank">
          <option value="maybank">Maybank</option>
          <option value="cimb">CIMB Bank</option>
          <option value="pbb">Public Bank</option>
          <option value="hlb">Hong Leong Bank</option>
          <option value="rhb">RHB Bank</option>
          <option value="amb">AmBank</option>
        </select>
        <div class="region-note">FPX 覆盖约 20 家大马银行，支付后跳转网银确认</div>
      </div>

      <div class="pane" id="paneAlipay">
        <div class="qr">扫码支付（演示占位）</div>
        <div class="region-note">支付宝 · 扫码后确认付款</div>
      </div>

      <div class="pane" id="paneGrabpay">
        <div class="qr">跳转 GrabPay 确认（演示占位）</div>
        <div class="region-note">GrabPay 钱包 · 跳转应用确认付款</div>
      </div>

      <div class="region-note" id="demoRegion">根据地区（马来西亚）提供以上支付方式</div>
    </div>

    <button type="button" class="pay-btn" id="demoPay">支付 RM23.50</button>
    <div class="err" id="demoErr"></div>

    <div class="success" id="demoSuccess">
      <div class="big">✅</div>
      <div class="ok">支付成功</div>
      <div class="sub">（预览演示，非真实扣款）2 秒后返回付费页…</div>
    </div>

    <a class="back" href="premium.html?payDemo=1">← 返回付费页</a>
  </div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var label = q.get('label') || 'Premium';
  var price = q.get('price') || 'RM23.50';
  var mode = q.get('mode') === 'once' ? 'once' : 'subscription';
  var priceNum = price.replace(/[^0-9.]/g, '') || '23.50';

  document.getElementById('demoLabel').textContent = label;
  document.getElementById('demoPrice').textContent = price;
  document.getElementById('demoModeNote').textContent = mode === 'once' ? '1 个月 · 到期不自动续费' : '1 个月 · 每月自动续费';
  document.getElementById('demoPay').textContent = '支付 ' + price;

  var current = 'card';
  document.getElementById('pmTabs').addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-pm-tab]');
    if (!t) return;
    current = t.dataset.pmTab;
    document.querySelectorAll('#pmTabs [data-pm-tab]').forEach(function (b) { b.classList.toggle('on', b === t); });
    ['card', 'fpx', 'alipay', 'grabpay'].forEach(function (k) {
      document.getElementById('pane' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === current);
    });
    document.getElementById('demoErr').textContent = '';
  });

  window.__demoNext = 'premium.html?paid=1&payDemo=1'; // 冒烟断言用：演示支付成功后的回跳目标

  document.getElementById('demoPay').addEventListener('click', function () {
    var err = document.getElementById('demoErr');
    if (current === 'card' && !document.getElementById('cardNum').value.trim()) {
      err.textContent = '请先填写卡号（演示：任意数字即可，例如 4242 4242 4242 4242）';
      return;
    }
    err.textContent = '';
    var btn = this;
    btn.disabled = true;
    btn.textContent = '处理中…';
    setTimeout(function () {
      btn.style.display = 'none';
      document.getElementById('demoSuccess').style.display = 'block';
      setTimeout(function () { location.href = window.__demoNext; }, 3000);
    }, 900);
  });
})();
</script>
</body>
</html>
