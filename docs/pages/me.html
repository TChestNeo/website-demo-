<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的 | M.NationWorld</title>
  <script src="../assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    body { min-height: 100vh; background: var(--color-background); }
    .me-page { width: min(760px, 100%); margin: 0 auto; padding: 48px 24px 112px; box-sizing: border-box; }
    .me-page__eyebrow { color: var(--color-outline); font-size: var(--fs-label-sm); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
    .me-page__title { margin: 0; color: var(--color-on-surface); font-size: clamp(28px, 7vw, 38px); letter-spacing: -.03em; }
    .me-page__subtitle { margin: 8px 0 22px; color: var(--color-outline); font-size: var(--fs-body-md); }
    @media (max-width: 768px), (orientation: landscape) and (max-height: 500px) {
      .me-page { padding: 28px 20px 108px; }
    }
  </style>
</head>
<body>
  <aside class="app-sidebar" id="slati-sidebar"></aside>
  <main class="app-main">
    <section class="me-page" aria-labelledby="me-title">
      <p class="me-page__eyebrow">M.NationWorld</p>
      <h1 class="me-page__title" id="me-title">我的</h1>
      <p class="me-page__subtitle">账户、隐私与使用偏好</p>
      <div id="mn-me-page"></div>
    </section>
  </main>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/site-config.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/transitions.js"></script>
</body>
</html>
