<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../assets/image/M.NationWorld logo circle_.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Complete — M.NationWorld</title>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(70,72,212,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(129,39,207,0.06) 0%, transparent 60%),
        linear-gradient(180deg, #0a0a1a 0%, #0d0d2b 40%, #050510 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .bg-sw {
      position: fixed;
      font-size: 40vw;
      font-weight: 800;
      color: rgba(255,255,255,0.015);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div class="bg-sw">SW</div>

<div style="display:flex;min-height:100vh;position:relative;z-index:1">
  <!-- Left pillar -->
  <div style="width:320px;padding:var(--space-xl);display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(255,255,255,0.06)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:var(--space-xl)">
      <img src="../assets/image/M.NationWorld logo.png" alt="M.NationWorld" style="height:28px;width:auto">
      <span style="font-weight:700;font-size:18px">M.NationWorld</span>
    </div>
    <div class="progress-steps" style="flex-direction:column;align-items:flex-start;gap:12px">
      <div class="progress-step completed">
        <span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span>
        <span>Create account</span>
      </div>
      <div class="progress-connector" style="width:2px;height:16px;margin:0 0 0 11px;background:var(--color-primary)"></div>
      <div class="progress-step completed">
        <span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span>
        <span>Identity Setup</span>
      </div>
      <div class="progress-connector" style="width:2px;height:16px;margin:0 0 0 11px;background:var(--color-primary)"></div>
      <div class="progress-step active">
        <span class="dot" style="background:#22c55e"><span class="material-symbols-outlined" style="font-size:14px">check</span></span>
        <span>Complete</span>
      </div>
    </div>
  </div>

  <!-- Right content -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-xl)">
    <div class="tilt-container" style="text-align:center;max-width:480px">
      <!-- Verified icon -->
      <div class="animate-float" style="width:120px;height:120px;border-radius:50%;background:rgba(70,72,212,0.1);border:2px solid rgba(70,72,212,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-md)">
        <span class="material-symbols-outlined animate-scale-in" style="font-size:56px;color:var(--color-primary)">verified</span>
      </div>

      <h1 class="display-lg text-gradient" style="margin-bottom:8px" id="greeting">All set, Sovereign!</h1>
      <p class="body-lg" style="color:rgba(255,255,255,0.6);margin-bottom:var(--space-sm)">
        Your identity has been verified and your citizen profile is now live.
      </p>

      <!-- Status badge -->
      <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);border-radius:var(--radius-full);margin-bottom:var(--space-lg)">
        <span class="status-dot status-dot-green" style="animation:pulse-glow 2s infinite"></span>
        <span class="label-md" style="color:#22c55e">Identity Cluster Online</span>
      </div>

      <br>
      <a href="transitioning.html" class="btn btn-primary btn-lg animate-pulse-glow">
        Enter Console
        <span class="material-symbols-outlined">arrow_forward</span>
      </a>
    </div>
  </div>
</div>

<script src="../assets/js/tilt.js"></script>
<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/storage.js"></script>
<script>
  var user = SlatiDB.getUser();
  if (user && user.displayName) {
    document.getElementById('greeting').textContent = 'All set, ' + user.displayName + '!';
  }
  SlatiDB.setOnboardingStep(3);
</script>
<script src="../assets/js/transitions.js"></script>
</body>
</html>
