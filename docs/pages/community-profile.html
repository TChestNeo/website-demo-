    if (window.MN_CropDialog) {
      var editAvPv = card.querySelector('#editAvatarPreview');
      if (editAvPv) window.MN_CropDialog.applyCrop(editAvPv, editAvatarCrop, editAvPv.parentElement);
    }
    // 横幅上传：隐藏 file input 挂卡片内（与页面背景/头像同款直传 /social/uploads，绝不 FormData；电池 DOM.setFileInputFiles 可定位）
    var bannerFileInput = document.createElement('input');
    bannerFileInput.type = 'file';
    bannerFileInput.id = 'editBannerFile';
    // v0.2.58.25 视频横幅：横幅文件框收 mp4/webm/mov（头像框不收——头像链视频走 toast 拒绝）
    bannerFileInput.accept = '.jpg,.jpeg,.png,.gif,.webp,.mp4,.webm,.mov';
    bannerFileInput.style.display = 'none';
    card.appendChild(bannerFileInput);
    // v0.2.58.25 视频横幅（钦定补报：只横幅）：VIDEO_EXTS 判定；头像链视频拒绝走 toast
    var VIDEO_EXTS = ['mp4', 'webm', 'mov'];
    // 上传链公共：预检 → fetch 直传 → editBannerUrl+预览 / 失败 toast（File 与图库 Blob 双来源同链）
    // v0.2.58.19 订阅分层（钦定①）：gif=付费专属——拦在上传链最前（toast+零 fetch，文件/图库双入口同漏斗）
    // v0.2.58.22 收紧：gif=高级订阅（premium/ultra）专属——basic 也被拦（canGif 谓词）
    function blockGif(ext) {
      if (ext === 'gif' && !canGif) { toastMsg(T('prof.toast.gifLocked') || 'GIF 动图为订阅用户专属功能', true); return true; }
      return false;
    }
    function doBannerUpload(blob, ext, rect) {
      card.querySelector('#editBannerState').textContent = T('prof.edit.bannerUploading') || '横幅上传中…';
      fetch(MN_API.BASE + '/social/uploads?ext=.' + ext, { method: 'POST', body: blob, credentials: 'include' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) {
          if (data && data.url) {
            editBannerUrl = data.url;
            editBannerCrop = rect;
            updateBannerPreview();
          } else throw new Error('no url');
        })
        .catch(function () {
          card.querySelector('#editBannerState').textContent = '';
          toastMsg(T('prof.edit.bannerUploadFail') || '横幅上传失败，请稍后再试', true);
        });
    }
    function uploadBannerBlob(blob, ext) {
      if (blockGif(ext)) return;
      // v0.2.58.25 视频横幅分支（钦定：只横幅；GIF 同门=canGif premium/ultra；跳过 10MB 预检=输入任意大平台自己压缩；
      //   压缩成片走同裁切弹窗→doBannerUpload ext='webm'）
      if (VIDEO_EXTS.indexOf(ext) !== -1) {
        if (!canGif) {
          toastMsg(T('prof.toast.videoLocked') || '视频横幅为高级订阅专属功能', true);
          var vLk = card.querySelector('#bannerGifUpgradeLink');
          if (vLk) vLk.style.display = 'inline-block';
          return;
        }
        if (!window.MN_CompressVideo) { toastMsg(T('prof.edit.videoFail') || '视频处理失败，请换一个视频试试', true); return; }
        card.querySelector('#editBannerState').textContent = T('prof.edit.videoCompressing') || '横幅视频压缩中…（最长 1 分钟）';
        window.MN_CompressVideo(blob).then(function (out) {
          if (!window.MN_CropDialog) { doBannerUpload(out.blob, 'webm', null); return; }
          window.MN_CropDialog.open({
            kind: 'banner',
            src: out.blob,
            initial: null,
            onConfirm: function (rect) { doBannerUpload(out.blob, 'webm', rect); },
            onCancel: function () { bannerFileInput.value = ''; } // 清值可重选同一文件
          });
        }, function () {
          card.querySelector('#editBannerState').textContent = '';
          toastMsg(T('prof.edit.videoFail') || '视频处理失败，请换一个视频试试', true);
        });
        return;
      }
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) === -1) { toastMsg(T('prof.edit.imgOnly') || '只支持 jpg / png / gif / webp 图片', true); return; }
      if (blob.size > 10 * 1024 * 1024) { toastMsg(T('prof.edit.imgTooBig') || '图片不能超过 10MB', true); return; }
      // v0.2.58.25 裁切弹窗（钦定①④）：门禁/白名单/大小预检全过后弹窗，confirm 才上传——取消=零上传零 PATCH；
      //   文件/图库双路径同漏斗（图库 conv.blob 走 objectURL）；组件缺失时降级直传（rect null=后端连带清回默认）
      if (!window.MN_CropDialog) { doBannerUpload(blob, ext, null); return; }
      window.MN_CropDialog.open({
        kind: 'banner',
        src: blob,
        initial: null,
        onConfirm: function (rect) { doBannerUpload(blob, ext, rect); },
        onCancel: function () { bannerFileInput.value = ''; } // 清值可重选同一文件
      });
    }
    // v0.2.58.22 三层门禁：free 上传锁——toast+升级链接显，文件选择器绝不打开（金罩点击穿透到此给反馈）
    card.querySelector('#editBannerUploadBtn').addEventListener('click', function () {
      if (!sub) { toastMsg(T('prof.toast.bannerLocked') || '横幅图片为订阅用户专属功能', true); var upL = card.querySelector('#bannerGifUpgradeLink'); if (upL) upL.style.display = 'inline-block'; return; }
      bannerFileInput.click();
    });
    bannerFileInput.addEventListener('change', function () {
      var f = bannerFileInput.files && bannerFileInput.files[0];
      if (!f) return;
      // v0.2.58.22 三层门禁：free 双保险（点击锁+change 锁）——直喂文件也零上传（free 只预设色卡）
      if (!sub) { toastMsg(T('prof.toast.bannerLocked') || '横幅图片为订阅用户专属功能', true); return; }
      uploadBannerBlob(f, (f.name.split('.').pop() || '').toLowerCase());
    });
    // 图库路径（钦定②双来源）：dataURL → Blob（转不出=非 base64 → toast 兜底）→ 同上传链
    // v0.2.58.19 订阅分层：图库=付费专属——点击直接 toast 不生效，选择器绝不打开（DOM 零构建）
    card.querySelector('#editBannerLibBtn').addEventListener('click', function () {
      if (!sub) { toastMsg(T('prof.toast.libLocked') || '图库为订阅用户专属功能', true); return; }
      openFcLibraryPicker(function (it) {
        var conv = fcDataUrlToBlob(it.src);
        if (!conv) { toastMsg(T('prof.edit.imgOnly') || '只支持 jpg / png / gif / webp 图片', true); return; }
        uploadBannerBlob(conv.blob, conv.ext);
      });
    });
    // 移除横幅：editBannerUrl=null（预览回预设渐变+提示文案；保存时 null 显式入 body=移除语义）
    // v0.2.58.25 连带清 crop（后端 url:null 权威连带，前端同态置 null 保预览）
    card.querySelector('#editBannerRemoveBtn').addEventListener('click', function () {
      editBannerUrl = null;
      editBannerCrop = null;
      updateBannerPreview();
    });
    // v0.2.58.25 重新裁切（钦定⑥：已有横幅才可点；src=当前 URL、initial=当前 crop；无订阅门禁=显示调整零上传；
    //   confirm 只改 editBannerCrop 不入链不上传——保存时 diff 入 body）
    card.querySelector('#editBannerReCropBtn').addEventListener('click', function () {
      if (!editBannerUrl || !window.MN_CropDialog) return;
      window.MN_CropDialog.open({
        kind: 'banner',
        src: editBannerUrl,
        initial: editBannerCrop,
        onConfirm: function (rect) {
          editBannerCrop = rect;
          updateBannerPreview();
        }
      });
    });

    // 头像：隐藏 file input 挂卡片内（电池 DOM.setFileInputFiles 可定位）→ 预检 → 直传
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.id = 'editAvatarFile';
    fileInput.accept = '.jpg,.jpeg,.png,.gif,.webp';
    fileInput.style.display = 'none';
    card.appendChild(fileInput);
    card.querySelector('#editAvatarBtn').addEventListener('click', function () { fileInput.click(); });
    // v0.2.58.25 头像上传链重构共享（文件/图库双来源同漏斗）：预检全过后弹裁切弹窗，confirm 才上传
    //   （取消=零上传零 PATCH+清 fileInput 值可重选同一文件）；confirm 确定性 rect（不拖不滚恒 {0,0,1,1}）写入 editAvatarCrop
    function uploadAvatarBlob(blob, ext) {
      if (blockGif(ext)) return; // v0.2.58.19 gif=付费专属
      // v0.2.58.25 视频只限横幅（钦定）：头像链视频文件 toast 拒绝零上传
      if (VIDEO_EXTS.indexOf(ext) !== -1) { toastMsg(T('prof.edit.avatarNoVideo') || '头像仅支持图片', true); return; }
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) === -1) { toastMsg(T('prof.edit.imgOnly') || '只支持 jpg / png / gif / webp 图片', true); return; }
      if (blob.size > 10 * 1024 * 1024) { toastMsg(T('prof.edit.imgTooBig') || '图片不能超过 10MB', true); return; }
      function doUpload(rect) {
        var stateEl = card.querySelector('#editSaveState');
        stateEl.textContent = T('prof.edit.avatarUploading') || '头像上传中…';
        fetch(MN_API.BASE + '/social/uploads?ext=.' + ext, { method: 'POST', body: blob, credentials: 'include' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            if (data && data.url) {
              editPendingAvatar = data.url;
              editAvatarCrop = rect;
              var pv = card.querySelector('#editAvatarPreview');
              pv.src = data.url;
              if (window.MN_CropDialog) window.MN_CropDialog.applyCrop(pv, rect, pv.parentElement);
              stateEl.textContent = T('prof.edit.avatarReady') || '新头像已就绪，点保存生效';
            } else throw new Error('no url');
          })
          .catch(function () {
            stateEl.textContent = '';
            toastMsg(T('prof.edit.avatarFail') || '头像上传失败，请稍后再试', true);
          });
      }
      if (!window.MN_CropDialog) { doUpload(null); return; } // 组件缺失降级直传（rect null=后端连带清回默认）
      window.MN_CropDialog.open({
        kind: 'avatar',
        src: blob,
        initial: null,
        onConfirm: doUpload,
        onCancel: function () { fileInput.value = ''; }
      });
    }
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      uploadAvatarBlob(f, (f.name.split('.').pop() || '').toLowerCase());
    });
    // v0.2.58.25 重新裁切（钦定⑥：已有头像才渲染按钮；src=当前图（上传未保存取 editPendingAvatar）、initial=当前 crop；
    //   confirm 只改 editAvatarCrop 不入链不上传）
    var avatarReCropBtn = card.querySelector('#editAvatarReCropBtn');
    if (avatarReCropBtn) avatarReCropBtn.addEventListener('click', function () {
      var srcNow = editPendingAvatar || u.avatarUrl;
      if (!srcNow || !window.MN_CropDialog) return;
      window.MN_CropDialog.open({
        kind: 'avatar',
        src: srcNow,
        initial: editAvatarCrop,
        onConfirm: function (rect) {
          editAvatarCrop = rect;
          var pv = card.querySelector('#editAvatarPreview');
          if (window.MN_CropDialog) window.MN_CropDialog.applyCrop(pv, rect, pv.parentElement);
          card.querySelector('#editSaveState').textContent = T('prof.edit.avatarReady') || '新头像已就绪，点保存生效';
        }
      });
    });

    // v0.2.58.20 头像同步勾选：即时落 localStorage（权威设置，不经保存事务——FC 每渲染即读旗标）
    card.querySelector('#editAvatarSyncToggle').addEventListener('click', function () {
      var on = this.classList.toggle('active');
      try { localStorage.setItem('slati_avatar_sync', on ? '1' : '0'); } catch (e) {}
      this.setAttribute('aria-checked', on ? 'true' : 'false');
    });

    // v0.2.58.18 头像图库入口（钦定⑤）：dataURL → Blob → 共享上传链落 editPendingAvatar（复用 avatarUploading/Ready/Fail 三键）
    // v0.2.58.19 订阅分层：图库=付费专属（toast 拦截，选择器绝不打开）；gif 条目第二处拦截（共享链 blockGif 首拦）
    // v0.2.58.25 图库同样走裁切弹窗（钦定④——uploadAvatarBlob 共享链自动生效）
    card.querySelector('#editAvatarLibBtn').addEventListener('click', function () {
      if (!sub) { toastMsg(T('prof.toast.libLocked') || '图库为订阅用户专属功能', true); return; }
      openFcLibraryPicker(function (it) {
        var conv = fcDataUrlToBlob(it.src);
        if (!conv) { toastMsg(T('prof.edit.imgOnly') || '只支持 jpg / png / gif / webp 图片', true); return; }
        uploadAvatarBlob(conv.blob, conv.ext);
      });
    });

    card.querySelector('#editCancelBtn').addEventListener('click', close);

    card.querySelector('#editSaveBtn').addEventListener('click', function () {
      var name = card.querySelector('#editNameInput').value.trim();
      if (!name) { toastMsg(T('prof.edit.nameEmpty') || '显示名不能为空', true); return; }
      var body = {};
      if (name !== u.displayName) body.displayName = name;
      var bio = card.querySelector('#editBioInput').value;
      if (bio !== (u.bio || '')) body.bio = bio;
      var genderBtn = card.querySelector('#editGenderRow [data-gender].active');
      var gender = genderBtn ? genderBtn.getAttribute('data-gender') : null;
      if (gender && gender !== u.gender) body.gender = gender;
      if (editPendingAvatar) body.avatarUrl = editPendingAvatar;
      // v0.2.58.25 裁切元数据（030 列）：新上传恒带 crop（confirm 确定性 {0,0,1,1} 也写——url 与 crop 同批落库）；
      //   重裁旧图=无新 url 仅 crop diff 才入 body（cropSame 键序无关四值比对）
      if (editPendingAvatar && editAvatarCrop) body.avatarCrop = editAvatarCrop;
      if (!editPendingAvatar && editAvatarCrop && !cropSame(editAvatarCrop, u.avatarCrop)) body.avatarCrop = editAvatarCrop;
      // v0.2.23.0 卡片背景（null = 恢复默认，显式入 body）
      if (editCardBg !== (u.cardBg || null)) body.cardBg = editCardBg;
      // v0.2.24.0 独立卡片背景（null = 无背景层，显式入 body；与 cardBg 分开各发各的）
      if (editCardPlate !== (u.cardPlate || null)) body.cardPlate = editCardPlate;
      // v0.2.25.0 页面背景图片（null = 恢复默认无背景，显式入 body）
      if (editPageBgImage !== (u.pageBgImage || null)) body.pageBgImage = editPageBgImage;
      // v0.2.58.18 横幅图片（029 列；null = 移除横幅恢复预设渐变，显式入 body）
      if (editBannerUrl !== (u.bannerUrl || null)) body.bannerUrl = editBannerUrl;
      // v0.2.58.25 横幅裁切：新图恒带 crop（同批落库）；重裁旧图仅 crop diff 才入；移除（url null）跳过——
      //   保持 {"bannerUrl":null} 精确移除体（后端 url 权威连带清 crop）
      if (editBannerUrl !== null) {
        if (editBannerUrl !== (u.bannerUrl || null) && editBannerCrop) body.bannerCrop = editBannerCrop;
        if (editBannerUrl === (u.bannerUrl || null) && editBannerCrop && !cropSame(editBannerCrop, u.bannerCrop)) body.bannerCrop = editBannerCrop;
      }
      // v0.2.53.0 卡片边缘主题（null = 恢复默认圆角卡，显式入 body；diff-only——无改动不触碰 E6 精确 body 断言）
      if (editCardEdge !== (EDGE_KEYS.indexOf(u.cardEdge) !== -1 ? u.cardEdge : null)) body.cardEdge = editCardEdge;
      // v10.28.52.0 等级奖励装饰激活态（null = 卸下，显式入 body；diff-only）
      if (editAvatarFrame !== (u.avatarFrame || null)) body.avatarFrame = editAvatarFrame;
      if (editTitle !== (u.title || null)) body.title = editTitle;
      if (!Object.keys(body).length) { close(); return; } // 没改动直接关
      var stateEl = card.querySelector('#editSaveState');
      var saveBtn = card.querySelector('#editSaveBtn');
      stateEl.textContent = T('prof.edit.saving') || '保存中…';
      saveBtn.disabled = true;
      MN_API.patch('/auth/me', body).then(function (r) {
        saveBtn.disabled = false;
        if (r.ok && r.data && r.data.user) {
          toastMsg(T('prof.edit.saved') || '资料已保存');
          var nu = r.data.user;
          // 本页零 localStorage（v0.2.21.0 口径）：不写 SlatiDB——saveUser 会触发 storage.js mirrorProfile
          // 二次 PATCH（全字段+语言/国家/生日回流，双写冗余且可能把陈旧值推回服务端）；
          // localStorage 由下页 cloudMerge 拉 /auth/me 权威覆盖。侧栏同页即时更新直接改同页 DOM
          // （sidebar.js 无公开重渲染 API）。
          var sideName = document.querySelector('#slati-sidebar .user-module .user-name');
          if (sideName && nu.displayName !== undefined) sideName.textContent = nu.displayName;
          if (nu.avatarUrl) {
            var sideAvatar = document.querySelector('#slati-sidebar .user-module .user-info-bar img');
            if (sideAvatar) sideAvatar.src = nu.avatarUrl;
          }
          // v0.2.58.20 头像同步（双向·资料页权威）：本轮 PATCH 含 avatarUrl 且勾选 ON → raw 合并写 slati_user。
          //   绝不走 SlatiDB.saveUser（storage.js mirrorProfile 会二次 PATCH /auth/me 双写）。
          //   OFF 零写入——FC 读旗标即显字母卡，无需清字段。
          if (body.avatarUrl || body.avatarCrop) {
            var syncToggleEl = card.querySelector('#editAvatarSyncToggle');
            var syncOnNow = syncToggleEl ? syncToggleEl.classList.contains('active') : true; // 缺键默认 ON
            if (syncOnNow) {
              try {
                var storedUser = JSON.parse(localStorage.getItem('slati_user') || 'null') || {};
                if (nu.avatarUrl !== undefined) storedUser.avatarUrl = nu.avatarUrl || body.avatarUrl;
                // v0.2.58.25 裁切连带（响应 publicUser 已含 avatarCrop；重裁-only PATCH 也落本地）
                if (nu.avatarCrop !== undefined) storedUser.avatarCrop = nu.avatarCrop;
                localStorage.setItem('slati_user', JSON.stringify(storedUser));
              } catch (e) {}
            }
          }
          close();
          loadProfile(); // 头部卡/性别徽章/bio 真后端重拉
        } else if (r.status === 401) {
          stateEl.textContent = '';
          toastMsg(T('prof.toast.session') || '登录已过期，请重新登录', true);
          close();
        } else if (r.status === 429) {
          stateEl.textContent = '';
          toastMsg(T('prof.toast.rate') || '操作过于频繁，请稍后再试', true);
        } else {
          stateEl.textContent = '';
          toastMsg((r.data && r.data.error && r.data.error.message) || (T('prof.edit.saveFail') || '保存失败，请稍后再试'), true);
        }
      });
    });
  }

  // ── 主页专属：tab + 帖子列表（卡片与 hub renderFeed 同款全操作行）──
  function renderTabs() {
    // v0.2.22.6 点赞/收藏默认私人：非本人只渲染 帖子/转发 两 tab
    var defs = (profileUser && profileUser.isSelf) ? TAB_DEFS : TAB_DEFS.slice(0, 2);
    document.getElementById('profileTabs').innerHTML = '<div class="card profile-tabs">' +
      defs.map(function (t) {
        return '<button type="button" class="profile-tab' + (currentTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + (T('prof.tab.' + t[0]) || t[1]) + '</button>';
      }).join('') + '</div>';
    document.querySelectorAll('#profileTabs [data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
  }

  function switchTab(tab) {
    if (currentTab === tab) return;
    currentTab = tab;
    renderTabs();
    loadTab();
  }

  function postCardHtml(p) {
    var content = String(p.content || '');
    var media = (p.media || []).filter(function (m) { return MEDIA_URL_RE.test(m); });
    return '<div class="card card-hover tilt-container post-card-click" data-cloud-id="' + escapeHtml(p.id) + '">' +
      '<div class="flex-center gap-sm" style="justify-content:flex-start;margin-bottom:8px">' +
        // v0.2.21.0 作者头像+徽章+名字包锚 → 个人主页（likes/favorites tab 卡片作者可能是他人；时间/report 留在锚外）
        (p.authorId ? '<a class="post-author-link" href="community-profile.html?id=' + encodeURIComponent(p.authorId) + '" title="' + (T('prof.viewProfile') || '查看主页') + '">' : '') +
        (p.avatarUrl ? '<img src="' + escapeHtml(p.avatarUrl) + '" alt="" class="avatar avatar-sm" style="margin-right:6px">' : '<span class="material-symbols-outlined" style="color:var(--color-outline);font-size:22px">person</span>') +
        '<span class="badge ' + (p.repostOfId ? 'badge-success' : 'badge-primary') + '">' + (p.repostOfId ? (T('prof.badge.reposted') || '转发了') : (T('prof.badge.citizenPost') || 'Citizen Post')) + '</span>' +
        '<span style="font-weight:600;font-size:var(--fs-label-md)">' + escapeHtml(p.authorName || (T('prof.citizen') || 'Citizen')) + '</span>' +
        (p.authorId ? '</a>' : '') +
        '<span class="label-sm" style="margin-left:auto;color:var(--color-outline)">' + escapeHtml(relativeTime(p.createdAt)) + '</span>' +
        '<button data-cloud-post="' + escapeHtml(p.id) + '" title="' + (T('prof.report') || 'Report') + '" style="border:none;background:transparent;color:var(--color-outline);cursor:pointer;padding:2px;margin-left:4px"><span class="material-symbols-outlined" style="font-size:16px">flag</span></button>' +
      '</div>' +
      (content.length > 90
        ? '<h4 style="font-weight:600;font-size:var(--fs-body-md);margin-bottom:4px">' + escapeHtml(content.slice(0, 90)) + '…</h4>' +
          '<p style="color:var(--color-on-surface-variant);font-size:var(--fs-label-md);margin-bottom:8px">' + escapeHtml(content.slice(90, 240)) + '</p>'
        : (content ? '<p style="color:var(--color-on-surface-variant);font-size:var(--fs-label-md);margin-bottom:8px">' + escapeHtml(content) + '</p>' : '')) +
      (p.repostOfId ? repostEmbeddedHtml(p.repostOf) : '') +
      (media.length ? mediaGridHtml(media) : '') +
      // v0.2.20.0 操作行：[赞][评][转][浏览][☆收藏][⇧分享]——与 hub/帖页同款全功能
      '<div class="flex-center gap-sm" style="justify-content:flex-start;gap:16px">' +
        '<button type="button" class="post-action-btn' + (p.likedByMe ? ' liked' : '') + '" data-like-post="' + escapeHtml(p.id) + '" aria-pressed="' + (p.likedByMe ? 'true' : 'false') + '"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">' + (p.likedByMe ? 'favorite' : 'favorite_border') + '</span><span class="like-burst" aria-hidden="true"><span class="like-fx"></span></span> <span data-like-count>' + (p.likeCount || 0) + '</span></button>' +
        '<span class="post-action-btn post-action-btn-static label-sm" style="color:var(--color-outline)"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-3px">chat_bubble</span> ' + (p.commentCount || 0) + '</span>' +
        '<button type="button" class="post-action-btn' + (p.repostedByMe ? ' reposted' : '') + '" data-repost-post="' + escapeHtml(p.id) + '" aria-pressed="' + (p.repostedByMe ? 'true' : 'false') + '"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">repeat</span> <span data-repost-count>' + (p.repostCount || 0) + '</span></button>' +
        '<span class="post-action-btn post-action-btn-static label-sm" style="color:var(--color-outline)"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-3px">visibility</span> ' + (p.viewCount || 0) + '</span>' +
        '<button type="button" class="post-action-btn' + (p.favoritedByMe ? ' favorited' : '') + '" data-favorite-post="' + escapeHtml(p.id) + '" aria-pressed="' + (p.favoritedByMe ? 'true' : 'false') + '" title="' + (T('prof.favorite') || '收藏') + '" style="margin-left:auto;margin-right:-22px"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">' + (p.favoritedByMe ? 'star' : 'star_border') + '</span></button>' +
        '<button type="button" class="post-action-btn" data-share-post="' + escapeHtml(p.id) + '" title="' + (T('prof.share') || '分享') + '"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">upload</span></button>' +
      '</div>' +
    '</div>';
  }

  function renderList(posts) {
    lastPosts = posts || []; // v0.2.54.0 i18n：切换语言时重渲染用
    var list = document.getElementById('profileList');
    if (!posts.length) {
      list.innerHTML = '<div class="card profile-empty">' + ((T('prof.empty.' + currentTab) || TAB_EMPTY[currentTab]) || (T('prof.empty.fallback') || '还没有内容')) + '</div>';
      return;
    }
    list.innerHTML = posts.map(postCardHtml).join('');
    if (window.SlatiTilt) SlatiTilt.init(document.querySelectorAll('.tilt-container'));
    closeLightbox(); // 重渲染清掉卡片 DOM，先关灯箱防悬空
    // 媒体瓦片 → 灯箱（每个网格闭包持自己的 URL 列表，src 反推零耦合）
    document.querySelectorAll('#profileList .post-media').forEach(function (grid) {
      var urls = [];
      grid.querySelectorAll('.pm-tile').forEach(function (tile) {
        var el = tile.querySelector('img, video');
        if (el) urls.push(el.getAttribute('src'));
      });
      grid.querySelectorAll('.pm-tile').forEach(function (tile, i) {
        tile.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(urls, i); });
      });
    });
    // 举报 + 操作行 + 整卡点击（每次重渲染后重新挂）
    document.querySelectorAll('#profileList [data-cloud-post]').forEach(function (el) {
      MN_Report.mount(el, { targetType: 'post', targetId: el.getAttribute('data-cloud-post') });
    });
    document.querySelectorAll('#profileList [data-like-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); toggleLikeBtn(btn); });
    });
    document.querySelectorAll('#profileList [data-repost-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); toggleRepost(btn); });
    });
    document.querySelectorAll('#profileList [data-favorite-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); toggleFavorite(btn); });
    });
    document.querySelectorAll('#profileList [data-share-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); sharePost(btn.getAttribute('data-share-post')); });
    });
    // 整卡点击 → 独立帖页（按钮内/锚内/文字选区不跳）
    document.querySelectorAll('#profileList [data-cloud-id]').forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.closest('button')) return;
        if (e.target.closest('a')) return; // 作者锚走自己的 href，不抢整卡跳转
        if (window.getSelection && String(window.getSelection()).length) return;
        window.location.href = 'community-post.html?id=' + encodeURIComponent(card.getAttribute('data-cloud-id'));
      });
    });
  }

  function loadTab() {
    MN_API.get('/social/users/' + profileId + '/posts?tab=' + encodeURIComponent(currentTab)).then(function (r) {
      if (!r.ok || !r.data || !Array.isArray(r.data.posts)) { renderList([]); return; }
      renderList(r.data.posts);
    });
  }

  function loadProfile() {
    MN_API.get('/social/users/' + profileId).then(function (r) {
      if (r.status === 404 || (r.ok && !r.data.user)) { render404('prof.notFound'); return; }
      if (!r.ok || !r.data || !r.data.user) { render404('prof.loadFail'); return; }
      lastUser = r.data.user; // v0.2.54.0 i18n：切换语言时重渲染用
      profileUser = lastUser;
      document.getElementById('profileState404').style.display = 'none';
      document.getElementById('profileMain').style.display = 'flex';
      renderHeader(profileUser);
      renderTabs();
      loadTab();
      // v10.28.52.0 等级奖励：本人主页拉奖励清单（成就/徽章/装饰品）→ 头部奖励区重渲
      loadRewardsMe(function () { if (profileUser) renderHeader(profileUser); });
    });
  }

  // ── 初始化 ──
  profileId = parseProfileId();
  if (!profileId) render404('prof.notFound');
  else loadProfile();
  // v0.2.54.0 i18n：语言切换时重渲染（不重新 fetch；404/头部/tab/列表用缓存数据）
  window.__profI18nRefresh = function () {
    if (last404Key) { render404(last404Key); return; }
    if (lastUser) {
      renderHeader(lastUser);
      renderTabs();
      renderList(lastPosts);
    }
  };
  // v10.28.52.0 等级奖励：侧栏自动领奖 → 奖励区即时刷新
  window.addEventListener('mn:rewards-changed', function () {
    loadRewardsMe(function () { if (lastUser) renderHeader(lastUser); });
  });
})();
</script>
<script src="../assets/js/transitions.js"></script>
<script>/* pre-stagger 兜底（切页闪修复 08-28）：若 transitions.js 未执行，1.6s 后解除隐藏防页面永久空白 */
setTimeout(function () { var b = document.body; if (b) b.classList.remove('pre-stagger'); }, 1600);
</script>
<!-- v0.2.54.0 i18n：字典三件套 + 页面应用（务必在全部内联脚本之后） -->
<script src="../assets/js/i18n.js"></script>
<script src="../assets/i18n/common.i18n.js"></script>
<script src="../assets/i18n/community-profile.i18n.js"></script>
<script>
MN_I18N.apply();
// v0.2.54.0 i18n：404 为同步 JS 渲染（i18n.js 加载前已用原文兜底渲染）——
// 非 zh 语言初次进入与设置弹窗切换语言时重渲染（头部/tab/列表由 fetch 回调渲染，i18n 必已就绪）
(function () {
  if (typeof window.__profI18nRefresh !== 'function') return;
  if (window.MN_I18N.getLang() !== 'zh') window.__profI18nRefresh();
  MN_I18N.onChange(function () { window.__profI18nRefresh(); });
})();
</script>
</body>
