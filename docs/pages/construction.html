<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="../assets/image/M.NationWorld logo circle_.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creation — M.NationWorld</title>
  
  <script>
  /* 防主题白闪：原 theme-init.js 内联——必须 CSS 之前同步执行（外链脚本走网络晚到 → 页面先按默认主题画一帧再跳 = 切页闪白） */
  (function () {
    var theme = 'light';
    try {
      var raw = localStorage.getItem('slati_settings');
      if (raw) {
        var s = JSON.parse(raw);
        if (s.theme) theme = s.theme;
      }
    } catch (e) {}
    if (theme === 'auto') {
      var h = new Date().getHours();
      theme = (h >= 20 || h < 5) ? 'dark' : 'light';
    } else if (theme === 'system') {
      theme = 'light';
    }
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>
  <link rel="stylesheet" href="../assets/css/ethereal.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-layout">
  <aside class="app-sidebar" id="slati-sidebar"></aside>
  <main class="app-main">
    <div style="display:flex;align-items:center;justify-content:center;min-height:80vh">
      <div class="tilt-container" style="text-align:center">
        <span class="material-symbols-outlined" style="font-size:64px;color:var(--color-outline-variant);margin-bottom:var(--space-md)">construction</span>
        <h1 class="display-lg" style="font-size:36px;margin-bottom:8px">Construction is underway,<br>please wait.</h1>
        <p class="body-lg" style="color:var(--color-on-surface-variant)">——Coming soon——</p>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/tilt.js"></script>
<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/sidebar.js"></script>
<script src="../assets/js/settings-modal.js"></script>
<script src="../assets/js/transitions.js"></script>
</body>
</html>
