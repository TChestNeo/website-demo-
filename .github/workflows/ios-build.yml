name: iOS Build

on:
  push:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (simulator) — 编译验证
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project MNationWorld.xcodeproj \
            -scheme MNationWorld \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tail -50

      - name: Build device app (unsigned) — 出真机产物
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project MNationWorld.xcodeproj \
            -scheme MNationWorld \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tail -50

      - name: Make unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "APP NOT FOUND — 产物目录结构："
            find build -maxdepth 4 -type d | head -40
            exit 1
          fi
          echo "APP=$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr MNationWorld-unsigned.ipa Payload
          ls -la MNationWorld-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MNationWorld-unsigned-ipa
          path: ios/build/MNationWorld-unsigned.ipa
          retention-days: 30
