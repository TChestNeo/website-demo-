name: iOS Build

on:
  push:
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (simulator, no signing) — 编译验证
        working-directory: ios
        run: |
          xcodebuild build \
            -project MNationWorld.xcodeproj \
            -scheme MNationWorld \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tail -40

      - name: Archive (device, unsigned) — 出真机安装包
        working-directory: ios
        run: |
          xcodebuild archive \
            -project MNationWorld.xcodeproj \
            -scheme MNationWorld \
            -destination 'generic/platform=iOS' \
            -archivePath build/MNationWorld.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" | tail -40

      - name: Make unsigned IPA
        working-directory: ios
        run: |
          echo "== archive 产物结构 =="
          find build/MNationWorld.xcarchive/Products -maxdepth 3 2>/dev/null || echo "(无 Products 目录)"
          APP=$(find build/MNationWorld.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then echo "APP NOT FOUND"; exit 1; fi
          echo "APP=$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr MNationWorld-unsigned.ipa Payload
          ls -la MNationWorld-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MNationWorld-unsigned-ipa
          path: ios/build/MNationWorld-unsigned.ipa
          retention-days: 30
