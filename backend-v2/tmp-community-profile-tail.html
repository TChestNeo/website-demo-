<style>
/* ===== v0.2.21.0 个人主页样式（无 ethereal 内联标记，inliner 安全）===== */
.profile-page-wrap { max-width: 680px; margin: 0 auto; padding: var(--space-sm) 0; display: flex; flex-direction: column; gap: var(--space-md); }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--color-primary); text-decoration: none; font-size: var(--fs-label-md); width: fit-content; }
.back-link:hover { text-decoration: underline; }
.profile-header { display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; } /* v0.2.22.5 padding 移入 profile-body，横幅顶满卡 */
.profile-banner { height: 140px; flex: none; background: linear-gradient(135deg, rgba(70,72,212,0.9), rgba(124,92,224,0.55) 45%, rgba(70,72,212,0.92)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.2), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); } /* v0.2.22.5 顶部横幅（用户「添加一个横幅」） */
.profile-body { display: flex; flex-direction: column; gap: var(--space-sm); padding: var(--space-md) var(--space-lg) var(--space-lg); }
.profile-top { display: flex; align-items: center; gap: var(--space-md); border-bottom: 1px solid var(--color-outline-variant); padding-bottom: var(--space-md); } /* v0.2.22.2 横排；v0.2.22.5 底部分割线（简介与头像之间）+ 头像随横幅下调 */
.profile-avatar { width: 72px; height: 72px; border-radius: 9999px; object-fit: cover; border: 3px solid var(--color-surface); flex: none; }

.profile-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--space-sm); } /* v0.2.22.6 flex 平分——他人主页仅 2 块（帖子/转发）时不空列 */
.profile-stat { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border: none; border-radius: var(--radius-md); background: var(--color-surface-container-low); cursor: pointer; font-family: inherit; color: inherit; }
.profile-stat:hover { background: rgba(70,72,212,0.08); }
.profile-stat-num { font-weight: 700; font-size: var(--fs-body-md); color: var(--color-on-surface); }
.profile-stat-label { font-size: var(--fs-label-sm); color: var(--color-outline); }
.profile-counts { display: flex; flex: none; gap: var(--space-md); font-size: var(--fs-label-md); color: var(--color-outline); }
.profile-counts b { color: var(--color-on-surface); }
.profile-follow-row { display: flex; gap: 8px; align-items: center; }
.profile-tabs { display: flex; gap: 4px; padding: 6px; }
.profile-tab { flex: 1; border: none; background: transparent; color: var(--color-outline); cursor: pointer; padding: 8px 4px; border-radius: var(--radius-md); font-family: inherit; font-size: var(--fs-label-md); font-weight: 600; }
.profile-tab:hover { background: var(--color-surface-container-low); }
.profile-tab.active { background: var(--color-primary); color: #fff; }
.edit-gender-pill { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 52px; min-height: 38px; border: 1px solid var(--color-outline); background: transparent; color: var(--color-on-surface); cursor: pointer; padding: 4px 16px; border-radius: var(--radius-full); font-family: inherit; font-size: var(--fs-label-md); }
.edit-gender-pill:hover { background: var(--color-surface-container-low); }
.edit-gender-pill.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
/* v0.2.23.0 卡片背景自定义（用户「自定义是可以自定义卡片背景」+「把那个react内的加入那个自定义内」）；
   v0.2.23.1 口径修正：预设渐变铺满整张 profile-header 卡（tint 须包成线性渐变层才合法）；
   v0.2.23.2 口径修正：用户「你放在自定义内的那个叫横幅不叫背景」——横幅与背景分开：横幅保持
   v0.2.22.5 品牌渐变不动（background none 覆盖已删除），预设只作为横幅下方的卡片背景；
   v0.2.23.3 结构重排（用户「你把现在的卡片背景改成横幅，然后下面再开一个卡片背景然后那个背景要阔出去6px」，
   参考代码=蓝紫渐变 #60a5fa→#a78bfa 风格）：横幅=预设渐变（var(--lg-bg)），卡身回纯底色（card-bg），
   卡片四周阔出 6px 光环背景（#profileHeader 包层 .card-halo：margin:-6px+padding:6px 不挤占卡片原尺寸）；
   液体玻璃引擎（liquid-glass.js = rdev/liquid-glass-react 移植；弹性跟手已按 v0.2.9.1 撤销口径下线——
   一律静态玻璃：折射+磨砂+镜面高光） */
.profile-header.glass-bg .profile-banner { background: var(--lg-bg, var(--color-surface-container-high)); } /* 横幅=预设渐变（v0.2.23.3 预设从卡身移回横幅） */
.card-halo { margin: -6px; padding: 6px; border-radius: calc(var(--radius-lg) + 6px); background: var(--lg-bg, linear-gradient(135deg, #60a5fa, #a78bfa)); } /* v0.2.23.3 四周阔出 6px 光环背景（margin 负值抵消 padding，卡片视觉尺寸不变；兜底=参考代码蓝紫渐变） */
.profile-header .lg-backdrop { -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); } /* 引擎默认 6px，主页卡给 14px 磨砂 */
.bg-default { --lg-bg: linear-gradient(135deg, rgba(70,72,212,0.9), rgba(124,92,224,0.55) 45%, rgba(70,72,212,0.92)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.2), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
.glass-frost { --lg-tint: rgba(255,255,255,0.12); --lg-bg: linear-gradient(135deg, rgba(255,255,255,0.38), rgba(255,255,255,0.10) 45%, rgba(255,255,255,0.30)), linear-gradient(135deg, rgba(96,100,230,0.50), rgba(150,120,245,0.35) 50%, rgba(96,100,230,0.50)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.20), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
.glass-ocean { --lg-tint: rgba(30,90,200,0.10); --lg-bg: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.22)), linear-gradient(135deg, rgba(30,90,200,0.55), rgba(40,140,190,0.40) 50%, rgba(30,90,200,0.55)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.20), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
.glass-violet { --lg-tint: rgba(124,92,224,0.12); --lg-bg: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.22)), linear-gradient(135deg, rgba(124,92,224,0.55), rgba(190,120,240,0.40) 50%, rgba(124,92,224,0.55)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.20), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
.glass-rose { --lg-tint: rgba(232,110,160,0.12); --lg-bg: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.22)), linear-gradient(135deg, rgba(232,110,160,0.55), rgba(240,150,190,0.40) 50%, rgba(232,110,160,0.55)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.20), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
.glass-mint { --lg-tint: rgba(40,180,150,0.12); --lg-bg: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.22)), linear-gradient(135deg, rgba(40,180,150,0.55), rgba(90,200,170,0.40) 50%, rgba(40,180,150,0.55)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.20), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
.glass-sunset { --lg-tint: rgba(240,130,60,0.12); --lg-bg: linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.22)), linear-gradient(135deg, rgba(240,130,60,0.55), rgba(240,80,120,0.40) 50%, rgba(240,130,60,0.55)), radial-gradient(circle at 22% 28%, rgba(255,255,255,0.20), transparent 46%), radial-gradient(circle at 80% 72%, rgba(255,255,255,0.12), transparent 40%), var(--color-surface-container-high); }
/* 弹窗顶部 基础/自定义 导航 + 背景预设网格 */
.edit-nav { display: flex; gap: 4px; background: var(--color-surface-container-low); border-radius: var(--radius-full); padding: 4px; margin-bottom: var(--space-md); }
.edit-nav button { flex: 1; border: none; background: transparent; color: var(--color-outline); cursor: pointer; padding: 6px 12px; border-radius: var(--radius-full); font-family: inherit; font-size: var(--fs-label-md); font-weight: 600; }
.edit-nav button.active { background: var(--color-primary); color: #fff; }
/* v0.2.23.3 预览=真实结构缩小版：横幅（预设渐变）+ 卡身纯底色 + 四周 6px 光环（has-bg 时露出） */
.edit-bg-preview { margin-bottom: 10px; border-radius: var(--radius-md); }
.edit-bg-preview.has-bg { padding: 6px; background: linear-gradient(135deg, #60a5fa, #a78bfa); } /* 光环=参考代码蓝紫渐变 */
.edit-bg-preview .swatch-fill { width: 100%; height: 56px; display: flex; flex-direction: column; border-radius: var(--radius-sm); overflow: hidden; }
.edit-bg-preview .pv-banner { flex: none; height: 20px; background: var(--lg-bg, var(--color-surface-container-high)); } /* 横幅=预设渐变（默认=品牌渐变） */
.edit-bg-preview .pv-body { flex: 1; background: var(--color-surface-container-high); } /* 卡身纯底色 */
.edit-bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.edit-bg-swatch { display: flex; flex-direction: column; gap: 4px; align-items: center; border: 1px solid var(--color-outline-variant); border-radius: var(--radius-md); background: var(--color-surface-container-low); padding: 6px; cursor: pointer; font-family: inherit; color: inherit; }
.edit-bg-swatch:hover { border-color: var(--color-outline); }
.edit-bg-swatch.active { border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(70,72,212,0.35); }
.edit-bg-swatch .swatch-fill { width: 100%; height: 36px; border-radius: 6px; background: var(--lg-bg, var(--color-surface-container-high)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 0 0 1px rgba(255,255,255,0.14); }
.edit-bg-swatch .swatch-label { font-size: var(--fs-label-sm); color: var(--color-on-surface-variant); }
.profile-empty { text-align: center; color: var(--color-outline); padding: var(--space-xl) var(--space-md); font-size: var(--fs-label-md); }
#profileState404 { padding: var(--space-xl) var(--space-md); text-align: center; }
@media (max-width: 900px) {
  .profile-page-wrap { padding-left: var(--space-sm); padding-right: var(--space-sm); }
}
</style>

<body class="pre-stagger">

<div class="app-layout">
  <aside class="app-sidebar" id="slati-sidebar"></aside>
  <main class="app-main">
    <div class="profile-page-wrap">
      <a class="back-link" href="community-hub.html"><span class="material-symbols-outlined" style="font-size:18px">arrow_back</span> 返回 Community</a>

      </div>
      <div id="profileMain" style="display:none;flex-direction:column;gap:var(--space-md)">
        <div id="profileHeader"></div>
        <div id="profileTabs"></div>
        <div id="profileList"></div>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  // ── 从帖页 tail 逐字复制的通用助手（v0.2.21.0 口径）──
  function relativeTime(iso) {
    var diff = Date.now() - new Date(iso).getTime();
    if (Number.isNaN(diff)) return '';
    if (diff < 60000) return 'just now';
    var m = Math.floor(diff / 60000);
    if (m < 60) return m + ' min ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' hr ago';
    return Math.floor(h / 24) + ' d ago';
  }

  function toastMsg(msg, isError) {
    if (window.MN_Report && MN_Report.toast) MN_Report.toast(msg, isError);
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var MEDIA_URL_RE = /^\/uploads\/UPL-[A-Za-z0-9]+\.(jpg|jpeg|png|gif|webp|mp4|webm|mov)$/;
  function isVideoUrl(u) { return /\.(mp4|webm|mov)$/i.test(u); }

  function mediaGridHtml(media) {
    var html = '<div class="post-media pm-' + media.length + '">';
    media.forEach(function (url, i) {
      html += '<button type="button" class="pm-tile" data-media="' + i + '" aria-label="查看大图">' +
        (isVideoUrl(url)
          ? '<video controls preload="metadata" src="' + escapeHtml(url) + '"></video>'
          : '<img loading="lazy" src="' + escapeHtml(url) + '" alt="">') +
        '</button>';
    });
    return html + '</div>';
  }

  // v0.2.18.0 嵌入原帖盒（与 hub/帖页同构；o=null → 原帖已删除或不可见占位）。全量 escapeHtml。
  function repostEmbeddedHtml(o) {
    if (!o) return '<div class="repost-embedded-gone">原帖已删除或不可见</div>';
    var m = (o.media || []).filter(function (x) { return MEDIA_URL_RE.test(x); });
    var text = String(o.content || '');
    var shown = text.length > 200 ? text.slice(0, 200) + '…' : text;
    return '<div class="repost-embedded">' +
      '<div class="flex-center" style="justify-content:flex-start;gap:6px">' +
        (o.avatarUrl ? '<img src="' + escapeHtml(o.avatarUrl) + '" alt="" class="avatar avatar-sm">' : '') +
        '<span style="font-weight:600;font-size:var(--fs-label-md)">' + escapeHtml(o.authorName || 'Citizen') + '</span>' +
        '<span class="label-sm" style="color:var(--color-outline)">' + escapeHtml(o.createdAt ? relativeTime(o.createdAt) : '') + '</span>' +
      '</div>' +
      (shown ? '<p class="repost-embedded-text">' + escapeHtml(shown) + '</p>' : '') +
      (m.length ? mediaGridHtml(m) : '') +
      '</div>';
  }

  // ── 灯箱（从帖页 tail 逐字复制，绑定范围换 #profileList）──
  var lbBackdrop = null, lbCard = null, lbMedia = null, lbClose = null, lbPrev = null, lbNext = null;
  var lbList = [], lbIdx = 0;

  function lbEscape(e) { if (e.key === 'Escape') closeLightbox(); }

  function lbRenderMedia() {
    if (lbMedia) { if (lbMedia.pause) lbMedia.pause(); lbMedia.remove(); }
    var url = lbList[lbIdx];
    var isVideo = isVideoUrl(url);
    lbMedia = isVideo ? document.createElement('video') : document.createElement('img');
    lbMedia.className = 'lb-media' + (isVideo ? ' video' : '');
    if (isVideo) { lbMedia.controls = true; lbMedia.autoplay = true; }
    lbMedia.src = url;
    lbCard.insertBefore(lbMedia, lbClose);
  }

  function lbShowArrows() {
    lbPrev.disabled = lbIdx <= 0;
    lbNext.disabled = lbIdx >= lbList.length - 1;
    lbPrev.style.display = lbList.length > 1 ? '' : 'none';
    lbNext.style.display = lbList.length > 1 ? '' : 'none';
  }

  function openLightbox(list, idx) {
    lbList = list || [];
    lbIdx = Math.max(0, Math.min(idx || 0, lbList.length - 1));
    if (!lbList.length) return;
    if (!lbBackdrop) {
      lbBackdrop = document.createElement('div');
      lbBackdrop.className = 'modal-backdrop';
      lbBackdrop.addEventListener('click', closeLightbox);
      var cont = document.createElement('div');
      cont.className = 'modal-container';
      lbCard = document.createElement('div');
      lbCard.className = 'modal-card lb-card';
      lbClose = document.createElement('button');
      lbClose.type = 'button';
      lbClose.className = 'lb-close';
      lbClose.setAttribute('aria-label', '关闭');
      lbClose.innerHTML = '<span class="material-symbols-outlined" style="font-size:28px">close</span>';
      lbClose.addEventListener('click', function (e) { e.stopPropagation(); closeLightbox(); });
      lbPrev = document.createElement('button');
      lbPrev.type = 'button';
      lbPrev.className = 'lb-arrow lb-prev';
      lbPrev.setAttribute('aria-label', '上一张');
      lbPrev.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">chevron_left</span>';
      lbPrev.addEventListener('click', function (e) { e.stopPropagation(); if (lbIdx > 0) { lbIdx--; lbRenderMedia(); lbShowArrows(); } });
      lbNext = document.createElement('button');
      lbNext.type = 'button';
      lbNext.className = 'lb-arrow lb-next';
      lbNext.setAttribute('aria-label', '下一张');
      lbNext.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">chevron_right</span>';
      lbNext.addEventListener('click', function (e) { e.stopPropagation(); if (lbIdx < lbList.length - 1) { lbIdx++; lbRenderMedia(); lbShowArrows(); } });
      lbCard.appendChild(lbPrev);
      lbCard.appendChild(lbNext);
      lbCard.appendChild(lbClose);
      cont.appendChild(lbCard);
      document.body.appendChild(lbBackdrop);
      document.body.appendChild(cont);
      document.addEventListener('keydown', lbEscape);
    }
    lbRenderMedia();
    lbShowArrows();
    void lbCard.offsetWidth;
    lbBackdrop.classList.add('active');
    lbCard.classList.add('active');
  }

  function closeLightbox() {
    if (!lbBackdrop) return;
    lbBackdrop.classList.remove('active');
    lbCard.classList.remove('active');
    if (lbMedia) { if (lbMedia.pause) lbMedia.pause(); lbMedia.remove(); lbMedia = null; }
    lbList = [];
  }

  // ── 页状态（v0.2.21.0 个人主页）──
  var profileId = null;
  var profileUser = null;
  var currentTab = 'posts';
  var TAB_DEFS = [['posts', '帖子'], ['reposts', '转发'], ['likes', '点赞'], ['favorites', '收藏']];
  // v0.2.23.0 卡片背景预设白名单（与后端 social.js/auth.js CARD_BG_KEYS 同步；'' = 默认品牌横幅）+ 中文名
  var CARD_BG_KEYS = ['glass-frost', 'glass-ocean', 'glass-violet', 'glass-rose', 'glass-mint', 'glass-sunset'];
  var CARD_BG_DEFS = [['', '默认'], ['glass-frost', '磨砂'], ['glass-ocean', '深海'], ['glass-violet', '薰衣草'], ['glass-rose', '樱花'], ['glass-mint', '薄荷'], ['glass-sunset', '落日']];
  var TAB_EMPTY = { posts: '还没有发过帖子', reposts: '还没有转发过', likes: '还没有点赞的内容', favorites: '还没有收藏的帖子' };

  function parseProfileId() {
    try {
      var p = new URLSearchParams(window.location.search).get('id');
      return (p && /^USR-\d{6}$/.test(p)) ? p : null;
    } catch (e) { return null; }
  }

  function isGuest() {
    var u = SlatiDB.getUser();
    return !u || String(u.id).indexOf('USR-') !== 0;
  }

  function render404(msg) {
    document.getElementById('profileMain').style.display = 'none';
    var box = document.getElementById('profileState404');
    box.style.display = 'block';
    box.querySelector('p').textContent = msg;
  }

  // 在自己主页的 转发/点赞/收藏 tab 里撤销操作 = 卡片应出列（Twitter 口径）——撤销成功后重拉当前 tab
  function maybeReloadTab(action, removed) {
    if (!removed) return;
    if (action === 'repost' && currentTab === 'reposts') loadTab();
    if (action === 'like' && currentTab === 'likes') loadTab();
    if (action === 'favorite' && currentTab === 'favorites') loadTab();
  }

  // ── 操作处理器（从帖页 tail 逐字复制；仅成功回程加 maybeReloadTab 出列钩子）──
  // 点赞开关：乐观更新 + 失败回滚（与 hub toggleLike 同逻辑）
  function toggleLikeBtn(btn) {
    if (!btn) return;
    if (isGuest()) { toastMsg('登录后才能点赞', true); return; }
    var id = btn.getAttribute('data-like-post');
    var wasLiked = btn.getAttribute('aria-pressed') === 'true';
    var next = !wasLiked;
    var countEl = btn.querySelector('[data-like-count]');
    var iconEl = btn.querySelector('.material-symbols-outlined');
    var before = parseInt(countEl.textContent, 10) || 0;
    btn.setAttribute('aria-pressed', next ? 'true' : 'false');
    if (next) { btn.classList.add('liked'); armLikePop(btn); } else btn.classList.remove('liked', 'like-pop');
    if (iconEl) iconEl.textContent = next ? 'favorite' : 'favorite_border';
    countEl.textContent = before + (next ? 1 : -1);
    MN_API[next ? 'post' : 'del']('/social/posts/' + encodeURIComponent(id) + '/like').then(function (r) {
      if (r.ok && r.data) { countEl.textContent = r.data.likeCount; maybeReloadTab('like', !next); return; }
      btn.setAttribute('aria-pressed', wasLiked ? 'true' : 'false');
      if (wasLiked) btn.classList.add('liked'); else btn.classList.remove('liked', 'like-pop');
      if (iconEl) iconEl.textContent = wasLiked ? 'favorite' : 'favorite_border';
      countEl.textContent = before;
      if (r.status === 401) toastMsg('登录已过期，请重新登录', true);
      else toastMsg('操作失败，请稍后再试', true);
    });
  }

  // v0.2.20.0 收藏开关：star↔star_border + 金色 .favorited，无计数（用户「两个都不需要显示号码」）；乐观更新 + 失败回滚
  function toggleFavorite(btn) {
    if (!btn) return;
    if (isGuest()) { toastMsg('登录后才能收藏', true); return; }
    var id = btn.getAttribute('data-favorite-post');
    var wasFav = btn.getAttribute('aria-pressed') === 'true';
    var next = !wasFav;
    var iconEl = btn.querySelector('.material-symbols-outlined');
    btn.setAttribute('aria-pressed', next ? 'true' : 'false');
    if (next) btn.classList.add('favorited'); else btn.classList.remove('favorited');
    if (iconEl) iconEl.textContent = next ? 'star' : 'star_border';
    MN_API[next ? 'post' : 'del']('/social/posts/' + encodeURIComponent(id) + '/favorite').then(function (r) {
      if (r.ok && r.data) { maybeReloadTab('favorite', !next); return; } // 无计数可同步
      btn.setAttribute('aria-pressed', wasFav ? 'true' : 'false');
      if (wasFav) btn.classList.add('favorited'); else btn.classList.remove('favorited');
      if (iconEl) iconEl.textContent = wasFav ? 'star' : 'star_border';
      if (r.status === 401) toastMsg('登录已过期，请重新登录', true);
      else toastMsg('操作失败，请稍后再试', true);

  // v0.2.18.3 粒子链最后一档（mn-fireworks-position 6.25s）动画完才摘 like-pop——粒子照参考完整飞完再收；
  // 6.8s 兜底（reduced-motion 无 animationend）；类挂在按钮上而非默认渲染里，重渲染/已点赞卡片不重播
  function armLikePop(btn) {
    btn.classList.add('like-pop');
    var burst = btn.querySelector('.like-burst');
    var onEnd = function (e) {
      if (!e || e.animationName !== 'mn-fireworks-position') return;
      burst.removeEventListener('animationend', onEnd);
      btn.classList.remove('like-pop');
    };
    if (burst) burst.addEventListener('animationend', onEnd);
    setTimeout(function () { btn.classList.remove('like-pop'); }, 6800);
  }

  // ── v0.2.19.1 转发开关：免弹窗直转（用户「转发不需要弹窗啊，它就只是在用户主页那边转发给粉丝看」）
  //    点击 = 裸转发（空转发语）直接发到主页；再点 = 撤销。乐观更新 + 失败回滚 ──
  function toggleRepost(btn) {
    if (!btn) return;
    if (isGuest()) { toastMsg('登录后才能转发', true); return; }
    var id = btn.getAttribute('data-repost-post');
    var wasReposted = btn.getAttribute('aria-pressed') === 'true';
    var countEl = btn.querySelector('[data-repost-count]');
    var before = parseInt(countEl.textContent, 10) || 0;
    if (wasReposted) {
      btn.setAttribute('aria-pressed', 'false');
      btn.classList.remove('reposted');
      countEl.textContent = Math.max(before - 1, 0);
      MN_API.del('/social/posts/' + encodeURIComponent(id) + '/repost').then(function (r) {
        if (r.ok && r.data) { countEl.textContent = r.data.repostCount; toastMsg('已取消转发'); maybeReloadTab('repost', true); return; }
        btn.setAttribute('aria-pressed', 'true');
        btn.classList.add('reposted');
        countEl.textContent = before;
        if (r.status === 401) toastMsg('登录已过期，请重新登录', true);
        else toastMsg('操作失败，请稍后再试', true);
      });
    } else {
      setReposted(btn, true, before + 1); // 乐观：先置位再等回程（与点赞同口径）
      MN_API.post('/social/posts/' + encodeURIComponent(id) + '/repost', { content: '' }).then(function (r) {
        if (r.ok && r.data) {
          var status = r.data.post && r.data.post.status;
          if (status === 'removed') { setReposted(btn, false, before); toastMsg('内容违反社区规则，已被拦截', true); return; }
          setReposted(btn, true, r.data.repostCount);
          var verdict = r.data.moderation && r.data.moderation.verdict;
          toastMsg(verdict === 'hold' ? '已转发到你的主页，待审核' : '已转发到你的主页');
        } else if (r.status === 409) {
          setReposted(btn, true, null); // 服务端未返计数——已在别处转发过，按钮同步置位
          toastMsg('你已经转发过这条帖子');
        } else if (r.status === 401) { setReposted(btn, false, before); toastMsg('登录已过期，请重新登录', true); }
        else if (r.status === 429) { setReposted(btn, false, before); toastMsg('转发过于频繁，请稍后再试', true); }
        else { setReposted(btn, false, before); toastMsg('转发失败，请稍后再试', true); }
      });
    }
  }

  function setReposted(btn, on, count) {
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) btn.classList.add('reposted'); else btn.classList.remove('reposted');
    if (count != null) btn.querySelector('[data-repost-count]').textContent = count;
  }

  // ── v0.2.19.0 分享：弹窗 + 同时复制帖子链接（访客可用无门禁）。
  //    v0.2.21.0 主页版：帖子的规范 URL 是帖页——从本页路径同目录换 community-post.html（不硬编码全站路径）──
  function sharePost(id) {
    var url = window.location.origin + window.location.pathname.replace(/community-profile\.html$/, 'community-post.html') + '?id=' + encodeURIComponent(id);
    openShareDialog(url);
  }

  function openShareDialog(url) {
    var backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    var cont = document.createElement('div');
    cont.className = 'modal-container';
    var card = document.createElement('div');
    card.className = 'modal-card';
    card.innerHTML =
      '<h3 style="font-weight:600;font-size:var(--fs-body-lg);margin:0 0 var(--space-sm)">分享帖子</h3>' +
      '<input id="shareUrlInput" type="text" readonly value="' + escapeHtml(url) + '" style="width:100%;padding:10px 12px;border:var(--card-border);border-radius:var(--radius-md);background:var(--color-surface);color:inherit;font-family:inherit;font-size:var(--fs-label-sm)">' +
      '<div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:var(--space-sm)">' +
        '<span class="label-sm" id="shareCopyState" style="color:var(--color-outline);margin-right:auto">正在复制…</span>' +
        '<button type="button" class="btn btn-sm" id="shareCopyAgain">复制链接</button>' +
        '<button type="button" class="btn btn-primary btn-sm" id="shareClose">关闭</button>' +
      '</div>';
    cont.appendChild(card);
    backdrop.appendChild(cont);
    document.body.appendChild(backdrop);
    function close() {
      document.removeEventListener('keydown', onEsc);
      backdrop.remove();
    }
    function onEsc(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onEsc);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
    void card.offsetWidth;
    card.classList.add('active'); // v0.2.19.2 修复：模态系统 .modal-card 默认 opacity:0，必须同时挂 .active（旧版只挂 backdrop → 页面只变模糊、卡片隐形还挡点击）
    backdrop.classList.add('active');
    var stateEl = card.querySelector('#shareCopyState');
    function doCopy() {
      stateEl.textContent = '正在复制…';
      copyLink(url, function (ok) {
        stateEl.textContent = ok ? '链接已复制，可直接粘贴' : '复制失败，请手动选择复制';
      });
    }
    card.querySelector('#shareUrlInput').addEventListener('click', function () { this.select(); });
    card.querySelector('#shareCopyAgain').addEventListener('click', doCopy);
    card.querySelector('#shareClose').addEventListener('click', close);
    doCopy(); // 打开弹窗同时复制（用户钦定）
  }

  function copyLink(url, done) {
    var finish = done || function () {};
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function () { finish(true); },
        function () { finish(legacyCopy(url)); } // 非安全上下文/权限拒绝 → 降级
      );
    } else {
      finish(legacyCopy(url));
    }
  }

  function legacyCopy(url) {
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

    document.body.appendChild(backdrop);
    function close() {
      document.removeEventListener('keydown', onEsc);
      backdrop.remove();
    }
    function onEsc(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onEsc);
    backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
    void card.offsetWidth;
    card.classList.add('active'); // v0.2.19.2 教训：modal-card 默认 opacity:0，必须挂 .active 才可见
    backdrop.classList.add('active');

    // 性别药丸互斥切换
    card.querySelectorAll('#editGenderRow [data-gender]').forEach(function (b) {
      b.addEventListener('click', function () {
        card.querySelectorAll('#editGenderRow [data-gender]').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
      });
    });

    // v0.2.23.0 顶部导航：基础 / 自定义 两 tab 切换（display 互斥）
    var navBtns = card.querySelectorAll('#editNavBtns [data-edit-tab]');
    navBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        var tab = b.getAttribute('data-edit-tab');
        navBtns.forEach(function (x) { x.classList.toggle('active', x === b); });
        card.querySelector('#editTabBasic').style.display = tab === 'basic' ? '' : 'none';
        card.querySelector('#editTabCustom').style.display = tab === 'custom' ? '' : 'none';
      });
    });

    // v0.2.23.0 卡片背景预设选择（data-bg 空串 = 默认 → editCardBg null 恢复默认横幅+无光环）
    card.querySelectorAll('#editBgGrid [data-bg]').forEach(function (b) {
      b.addEventListener('click', function () {
        editCardBg = b.getAttribute('data-bg') || null;
        card.querySelectorAll('#editBgGrid [data-bg]').forEach(function (x) { x.classList.toggle('active', x === b); });
        var fill = card.querySelector('.edit-bg-preview .swatch-fill');
        fill.className = 'swatch-fill' + (editCardBg ? ' ' + editCardBg : ' bg-default');
        card.querySelector('.edit-bg-preview').classList.toggle('has-bg', !!editCardBg); // v0.2.23.3 光环随预设显隐
      });
    });

    // 头像：隐藏 file input 挂卡片内（电池 DOM.setFileInputFiles 可定位）→ 预检 → 直传
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.id = 'editAvatarFile';
    fileInput.accept = '.jpg,.jpeg,.png,.gif,.webp';
    fileInput.style.display = 'none';
    card.appendChild(fileInput);
    card.querySelector('#editAvatarBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].indexOf(ext) === -1) { toastMsg('只支持 jpg / png / gif / webp 图片', true); return; }
      if (f.size > 10 * 1024 * 1024) { toastMsg('图片不能超过 10MB', true); return; }
      var stateEl = card.querySelector('#editSaveState');
      stateEl.textContent = '头像上传中…';
      fetch(MN_API.BASE + '/social/uploads?ext=.' + ext, { method: 'POST', body: f, credentials: 'include' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) {
          if (data && data.url) {
            editPendingAvatar = data.url;
            card.querySelector('#editAvatarPreview').src = data.url;
            stateEl.textContent = '新头像已就绪，点保存生效';
          } else throw new Error('no url');
        })
        .catch(function () {
          stateEl.textContent = '';
          toastMsg('头像上传失败，请稍后再试', true);
        });
    });

    card.querySelector('#editCancelBtn').addEventListener('click', close);

    card.querySelector('#editSaveBtn').addEventListener('click', function () {
      var name = card.querySelector('#editNameInput').value.trim();
      if (!name) { toastMsg('显示名不能为空', true); return; }
      var body = {};
      if (name !== u.displayName) body.displayName = name;
      var bio = card.querySelector('#editBioInput').value;
      if (bio !== (u.bio || '')) body.bio = bio;
      var genderBtn = card.querySelector('#editGenderRow [data-gender].active');
      var gender = genderBtn ? genderBtn.getAttribute('data-gender') : null;
      if (gender && gender !== u.gender) body.gender = gender;
      if (editPendingAvatar) body.avatarUrl = editPendingAvatar;
      // v0.2.23.0 卡片背景（null = 恢复默认，显式入 body）
      if (editCardBg !== (u.cardBg || null)) body.cardBg = editCardBg;
      if (!Object.keys(body).length) { close(); return; } // 没改动直接关
      var stateEl = card.querySelector('#editSaveState');
      var saveBtn = card.querySelector('#editSaveBtn');
      stateEl.textContent = '保存中…';
      saveBtn.disabled = true;
      MN_API.patch('/auth/me', body).then(function (r) {
        saveBtn.disabled = false;
        if (r.ok && r.data && r.data.user) {
          toastMsg('资料已保存');
          var nu = r.data.user;
          // 本页零 localStorage（v0.2.21.0 口径）：不写 SlatiDB——saveUser 会触发 storage.js mirrorProfile
          // 二次 PATCH（全字段+语言/国家/生日回流，双写冗余且可能把陈旧值推回服务端）；
          // localStorage 由下页 cloudMerge 拉 /auth/me 权威覆盖。侧栏同页即时更新直接改同页 DOM
          // （sidebar.js 无公开重渲染 API）。
          var sideName = document.querySelector('#slati-sidebar .user-module .user-name');
          if (sideName && nu.displayName !== undefined) sideName.textContent = nu.displayName;
          if (nu.avatarUrl) {
            var sideAvatar = document.querySelector('#slati-sidebar .user-module .user-info-bar img');
            if (sideAvatar) sideAvatar.src = nu.avatarUrl;
          }
          close();
          loadProfile(); // 头部卡/性别徽章/bio 真后端重拉
        } else if (r.status === 401) {
          stateEl.textContent = '';
          toastMsg('登录已过期，请重新登录', true);
          close();
        } else if (r.status === 429) {
          stateEl.textContent = '';
          toastMsg('操作过于频繁，请稍后再试', true);
        } else {
          stateEl.textContent = '';
          toastMsg((r.data && r.data.error && r.data.error.message) || '保存失败，请稍后再试', true);
        }
      });
    });
  }

  // ── 主页专属：tab + 帖子列表（卡片与 hub renderFeed 同款全操作行）──
  function renderTabs() {
    // v0.2.22.6 点赞/收藏默认私人：非本人只渲染 帖子/转发 两 tab
    var defs = (profileUser && profileUser.isSelf) ? TAB_DEFS : TAB_DEFS.slice(0, 2);
    document.getElementById('profileTabs').innerHTML = '<div class="card profile-tabs">' +
      defs.map(function (t) {
        return '<button type="button" class="profile-tab' + (currentTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';
    document.querySelectorAll('#profileTabs [data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
  }

  function switchTab(tab) {
    if (currentTab === tab) return;
    currentTab = tab;
    renderTabs();
    loadTab();
  }

  function postCardHtml(p) {
    var content = String(p.content || '');
    var media = (p.media || []).filter(function (m) { return MEDIA_URL_RE.test(m); });
    return '<div class="card card-hover tilt-container post-card-click" data-cloud-id="' + escapeHtml(p.id) + '">' +
      '<div class="flex-center gap-sm" style="justify-content:flex-start;margin-bottom:8px">' +
        // v0.2.21.0 作者头像+徽章+名字包锚 → 个人主页（likes/favorites tab 卡片作者可能是他人；时间/report 留在锚外）
        (p.authorId ? '<a class="post-author-link" href="community-profile.html?id=' + encodeURIComponent(p.authorId) + '" title="查看主页">' : '') +
        (p.avatarUrl ? '<img src="' + escapeHtml(p.avatarUrl) + '" alt="" class="avatar avatar-sm" style="margin-right:6px">' : '<span class="material-symbols-outlined" style="color:var(--color-outline);font-size:22px">person</span>') +
        '<span class="badge ' + (p.repostOfId ? 'badge-success' : 'badge-primary') + '">' + (p.repostOfId ? '转发了' : 'Citizen Post') + '</span>' +
        '<span style="font-weight:600;font-size:var(--fs-label-md)">' + escapeHtml(p.authorName || 'Citizen') + '</span>' +
        (p.authorId ? '</a>' : '') +
        '<span class="label-sm" style="margin-left:auto;color:var(--color-outline)">' + escapeHtml(relativeTime(p.createdAt)) + '</span>' +
        '<button data-cloud-post="' + escapeHtml(p.id) + '" title="Report" style="border:none;background:transparent;color:var(--color-outline);cursor:pointer;padding:2px;margin-left:4px"><span class="material-symbols-outlined" style="font-size:16px">flag</span></button>' +
      '</div>' +
      (content.length > 90
        ? '<h4 style="font-weight:600;font-size:var(--fs-body-md);margin-bottom:4px">' + escapeHtml(content.slice(0, 90)) + '…</h4>' +
          '<p style="color:var(--color-on-surface-variant);font-size:var(--fs-label-md);margin-bottom:8px">' + escapeHtml(content.slice(90, 240)) + '</p>'
        : (content ? '<p style="color:var(--color-on-surface-variant);font-size:var(--fs-label-md);margin-bottom:8px">' + escapeHtml(content) + '</p>' : '')) +
      (p.repostOfId ? repostEmbeddedHtml(p.repostOf) : '') +
      (media.length ? mediaGridHtml(media) : '') +
      // v0.2.20.0 操作行：[赞][评][转][浏览][☆收藏][⇧分享]——与 hub/帖页同款全功能
      '<div class="flex-center gap-sm" style="justify-content:flex-start;gap:16px">' +
        '<button type="button" class="post-action-btn' + (p.likedByMe ? ' liked' : '') + '" data-like-post="' + escapeHtml(p.id) + '" aria-pressed="' + (p.likedByMe ? 'true' : 'false') + '"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">' + (p.likedByMe ? 'favorite' : 'favorite_border') + '</span><span class="like-burst" aria-hidden="true"><span class="like-fx"></span></span> <span data-like-count>' + (p.likeCount || 0) + '</span></button>' +
        '<span class="post-action-btn post-action-btn-static label-sm" style="color:var(--color-outline)"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-3px">chat_bubble</span> ' + (p.commentCount || 0) + '</span>' +
        '<button type="button" class="post-action-btn' + (p.repostedByMe ? ' reposted' : '') + '" data-repost-post="' + escapeHtml(p.id) + '" aria-pressed="' + (p.repostedByMe ? 'true' : 'false') + '"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">repeat</span> <span data-repost-count>' + (p.repostCount || 0) + '</span></button>' +
        '<span class="post-action-btn post-action-btn-static label-sm" style="color:var(--color-outline)"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-3px">visibility</span> ' + (p.viewCount || 0) + '</span>' +
        '<button type="button" class="post-action-btn' + (p.favoritedByMe ? ' favorited' : '') + '" data-favorite-post="' + escapeHtml(p.id) + '" aria-pressed="' + (p.favoritedByMe ? 'true' : 'false') + '" title="收藏" style="margin-left:auto;margin-right:-22px"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">' + (p.favoritedByMe ? 'star' : 'star_border') + '</span></button>' +
        '<button type="button" class="post-action-btn" data-share-post="' + escapeHtml(p.id) + '" title="分享"><span class="material-symbols-outlined" style="font-size:20px;vertical-align:-3px">upload</span></button>' +
      '</div>' +
    '</div>';
  }

  function renderList(posts) {
    var list = document.getElementById('profileList');
    if (!posts.length) {
      list.innerHTML = '<div class="card profile-empty">' + (TAB_EMPTY[currentTab] || '还没有内容') + '</div>';
      return;
    }
    list.innerHTML = posts.map(postCardHtml).join('');
    if (window.SlatiTilt) SlatiTilt.init(document.querySelectorAll('.tilt-container'));
    closeLightbox(); // 重渲染清掉卡片 DOM，先关灯箱防悬空
    // 媒体瓦片 → 灯箱（每个网格闭包持自己的 URL 列表，src 反推零耦合）
    document.querySelectorAll('#profileList .post-media').forEach(function (grid) {
      var urls = [];
      grid.querySelectorAll('.pm-tile').forEach(function (tile) {
        var el = tile.querySelector('img, video');
        if (el) urls.push(el.getAttribute('src'));
      });
      grid.querySelectorAll('.pm-tile').forEach(function (tile, i) {
        tile.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(urls, i); });
      });
    });
    // 举报 + 操作行 + 整卡点击（每次重渲染后重新挂）
    document.querySelectorAll('#profileList [data-cloud-post]').forEach(function (el) {
      MN_Report.mount(el, { targetType: 'post', targetId: el.getAttribute('data-cloud-post') });
    });
    document.querySelectorAll('#profileList [data-like-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); toggleLikeBtn(btn); });
    });
    document.querySelectorAll('#profileList [data-repost-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); toggleRepost(btn); });
    });
    document.querySelectorAll('#profileList [data-favorite-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); toggleFavorite(btn); });
    });
    document.querySelectorAll('#profileList [data-share-post]').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.stopPropagation(); sharePost(btn.getAttribute('data-share-post')); });
    });
    // 整卡点击 → 独立帖页（按钮内/锚内/文字选区不跳）
    document.querySelectorAll('#profileList [data-cloud-id]').forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.closest('button')) return;
        if (e.target.closest('a')) return; // 作者锚走自己的 href，不抢整卡跳转
        if (window.getSelection && String(window.getSelection()).length) return;
        window.location.href = 'community-post.html?id=' + encodeURIComponent(card.getAttribute('data-cloud-id'));
      });
    });
  }

  function loadTab() {
    MN_API.get('/social/users/' + profileId + '/posts?tab=' + encodeURIComponent(currentTab)).then(function (r) {
      if (!r.ok || !r.data || !Array.isArray(r.data.posts)) { renderList([]); return; }
      renderList(r.data.posts);
    });
  }

  function loadProfile() {
    MN_API.get('/social/users/' + profileId).then(function (r) {
      if (r.status === 404 || (r.ok && !r.data.user)) { render404('用户不存在或已注销'); return; }
      if (!r.ok || !r.data || !r.data.user) { render404('加载失败，请稍后再试'); return; }
      profileUser = r.data.user;
      document.getElementById('profileState404').style.display = 'none';
      document.getElementById('profileMain').style.display = 'flex';
      renderHeader(profileUser);
      renderTabs();
      loadTab();
    });
  }

  // ── 初始化 ──
  profileId = parseProfileId();
  if (!profileId) render404('用户不存在或已注销');
  else loadProfile();
})();
</script>
<script src="../assets/js/transitions.js"></script>
<script>/* pre-stagger 兜底（切页闪修复 08-28）：若 transitions.js 未执行，1.6s 后解除隐藏防页面永久空白 */
setTimeout(function () { var b = document.body; if (b) b.classList.remove('pre-stagger'); }, 1600);
</script>
</body>
